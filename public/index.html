<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Prados del Sol - Gestión Estable</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body { background-color: #f0f2f5; font-family: 'Segoe UI', sans-serif; }
        #loginScreen { background: #212529; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { background: white; border-radius: 20px; padding: 40px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .sidebar { background-color: #212529; color: white; min-height: 100vh; padding: 20px; }
        .nav-link { color: #adb5bd; cursor: pointer; margin-bottom: 10px; border-radius: 8px; padding: 10px; transition: 0.3s; }
        .nav-link:hover, .nav-link.active { background: #0d6efd; color: white; }
        .hidden { display: none !important; }
        .card { border-radius: 12px; border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

<div id="loginScreen">
    <div class="login-card">
        <h3 class="text-center mb-4">PRADOS DEL SOL</h3>
        <input type="email" id="loginEmail" class="form-control mb-3" placeholder="Email">
        <input type="password" id="loginPass" class="form-control mb-3" placeholder="Contraseña">
        <button onclick="login()" class="btn btn-primary w-100">INGRESAR</button>
    </div>
</div>

<div id="appSystem" class="container-fluid hidden">
    <div class="row">
        <div class="col-md-2 sidebar">
            <h5 class="mb-4 text-info">MENU</h5>
            <div class="nav flex-column">
                <div class="nav-link active" onclick="showTab('stock')"><i class="fas fa-boxes me-2"></i> Stock</div>
                <div class="nav-link" onclick="showTab('ventas')"><i class="fas fa-truck me-2"></i> Ventas</div>
                <div class="nav-link" onclick="showTab('historial')"><i class="fas fa-history me-2"></i> Historial</div>
                <div class="nav-link" onclick="showTab('config')"><i class="fas fa-cog me-2"></i> Configuración</div>
                <div class="nav-link text-danger mt-5" onclick="logout()"><i class="fas fa-power-off me-2"></i> Salir</div>
            </div>
        </div>

        <div class="col-md-10 p-4">
            <div id="stock" class="content-section">
                <div class="row mb-4">
                    <div class="col-md-7">
                        <div class="card p-3">
                            <h5 class="fw-bold">Carga de Stock</h5>
                            <div class="row g-2">
                                <div class="col-6"><select id="selProveedor" class="form-select" onchange="filtrarArticulosAcuerdo()"></select></div>
                                <div class="col-6"><select id="selArticulo" class="form-select" onchange="calcularCarga()"></select></div>
                                <div class="col-4"><select id="selTipoCarga" class="form-select" onchange="calcularCarga()"><option value="p">Pallets</option><option value="c">Cajas</option><option value="u">Unidades</option></select></div>
                                <div class="col-4"><input type="number" id="inpCantidad" class="form-control" placeholder="Cant." oninput="calcularCarga()"></div>
                                <div class="col-4"><button class="btn btn-success w-100" onclick="guardarIngreso()">SUMAR</button></div>
                            </div>
                            <div class="mt-2 small fw-bold">Total Unidades: <span id="txtTotalFinal">0</span></div>
                        </div>
                    </div>
                </div>
                <div class="card p-3">
                    <table class="table">
                        <thead><tr><th>Artículo</th><th class="text-center">Stock</th><th class="text-end">Acción</th></tr></thead>
                        <tbody id="tablaStock"></tbody>
                    </table>
                </div>
            </div>

            <div id="ventas" class="content-section hidden">
                <div class="card p-4">
                    <h5 class="fw-bold mb-3 text-primary">Nuevo Despacho</h5>
                    <div class="row g-3">
                        <div class="col-md-6"><label class="small fw-bold">Producto</label><select id="vtaArticulo" class="form-select" onchange="actualizarPrevisualizacion()"></select></div>
                        <div class="col-md-6"><label class="small fw-bold">Patente</label><input type="text" id="vtaPatente" class="form-control" style="text-transform: uppercase;"></div>
                        <div class="col-4"><label class="small">Pallets</label><input type="number" id="vtaPallets" class="form-control" value="28" oninput="actualizarPrevisualizacion()"></div>
                        <div class="col-4"><label class="small">Cajas x P</label><input type="number" id="vtaCxP" class="form-control" value="75" oninput="actualizarPrevisualizacion()"></div>
                        <div class="col-4"><label class="small">Unid x C</label><input type="number" id="vtaUxC" class="form-control" value="12" oninput="actualizarPrevisualizacion()"></div>
                    </div>
                    <div class="mt-4 p-3 bg-light rounded border text-center">
                        <div class="row">
                            <div class="col"><b>Aceite:</b> <span id="resTotalAceite">0</span> u</div>
                            <div class="col"><b>Cajas:</b> <span id="resTotalCajas">0</span> u</div>
                            <div class="col"><b>Etiquetas:</b> <span id="resTotalEtiquetas">0</span> u</div>
                        </div>
                    </div>
                    <button class="btn btn-primary w-100 mt-4 py-2 fw-bold" onclick="procesarDespacho()">CONFIRMAR SALIDA</button>
                </div>
            </div>

            <div id="historial" class="content-section hidden">
                <div class="card p-3">
                    <div class="d-flex justify-content-between mb-3">
                        <h5>Movimientos del Mes</h5>
                        <input type="month" id="filtroMes" class="form-control w-auto" onchange="cargarHistorial()">
                    </div>
                    <table class="table table-sm">
                        <thead><tr><th>Fecha</th><th>Artículo</th><th>Info</th><th class="text-center">Cant.</th><th></th></tr></thead>
                        <tbody id="listaHistorial"></tbody>
                    </table>
                </div>
            </div>

            <div id="config" class="content-section hidden">
                <div class="row g-3">
                    <div class="col-md-6">
                        <div class="card p-3">
                            <h6 class="fw-bold">Artículos (Maestro)</h6>
                            <div class="input-group mb-2"><input type="text" id="confNuevoArt" class="form-control" placeholder="Nombre del artículo"><button class="btn btn-dark" onclick="guardarArt()">+</button></div>
                            <div id="listaArts" style="max-height: 200px; overflow-y: auto;"></div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="card p-3">
                            <h6 class="fw-bold">Proveedores</h6>
                            <div class="input-group mb-2"><input type="text" id="provNombre" class="form-control" placeholder="Nombre proveedor"><button class="btn btn-dark" onclick="guardarProv()">+</button></div>
                            <div id="listaProvs" class="row g-1"></div>
                        </div>
                    </div>
                    <div class="col-12">
                        <div class="card p-3">
                            <h6 class="fw-bold">Acuerdos (Vínculo Prov-Art)</h6>
                            <div class="row g-2">
                                <div class="col-md-3"><select id="acProv" class="form-select"></select></div>
                                <div class="col-md-3"><select id="acArt" class="form-select"></select></div>
                                <div class="col-md-2"><input type="number" id="acUxC" class="form-control" placeholder="U x C"></div>
                                <div class="col-md-2"><input type="number" id="acCxP" class="form-control" placeholder="C x P"></div>
                                <div class="col-md-2"><button class="btn btn-warning w-100 fw-bold" onclick="guardarAcuerdo()">VINCULAR</button></div>
                            </div>
                            <div id="listaAcuerdos" class="mt-3"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // CONFIGURACIÓN FIREBASE
    const firebaseConfig = {
      apiKey: "AIzaSyCjYp0idCxs32QAofYLVEGcwvmd3HXy-3Y",
      authDomain: "prados-del-sol.firebaseapp.com",
      projectId: "prados-del-sol",
      storageBucket: "prados-del-sol.firebasestorage.app",
      messagingSenderId: "30316921952",
      appId: "1:30316921952:web:b0f88b9c35f270d548ef05"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    let articulos = [], proveedores = [], acuerdos = [], stockActualGlobal = {};

    function login() { auth.signInWithEmailAndPassword(document.getElementById('loginEmail').value, document.getElementById('loginPass').value); }
    function logout() { auth.signOut(); }
    
    auth.onAuthStateChanged(user => {
        if (user) { 
            document.getElementById('loginScreen').classList.add('hidden'); 
            document.getElementById('appSystem').classList.remove('hidden'); 
            const hoy = new Date();
            document.getElementById('filtroMes').value = hoy.getFullYear() + "-" + String(hoy.getMonth()+1).padStart(2, '0');
            iniciarApp(); 
        } else {
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('appSystem').classList.add('hidden');
        }
    });

    async function iniciarApp() {
        // Artículos
        db.collection("articulos").orderBy("nombre").onSnapshot(s => {
            articulos = s.docs.map(d => ({id:d.id, ...d.data()}));
            document.getElementById('vtaArticulo').innerHTML = '<option value="">-- Seleccionar --</option>' + articulos.map(a => `<option value="${a.nombre}">${a.nombre}</option>`).join('');
            document.getElementById('acArt').innerHTML = articulos.map(a => `<option value="${a.nombre}">${a.nombre}</option>`).join('');
            renderMaestro();
        });

        // Proveedores
        db.collection("proveedores").orderBy("nombre").onSnapshot(s => {
            proveedores = s.docs.map(d => ({id:d.id, ...d.data()}));
            const html = '<option value="">-- Prov --</option>' + proveedores.map(p => `<option value="${p.nombre}">${p.nombre}</option>`).join('');
            document.getElementById('selProveedor').innerHTML = html;
            document.getElementById('acProv').innerHTML = html;
            document.getElementById('listaProvs').innerHTML = proveedores.map(p => `<div class="col-md-3 border p-1 small">${p.nombre} <i class="fas fa-trash text-danger float-end" style="cursor:pointer" onclick="db.collection('proveedores').doc('${p.id}').delete()"></i></div>`).join('');
        });

        // Acuerdos
        db.collection("acuerdos").onSnapshot(s => { 
            acuerdos = s.docs.map(d => ({id:d.id, ...d.data()}));
            document.getElementById('listaAcuerdos').innerHTML = acuerdos.map(a => `<div class="border-bottom py-1 small">${a.proveedor} -> ${a.articulo} (UxC:${a.uxc} CxP:${a.cxp}) <i class="fas fa-times text-danger float-end" onclick="db.collection('acuerdos').doc('${a.id}').delete()"></i></div>`).join('');
        });

        // Stock
        db.collection("stock").onSnapshot(s => {
            const res = {}; 
            s.docs.forEach(d => { 
                const data = d.data();
                res[data.articulo] = (res[data.articulo] || 0) + data.cantidad; 
            });
            stockActualGlobal = res;
            document.getElementById('tablaStock').innerHTML = Object.keys(res).sort().map(name => `<tr><td>${name}</td><td class="text-center fw-bold">${res[name].toLocaleString()}</td><td class="text-end"><i class="fas fa-trash text-muted" onclick="vaciarArticulo('${name}')"></i></td></tr>`).join('');
        });
    }

    // --- LÓGICA DE DESCUENTO PRECISO (IDÉNTICO A V12) ---
    async function procesarDespacho() {
        const prod = document.getElementById('vtaArticulo').value;
        const pat = document.getElementById('vtaPatente').value.trim().toUpperCase();
        const totalU = parseInt(document.getElementById('resTotalAceite').innerText.replace(/\./g,''));
        const totalC = parseInt(document.getElementById('resTotalCajas').innerText.replace(/\./g,''));
        
        if(!prod || totalU <= 0 || !pat) return alert("Complete Producto y Patente");

        const batch = db.batch();
        const ahora = firebase.firestore.FieldValue.serverTimestamp();

        // 1. Aceite
        batch.set(db.collection("stock").doc(), { articulo: prod, cantidad: -totalU, patente: pat, tipo: "venta", fecha: ahora });

        // 2. Cajas y Etiquetas (Comparación EXACTA por volumen)
        let n = prod.toLowerCase();
        let vol = n.includes("900") ? "900cc" : n.includes("1.5") ? "1.5lts" : n.includes("5") ? "5lts" : "";
        
        if(vol) {
            batch.set(db.collection("stock").doc(), { articulo: "caja de " + vol, cantidad: -totalC, tipo: "venta", fecha: ahora });
            batch.set(db.collection("stock").doc(), { articulo: "etiqueta de " + vol, cantidad: -totalU, tipo: "venta", fecha: ahora });
        }

        await batch.commit();
        alert("Despacho Exitoso");
        document.getElementById('vtaPatente').value = "";
    }

    // --- FUNCIONES DE CONFIGURACIÓN ---
    function guardarArt() { const n = document.getElementById('confNuevoArt').value; if(n) db.collection("articulos").add({nombre: n.toLowerCase()}); }
    function renderMaestro() { document.getElementById('listaArts').innerHTML = articulos.map(a => `<div class="border-bottom p-1 small">${a.nombre} <i class="fas fa-trash text-danger float-end" onclick="db.collection('articulos').doc('${a.id}').delete()"></i></div>`).join(''); }
    function guardarProv() { const n = document.getElementById('provNombre').value; if(n) db.collection("proveedores").add({nombre: n}); }
    function guardarAcuerdo() { db.collection("acuerdos").add({proveedor: document.getElementById('acProv').value, articulo: document.getElementById('acArt').value, uxc: parseInt(document.getElementById('acUxC').value), cxp: parseInt(document.getElementById('acCxP').value)}); }

    // --- HISTORIAL ---
    async function cargarHistorial() {
        const mes = document.getElementById('filtroMes').value;
        const start = new Date(mes + "-01T00:00:00");
        const end = new Date(start.getFullYear(), start.getMonth() + 1, 0, 23, 59, 59);
        const snp = await db.collection("stock").where("fecha", ">=", start).where("fecha", "<=", end).orderBy("fecha", "desc").get();
        document.getElementById('listaHistorial').innerHTML = snp.docs.map(doc => {
            const d = doc.data();
            return `<tr><td>${d.fecha ? d.fecha.toDate().toLocaleDateString() : ''}</td><td>${d.articulo}</td><td>${d.patente || ''}</td><td class="text-center ${d.cantidad<0?'text-danger':'text-success'}">${d.cantidad}</td><td><i class="fas fa-times text-danger" onclick="db.collection('stock').doc('${doc.id}').delete(); cargarHistorial();"></i></td></tr>`;
        }).join('');
    }

    // --- AUXILIARES ---
    function showTab(id) {
        document.querySelectorAll('.content-section').forEach(s => s.classList.add('hidden'));
        document.querySelectorAll('.nav-link').forEach(n => n.classList.remove('active'));
        document.getElementById(id).classList.remove('hidden');
        if(id === 'historial') cargarHistorial();
    }
    function filtrarArticulosAcuerdo() {
        const prov = document.getElementById('selProveedor').value;
        const filtrados = acuerdos.filter(a => a.proveedor === prov);
        document.getElementById('selArticulo').innerHTML = '<option value="">-- Art --</option>' + filtrados.map(a => `<option value="${a.articulo}">${a.articulo}</option>`).join('');
    }
    function calcularCarga() {
        const prov = document.getElementById('selProveedor').value;
        const art = document.getElementById('selArticulo').value;
        const cant = parseInt(document.getElementById('inpCantidad').value) || 0;
        const tipo = document.getElementById('selTipoCarga').value;
        const ac = acuerdos.find(x => x.proveedor === prov && x.articulo === art);
        let total = (ac && tipo === 'p') ? cant * ac.cxp * ac.uxc : (ac && tipo === 'c') ? cant * ac.uxc : cant;
        document.getElementById('txtTotalFinal').innerText = total.toLocaleString();
    }
    async function guardarIngreso() {
        const art = document.getElementById('selArticulo').value;
        const totalU = parseInt(document.getElementById('txtTotalFinal').innerText.replace(/\./g,''));
        if(art && totalU > 0) { await db.collection("stock").add({ articulo: art, cantidad: totalU, tipo: "ingreso", fecha: firebase.firestore.FieldValue.serverTimestamp() }); alert("Sumado"); }
    }
    function actualizarPrevisualizacion() {
        const p = parseInt(document.getElementById('vtaPallets').value) || 0;
        const c = parseInt(document.getElementById('vtaCxP').value) || 0;
        const u = parseInt(document.getElementById('vtaUxC').value) || 0;
        document.getElementById('resTotalAceite').innerText = (p * c * u).toLocaleString();
        document.getElementById('resTotalCajas').innerText = (p * c).toLocaleString();
        document.getElementById('resTotalEtiquetas').innerText = (p * c * u).toLocaleString();
    }
    async function vaciarArticulo(n) { if(confirm("¿Vaciar stock?")) { const snp = await db.collection("stock").where("articulo","==",n).get(); const b = db.batch(); snp.forEach(d => b.delete(d.ref)); await b.commit(); } }
</script>
</body>
</html>
