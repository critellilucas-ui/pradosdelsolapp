<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Prados del Sol - Gestión Logística v12</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body { background-color: #f0f2f5; font-family: 'Segoe UI', sans-serif; overflow-x: hidden; }
        .sidebar { background-color: #212529; color: white; padding: 15px; z-index: 1000; }
        @media (min-width: 768px) {
            .sidebar { min-height: 100vh; position: sticky; top: 0; }
        }
        @media (max-width: 767px) {
            .sidebar { position: relative; min-height: auto; padding: 10px; }
            .nav-custom { display: flex; overflow-x: auto; white-space: nowrap; gap: 5px; }
            .nav-link { font-size: 0.85rem; padding: 8px 12px !important; flex: 0 0 auto; border: 1px solid #444; }
        }
        .nav-link { color: #adb5bd; cursor: pointer; padding: 12px; border-radius: 8px; text-decoration: none; transition: 0.3s; }
        .nav-link:hover, .nav-link.active { color: white; background-color: #0d6efd; }
        .hidden { display: none !important; }
        .card { border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border-radius: 12px; margin-bottom: 15px; }
        .stock-peligro { background-color: #fff5f5 !important; color: #dc3545 !important; border-left: 5px solid #dc3545 !important; }
        input, select { height: 45px !important; }
        .resumen-vta { background: #e9ecef; border-radius: 8px; padding: 10px; }
    </style>
</head>
<body>

<div id="loginScreen" class="container d-flex justify-content-center align-items-center vh-100 p-3">
    <div class="card p-4 shadow-lg w-100" style="max-width: 400px;">
        <h4 class="text-center mb-4 text-primary fw-bold">PRADOS DEL SOL</h4>
        <input type="email" id="loginEmail" class="form-control mb-3" placeholder="Correo">
        <input type="password" id="loginPass" class="form-control mb-3" placeholder="Contraseña">
        <button onclick="login()" class="btn btn-primary w-100">INGRESAR</button>
    </div>
</div>

<div id="appSystem" class="container-fluid hidden">
    <div class="row">
        <div class="col-md-2 sidebar">
            <h5 class="text-center mb-4 border-bottom pb-2 text-info sidebar-title">SISTEMA PRADOS</h5>
            <nav class="nav-custom">
                <a class="nav-link active" onclick="showTab('stock')"><i class="fas fa-boxes me-1"></i> Stock</a>
                <a class="nav-link" onclick="showTab('ventas')"><i class="fas fa-truck me-1"></i> Ventas</a>
                <a class="nav-link" onclick="showTab('historial')"><i class="fas fa-history me-1"></i> Historial</a>
                <a class="nav-link" onclick="showTab('clientes')"><i class="fas fa-users me-1"></i> Clientes</a>
                <a class="nav-link" onclick="showTab('config')"><i class="fas fa-cog me-1"></i> Config</a>
                <a class="nav-link text-danger" onclick="logout()"><i class="fas fa-power-off"></i></a>
            </nav>
        </div>

        <div class="col-md-10 p-2 p-md-4">
            
            <div id="stock" class="content-section">
                <div class="row">
                    <div class="col-lg-8">
                        <div class="card p-3 border-top border-success border-4 shadow-sm">
                            <h5 class="mb-3 text-success fw-bold">Carga por Proveedor</h5>
                            <div class="row g-2">
                                <div class="col-6 col-md-4"><label class="small fw-bold">Proveedor</label><select id="selProveedor" class="form-select" onchange="filtrarArticulosAcuerdo()"></select></div>
                                <div class="col-6 col-md-4"><label class="small fw-bold">Artículo</label><select id="selArticulo" class="form-select" onchange="calcularCarga()"></select></div>
                                <div class="col-6 col-md-2"><label class="small fw-bold">Tipo</label>
                                    <select id="selTipoCarga" class="form-select" onchange="calcularCarga()"><option value="p">Pallets</option><option value="c">Cajas</option><option value="u">Unidades</option></select>
                                </div>
                                <div class="col-6 col-md-2"><label class="small fw-bold">Cantidad</label><input type="number" id="inpCantidad" class="form-control" oninput="calcularCarga()"></div>
                            </div>
                            <div class="mt-3 d-flex justify-content-between align-items-center bg-light p-2 rounded">
                                <span class="small fw-bold">Total: <span id="txtTotalFinal" class="text-success fs-5">0</span> u.</span>
                                <button class="btn btn-success btn-sm" onclick="guardarIngreso()">CONFIRMAR</button>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-4">
                        <div class="card p-3 border-top border-warning border-4 shadow-sm">
                            <h5 class="text-warning fw-bold">Uso de Fábrica</h5>
                            <select id="consumoArticulo" class="form-select mb-2"></select>
                            <div class="input-group">
                                <input type="number" id="consumoCantidad" class="form-control" placeholder="Cant.">
                                <button class="btn btn-warning text-white" onclick="registrarConsumo()">RESTAR</button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="card p-2 shadow-sm">
                    <div class="d-flex justify-content-between align-items-center p-2">
                        <h6 class="mb-0 fw-bold">Inventario Actual</h6>
                        <button class="btn btn-sm btn-outline-success" onclick="exportarExcel()"><i class="fas fa-file-excel"></i></button>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-sm align-middle mb-0">
                            <thead class="table-dark"><tr><th>Artículo</th><th class="text-center">Stock</th><th class="text-center">Mín.</th><th class="text-end"></th></tr></thead>
                            <tbody id="tablaStock" style="font-size: 0.9rem;"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div id="ventas" class="content-section hidden">
                <div class="card p-3 border-top border-primary border-4 shadow-sm">
                    <h5 class="text-primary fw-bold mb-3">Nueva Venta / Despacho</h5>
                    <div class="row g-2">
                        <div class="col-12 col-md-6"><label class="small fw-bold">Cliente</label><select id="vtaCliente" class="form-select"></select></div>
                        <div class="col-12 col-md-6"><label class="small fw-bold">Producto</label><select id="vtaArticulo" class="form-select" onchange="actualizarPrevisualizacion()"></select></div>
                        <div class="col-4"><label class="small">Pallets</label><input type="number" id="vtaPallets" class="form-control" value="28" oninput="actualizarPrevisualizacion()"></div>
                        <div class="col-4"><label class="small">CxP</label><input type="number" id="vtaCxP" class="form-control" value="75" oninput="actualizarPrevisualizacion()"></div>
                        <div class="col-4"><label class="small">UxC</label><input type="number" id="vtaUxC" class="form-control" value="12" oninput="actualizarPrevisualizacion()"></div>
                    </div>
                    
                    <div class="row g-2 mt-3 border-top pt-2">
                        <div class="col-6"><label class="small fw-bold text-muted">Transporte</label><input type="text" id="vtaTransporte" class="form-control form-control-sm" placeholder="Chofer / Empresa"></div>
                        <div class="col-6"><label class="small fw-bold text-muted">Patente</label><input type="text" id="vtaPatente" class="form-control form-control-sm" placeholder="Vehículo"></div>
                    </div>

                    <div class="resumen-vta mt-3 d-flex justify-content-around text-center border">
                        <div><small class="d-block text-muted">Aceite (u)</small><span class="fw-bold text-danger" id="resTotalAceite">0</span></div>
                        <div><small class="d-block text-muted">Cajas</small><span class="fw-bold text-primary" id="resTotalCajas">0</span></div>
                        <div><small class="d-block text-muted">Etiquetas</small><span class="fw-bold text-success" id="resTotalEtiquetas">0</span></div>
                    </div>
                    <button class="btn btn-primary w-100 mt-3 py-2 fw-bold" onclick="procesarDespacho()">CONFIRMAR Y GENERAR REMITO</button>
                </div>
            </div>

            <div id="historial" class="content-section hidden">
                <div class="card p-3 border-top border-info border-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="fw-bold mb-0">Historial</h5>
                        <div class="d-flex gap-2 w-75 justify-content-end">
                            <input type="month" id="filtroMes" class="form-control form-control-sm w-50" onchange="cargarHistorial()">
                            <button class="btn btn-danger btn-sm" onclick="resetTotalMovimientos()"><i class="fas fa-sync"></i> RESET</button>
                        </div>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-sm" style="font-size: 0.8rem;">
                            <thead><tr><th>Fecha</th><th>Art.</th><th>Tipo</th><th class="text-center">Cant.</th></tr></thead>
                            <tbody id="listaHistorial"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div id="clientes" class="content-section hidden">
                <div class="card p-3">
                    <h6 class="fw-bold">Gestión Fiscal de Clientes</h6>
                    <div class="row g-2 mb-3">
                        <div class="col-12"><input type="text" id="cliNombre" class="form-control" placeholder="Razón Social"></div>
                        <div class="col-6"><input type="text" id="cliCuit" class="form-control" placeholder="CUIT"></div>
                        <div class="col-6">
                            <select id="cliIva" class="form-select">
                                <option value="Responsable Inscripto">Resp. Inscripto</option>
                                <option value="Monotributo">Monotributo</option>
                                <option value="Exento">Exento</option>
                                <option value="Consumidor Final">Cons. Final</option>
                            </select>
                        </div>
                        <div class="col-12"><input type="text" id="cliDir" class="form-control" placeholder="Dirección Completa (Calle, N°, Localidad)"></div>
                        <button class="btn btn-dark w-100 mt-2" onclick="guardarCliente()">GUARDAR CLIENTE</button>
                    </div>
                    <div class="table-responsive"><table class="table table-sm"><tbody id="tablaClientes"></tbody></table></div>
                </div>
            </div>

            <div id="config" class="content-section hidden">
                <div class="row g-3">
                    <div class="col-12 col-md-6">
                        <div class="card p-3">
                            <h6 class="fw-bold border-bottom pb-2">Maestro Artículos</h6>
                            <div class="input-group input-group-sm mb-2">
                                <input type="text" id="confNuevoArt" class="form-control" placeholder="Nombre">
                                <input type="number" id="confMinArt" class="form-control" placeholder="Mín">
                                <button class="btn btn-info text-white" onclick="guardarArt()">+</button>
                            </div>
                            <div id="listaArts" class="list-group list-group-flush" style="max-height: 200px; overflow-y: auto;"></div>
                        </div>
                    </div>
                    <div class="col-12 col-md-6">
                        <div class="card p-3">
                            <h6 class="fw-bold border-bottom pb-2">Vínculos Proveedor</h6>
                            <div class="row g-1">
                                <div class="col-6"><select id="acProv" class="form-select form-select-sm"></select></div>
                                <div class="col-6"><select id="acArt" class="form-select form-select-sm"></select></div>
                                <div class="col-6"><input type="number" id="acUxC" class="form-control form-select-sm" placeholder="U/C"></div>
                                <div class="col-6"><input type="number" id="acCxP" class="form-control form-select-sm" placeholder="C/P"></div>
                                <button class="btn btn-warning btn-sm w-100 mt-1 fw-bold" onclick="guardarAcuerdo()">VINCULAR</button>
                            </div>
                            <div id="listaAcuerdos" class="mt-2 small" style="max-height: 150px; overflow-y: auto;"></div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyCjYp0idCxs32QAofYLVEGcwvmd3HXy-3Y",
      authDomain: "prados-del-sol.firebaseapp.com",
      projectId: "prados-del-sol",
      storageBucket: "prados-del-sol.firebasestorage.app",
      messagingSenderId: "30316921952",
      appId: "1:30316921952:web:b0f88b9c35f270d548ef05"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    let articulos = [], proveedores = [], acuerdos = [], clientes = [], stockActualGlobal = {};

    function login() { auth.signInWithEmailAndPassword(document.getElementById('loginEmail').value, document.getElementById('loginPass').value); }
    function logout() { auth.signOut(); }
    auth.onAuthStateChanged(user => {
        if (user) { 
            document.getElementById('loginScreen').classList.add('hidden'); 
            document.getElementById('appSystem').classList.remove('hidden'); 
            iniciarApp(); 
        } else {
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('appSystem').classList.add('hidden');
        }
    });

    async function iniciarApp() {
        const hoy = new Date();
        document.getElementById('filtroMes').value = hoy.getFullYear() + "-" + String(hoy.getMonth()+1).padStart(2, '0');

        db.collection("articulos").orderBy("nombre").onSnapshot(s => {
            articulos = s.docs.map(d => ({id:d.id, ...d.data()}));
            renderMaestro();
            const html = articulos.map(a => `<option value="${a.nombre}">${a.nombre}</option>`).join('');
            document.getElementById('acArt').innerHTML = html;
            document.getElementById('vtaArticulo').innerHTML = '<option value="">-- Prod --</option>' + html;
            document.getElementById('consumoArticulo').innerHTML = '<option value="">-- Uso --</option>' + html;
        });
        db.collection("proveedores").orderBy("nombre").onSnapshot(s => {
            proveedores = s.docs.map(d => ({id:d.id, ...d.data()}));
            const provHtml = '<option value="">-- Prov --</option>' + proveedores.map(p => `<option value="${p.nombre}">${p.nombre}</option>`).join('');
            document.getElementById('selProveedor').innerHTML = provHtml;
            document.getElementById('acProv').innerHTML = provHtml;
        });
        db.collection("clientes").orderBy("nombre").onSnapshot(s => {
            clientes = s.docs.map(d => ({id:d.id, ...d.data()}));
            document.getElementById('vtaCliente').innerHTML = '<option value="">-- Cliente --</option>' + clientes.map(c => `<option value="${c.nombre}">${c.nombre}</option>`).join('');
            renderClientes();
        });
        db.collection("acuerdos").onSnapshot(s => { acuerdos = s.docs.map(d => ({id:d.id, ...d.data()})); renderAcuerdos(); });
        db.collection("stock").onSnapshot(s => {
            const res = {}; s.docs.forEach(d => { res[d.data().articulo] = (res[d.data().articulo] || 0) + d.data().cantidad; });
            stockActualGlobal = res;
            document.getElementById('tablaStock').innerHTML = Object.keys(res).map(artNombre => {
                const artData = articulos.find(a => a.nombre === artNombre);
                const min = artData ? (artData.minimo || 0) : 0;
                const actual = res[artNombre];
                return `<tr class="${actual <= min ? 'stock-peligro' : ''}">
                    <td>${artNombre}</td>
                    <td class="text-center fw-bold">${actual.toLocaleString()}</td>
                    <td class="text-center text-muted small">${min}</td>
                    <td class="text-end"><i class="fas fa-trash text-muted" onclick="limpiarArt('${artNombre}')"></i></td>
                </tr>`;
            }).join('');
        });
    }

    // --- CARGA ---
    function filtrarArticulosAcuerdo() {
        const prov = document.getElementById('selProveedor').value;
        const filtrados = acuerdos.filter(a => a.proveedor === prov);
        document.getElementById('selArticulo').innerHTML = '<option value="">-- Art --</option>' + filtrados.map(a => `<option value="${a.articulo}">${a.articulo}</option>`).join('');
    }
    function calcularCarga() {
        const prov = document.getElementById('selProveedor').value;
        const art = document.getElementById('selArticulo').value;
        const cant = parseInt(document.getElementById('inpCantidad').value) || 0;
        const tipo = document.getElementById('selTipoCarga').value;
        const ac = acuerdos.find(x => x.proveedor === prov && x.articulo === art);
        let total = (ac && tipo === 'p') ? cant * ac.cxp * ac.uxc : (ac && tipo === 'c') ? cant * ac.uxc : cant;
        document.getElementById('txtTotalFinal').innerText = total.toLocaleString();
    }
    async function guardarIngreso() {
        const art = document.getElementById('selArticulo').value;
        const totalU = parseInt(document.getElementById('txtTotalFinal').innerText.replace(/\./g,''));
        if(art && totalU > 0) {
            await db.collection("stock").add({ articulo: art, cantidad: totalU, tipo: "ingreso", fecha: firebase.firestore.FieldValue.serverTimestamp() });
            alert("Stock actualizado");
            document.getElementById('inpCantidad').value = "";
            document.getElementById('txtTotalFinal').innerText = "0";
        }
    }

    // --- VENTAS Y REMITO ---
    function actualizarPrevisualizacion() {
        const p = parseInt(document.getElementById('vtaPallets').value) || 0;
        const c = parseInt(document.getElementById('vtaCxP').value) || 0;
        const u = parseInt(document.getElementById('vtaUxC').value) || 0;
        document.getElementById('resTotalAceite').innerText = (p * c * u).toLocaleString();
        document.getElementById('resTotalCajas').innerText = (p * c).toLocaleString();
        document.getElementById('resTotalEtiquetas').innerText = (p * c * u).toLocaleString();
    }

    async function procesarDespacho() {
        const clienteNombre = document.getElementById('vtaCliente').value;
        const prod = document.getElementById('vtaArticulo').value;
        const totalU = parseInt(document.getElementById('resTotalAceite').innerText.replace(/\./g,''));
        const totalC = parseInt(document.getElementById('resTotalCajas').innerText.replace(/\./g,''));
        
        if(!clienteNombre || !prod || totalU <= 0) return alert("Faltan datos de la venta");

        const batch = db.batch();
        batch.set(db.collection("stock").doc(), { articulo: prod, cantidad: -totalU, tipo: "venta", fecha: firebase.firestore.FieldValue.serverTimestamp() });

        let pN = prod.toLowerCase();
        let caja = pN.includes("850cc") || pN.includes("900cc") ? "caja de 900cc" : pN.includes("1.5lts") ? "caja 1.5lts" : pN.includes("5lts") ? "caja de 5lts" : "";
        let eti = pN.includes("850cc") || pN.includes("900cc") ? "etiqueta de 900cc" : pN.includes("1.5lts") ? "etiqueta 1.5lts" : pN.includes("5lts") ? "etiqueta de 5lts" : "";
        
        if (caja) batch.set(db.collection("stock").doc(), { articulo: caja, cantidad: -totalC, tipo: "venta", fecha: firebase.firestore.FieldValue.serverTimestamp() });
        if (eti) batch.set(db.collection("stock").doc(), { articulo: eti, cantidad: -totalU, tipo: "venta", fecha: firebase.firestore.FieldValue.serverTimestamp() });

        await batch.commit();

        const datosRemito = {
            cliente: clienteNombre,
            producto: prod,
            pallets: document.getElementById('vtaPallets').value,
            cajas: totalC,
            unidades: totalU,
            transporte: document.getElementById('vtaTransporte').value || "A DESIGNAR",
            patente: document.getElementById('vtaPatente').value || "N/A"
        };
        generarPDFRemito(datosRemito);
        alert("Despacho Exitoso.");
    }

    function generarPDFRemito(v) {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        const clienteData = clientes.find(c => c.nombre === v.cliente) || {};

        doc.setFontSize(22); doc.setTextColor(40);
        doc.text("PRADOS DEL SOL", 105, 18, { align: "center" });
        doc.setFontSize(10); doc.setTextColor(100);
        doc.text("Fábrica de Aceites Vegetales", 105, 23, { align: "center" });
        doc.line(10, 28, 200, 28);

        doc.setFontSize(14); doc.setTextColor(0); doc.setFont(undefined, 'bold');
        doc.text("REMITO DE SALIDA", 10, 40);
        doc.setFontSize(10); doc.setFont(undefined, 'normal');
        doc.text(`Fecha: ${new Date().toLocaleDateString()}`, 190, 40, { align: "right" });

        doc.setFont(undefined, 'bold'); doc.text("DESTINATARIO:", 10, 52);
        doc.setFont(undefined, 'normal');
        doc.text(`Razón Social:  ${v.cliente.toUpperCase()}`, 10, 60);
        doc.text(`Dirección:     ${clienteData.dir || 'N/A'}`, 10, 67);
        doc.text(`Identificación: CUIT: ${clienteData.cuit || 'N/A'} - IVA: ${clienteData.iva || 'N/A'}`, 10, 74);

        doc.rect(130, 50, 70, 28);
        doc.setFont(undefined, 'bold'); doc.text("LOGÍSTICA:", 135, 56);
        doc.setFont(undefined, 'normal'); doc.setFontSize(9);
        doc.text(`Transporte:`, 135, 63);
        doc.text(`${v.transporte.substring(0, 35)}`, 135, 68);
        doc.text(`Patente:     ${v.patente.toUpperCase()}`, 135, 74);

        doc.autoTable({
            startY: 85,
            head: [['Pallets', 'Cant. Cajas', 'Descripción del Producto', 'Total Unidades']],
            body: [[v.pallets + " PLTS", v.cajas.toLocaleString() + " CJ", v.producto.toUpperCase(), v.unidades.toLocaleString() + " UN"]],
            headStyles: { fillColor: [40, 40, 40], fontSize: 10, halign: 'center' },
            theme: 'grid'
        });

        const finalY = doc.lastAutoTable.finalY + 45;
        doc.line(20, finalY, 85, finalY); doc.text("Firma Despacho", 52, finalY + 5, { align: "center" });
        doc.line(125, finalY, 190, finalY); doc.text("Firma Recibido", 157, finalY + 5, { align: "center" });

        doc.save(`Remito_${v.cliente}.pdf`);
    }

    // --- HISTORIAL ---
    async function cargarHistorial() {
        const mesSel = document.getElementById('filtroMes').value;
        const start = new Date(mesSel + "-01T00:00:00");
        const end = new Date(start.getFullYear(), start.getMonth() + 1, 0, 23, 59, 59);
        const snp = await db.collection("stock").where("fecha", ">=", start).where("fecha", "<=", end).orderBy("fecha", "desc").get();
        let h = "";
        snp.forEach(doc => {
            const d = doc.data();
            h += `<tr><td>${d.fecha ? d.fecha.toDate().toLocaleDateString() : 'S/F'}</td><td class="fw-bold">${d.articulo}</td><td>${d.tipo}</td><td class="text-center ${d.cantidad<0?'text-danger':'text-success'}">${d.cantidad}</td></tr>`;
        });
        document.getElementById('listaHistorial').innerHTML = h;
    }

    async function resetTotalMovimientos() {
        if(confirm("¿Borrar todos los movimientos? El stock volverá a cero.")) {
            const snp = await db.collection("stock").get();
            const batch = db.batch();
            snp.forEach(d => batch.delete(d.ref));
            await batch.commit();
            alert("Sistema reseteado.");
            cargarHistorial();
        }
    }

    // --- CLIENTES ---
    function guardarCliente() {
        db.collection("clientes").add({
            nombre: document.getElementById('cliNombre').value,
            cuit: document.getElementById('cliCuit').value,
            iva: document.getElementById('cliIva').value,
            dir: document.getElementById('cliDir').value
        });
        alert("Cliente guardado");
        document.getElementById('cliNombre').value = "";
    }
    function renderClientes() {
        document.getElementById('tablaClientes').innerHTML = clientes.map(c => 
            `<tr><td class="small"><b>${c.nombre}</b><br>${c.dir || ''}</td><td class="text-end"><i class="fas fa-trash text-danger" onclick="db.collection('clientes').doc('${c.id}').delete()"></i></td></tr>`
        ).join('');
    }

    // --- GENERAL ---
    function showTab(id) {
        document.querySelectorAll('.content-section').forEach(s => s.classList.add('hidden'));
        document.querySelectorAll('.nav-link').forEach(n => n.classList.remove('active'));
        document.getElementById(id).classList.remove('hidden');
        if(event) event.currentTarget.classList.add('active');
        if(id === 'historial') cargarHistorial();
    }
    function guardarArt() { const n = document.getElementById('confNuevoArt').value.toLowerCase(); const m = parseInt(document.getElementById('confMinArt').value) || 0; if(n) db.collection("articulos").add({nombre: n, minimo: m}); }
    function renderMaestro() { document.getElementById('listaArts').innerHTML = articulos.map(a => `<div class="list-group-item d-flex justify-content-between p-1 small">${a.nombre} <i class="fas fa-trash text-danger" onclick="db.collection('articulos').doc('${a.id}').delete()"></i></div>`).join(''); }
    function guardarAcuerdo() { db.collection("acuerdos").add({proveedor: document.getElementById('acProv').value, articulo: document.getElementById('acArt').value, uxc: parseInt(document.getElementById('acUxC').value), cxp: parseInt(document.getElementById('acCxP').value)}); }
    function renderAcuerdos() { document.getElementById('listaAcuerdos').innerHTML = acuerdos.map(ac => `<div class="border-bottom py-1 small">${ac.proveedor} ➔ ${ac.articulo} <i class="fas fa-times text-danger" onclick="db.collection('acuerdos').doc('${ac.id}').delete()"></i></div>`).join(''); }
    async function registrarConsumo() {
        const art = document.getElementById('consumoArticulo').value;
        const cant = parseInt(document.getElementById('consumoCantidad').value) || 0;
        if(art && cant > 0) await db.collection("stock").add({ articulo: art, cantidad: -cant, tipo: "consumo_interno", fecha: firebase.firestore.FieldValue.serverTimestamp() });
    }
    async function limpiarArt(n) { if(confirm("Vaciar stock?")) { const snp = await db.collection("stock").where("articulo","==",n).get(); const b = db.batch(); snp.forEach(d => b.delete(d.ref)); await b.commit(); } }
    function exportarExcel() {
        const data = Object.keys(stockActualGlobal).map(k => ({ "Artículo": k, "Stock": stockActualGlobal[k] }));
        const ws = XLSX.utils.json_to_sheet(data);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Stock");
        XLSX.writeFile(wb, "Stock_Prados.xlsx");
    }
</script>
</body>
</html>
