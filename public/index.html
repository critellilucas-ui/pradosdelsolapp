<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prados del Sol - Sistema Integral v5</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', sans-serif; }
        .sidebar { min-height: 100vh; background-color: #212529; color: white; padding: 20px; position: sticky; top: 0; z-index: 1000; }
        .nav-link { color: #adb5bd; cursor: pointer; padding: 12px; border-radius: 8px; margin-bottom: 5px; display: block; text-decoration: none; }
        .nav-link:hover, .nav-link.active { color: white; background-color: #0d6efd; }
        .hidden { display: none !important; }
        .card { border: none; box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075); border-radius: 10px; }
        .resumen-vta { background-color: #fff3cd; border: 1px dashed #ffc107; padding: 15px; border-radius: 8px; }
        .stock-critico { background-color: #ffda6a !important; color: #856404 !important; font-weight: bold; }
        .stock-peligro { background-color: #f8d7da !important; color: #721c24 !important; font-weight: bold; border: 2px solid #dc3545 !important; }
    </style>
</head>
<body>

<div id="loginScreen" class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card p-4 shadow-lg" style="width: 380px;">
        <h4 class="text-center mb-4 text-primary fw-bold">Prados del Sol</h4>
        <input type="email" id="loginEmail" class="form-control mb-3" placeholder="Correo">
        <input type="password" id="loginPass" class="form-control mb-3" placeholder="Contraseña">
        <button onclick="login()" class="btn btn-primary w-100">Ingresar</button>
    </div>
</div>

<div id="appSystem" class="container-fluid hidden">
    <div class="row">
        <div class="col-md-2 sidebar">
            <h5 class="text-center mb-4 border-bottom pb-3 text-info">SISTEMA PRADOS</h5>
            <nav>
                <a class="nav-link active" onclick="showTab('stock')"><i class="fas fa-boxes me-2"></i> Stock e Ingresos</a>
                <a class="nav-link" onclick="showTab('ventas')"><i class="fas fa-shopping-cart me-2"></i> Nueva Venta</a>
                <a class="nav-link" onclick="showTab('clientes')"><i class="fas fa-user-friends me-2"></i> Clientes</a>
                <a class="nav-link" onclick="showTab('config')"><i class="fas fa-cog me-2"></i> Configuración</a>
                <a class="nav-link mt-5 text-danger" onclick="logout()"><i class="fas fa-power-off me-2"></i> Salir</a>
            </nav>
        </div>

        <div class="col-md-10 p-4">
            
            <div id="ventas" class="content-section hidden">
                <div class="card p-4 border-top border-primary border-4 shadow-sm">
                    <h4 class="mb-3 text-primary"><i class="fas fa-truck-moving me-2"></i>Despacho de Mercadería</h4>
                    <div class="row g-3">
                        <div class="col-md-4"><label class="fw-bold">Cliente</label><select id="vtaCliente" class="form-select" onchange="actualizarPrevisualizacion()"></select></div>
                        <div class="col-md-4"><label class="fw-bold">Producto</label><select id="vtaArticulo" class="form-select" onchange="actualizarPrevisualizacion()"></select></div>
                        <div class="col-md-4"><label class="fw-bold">Transporte</label><input type="text" id="vtaTransporte" class="form-control"></div>
                        <div class="col-md-4"><label>Pallets</label><input type="number" id="vtaPallets" class="form-control" value="28" oninput="actualizarPrevisualizacion()"></div>
                        <div class="col-md-4"><label>Cajas x Pallet</label><input type="number" id="vtaCxP" class="form-control" value="75" oninput="actualizarPrevisualizacion()"></div>
                        <div class="col-md-4"><label>Unid. x Caja</label><input type="number" id="vtaUxC" class="form-control" value="12" oninput="actualizarPrevisualizacion()"></div>
                    </div>
                    <div class="resumen-vta mt-4 shadow-sm d-flex justify-content-around text-center">
                        <div><small class="text-muted d-block">PRODUCTO</small><h4 class="text-danger" id="resTotalAceite">0</h4></div>
                        <div><small class="text-muted d-block">CAJAS</small><h4 class="text-primary" id="resTotalCajas">0</h4></div>
                        <div><small class="text-muted d-block">ETIQUETAS</small><h4 class="text-success" id="resTotalEtiquetas">0</h4></div>
                    </div>
                    <button class="btn btn-primary w-100 mt-4 py-3 fw-bold shadow" onclick="procesarDespacho()">CONFIRMAR Y DESCONTAR TODO</button>
                </div>
            </div>

            <div id="stock" class="content-section">
                <div class="card p-4 mb-4 border-top border-success border-4 shadow-sm">
                    <h4><i class="fas fa-plus-circle me-2"></i>Carga de Insumos</h4>
                    <div class="row g-3">
                        <div class="col-md-4"><label class="fw-bold">Proveedor</label><select id="selProveedor" class="form-select" onchange="filtrarArticulosAcuerdo()"></select></div>
                        <div class="col-md-4"><label class="fw-bold">Artículo</label><select id="selArticulo" class="form-select" onchange="calcularCarga()"></select></div>
                        <div class="col-md-2"><label class="fw-bold">Cantidad</label><input type="number" id="inpCantidad" class="form-control" oninput="calcularCarga()"></div>
                        <div class="col-md-2 text-center"><label class="d-block fw-bold">Total</label><span id="txtTotalFinal" class="fs-3 fw-bold text-success">0</span></div>
                    </div>
                    <button class="btn btn-success w-100 mt-3 fw-bold" onclick="guardarIngreso()">SUMAR AL INVENTARIO</button>
                </div>
                <div class="card p-3 shadow-sm">
                    <h5>Estado del Inventario</h5>
                    <table class="table table-hover align-middle">
                        <thead class="table-dark"><tr><th>Artículo</th><th class="text-center">Existencia</th><th class="text-center">Mínimo</th><th class="text-end">Acción</th></tr></thead>
                        <tbody id="tablaStock"></tbody>
                    </table>
                </div>
            </div>

            <div id="config" class="content-section hidden">
                <div class="row g-4">
                    <div class="col-md-6">
                        <div class="card p-3 shadow-sm">
                            <h6 class="border-bottom pb-2">Maestro de Artículos y Alertas</h6>
                            <div class="row g-2 mb-3">
                                <div class="col-6"><input type="text" id="confNuevoArt" class="form-control" placeholder="Nombre"></div>
                                <div class="col-4"><input type="number" id="confMinArt" class="form-control" placeholder="Mínimo"></div>
                                <div class="col-2"><button class="btn btn-info text-white w-100" onclick="guardarArt()">+</button></div>
                            </div>
                            <div id="listaArts" class="list-group list-group-flush small" style="max-height: 400px; overflow-y: auto;"></div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="card p-3 shadow-sm mb-3">
                            <h6 class="border-bottom pb-2">Proveedores</h6>
                            <div class="input-group"><input type="text" id="confNuevoProv" class="form-control"><button class="btn btn-dark" onclick="guardarProv()">+</button></div>
                            <div id="listaProvs" class="list-group list-group-flush small"></div>
                        </div>
                        <div class="card p-3 shadow-sm border-warning border-start border-4">
                            <h6 class="border-bottom pb-2">Vincular para Carga</h6>
                            <select id="acProv" class="form-select mb-2"></select>
                            <select id="acArt" class="form-select mb-2"></select>
                            <button class="btn btn-warning w-100 fw-bold" onclick="guardarAcuerdo()">VINCULAR</button>
                            <div id="listaAcuerdos" class="mt-2 small overflow-auto" style="max-height: 150px;"></div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div id="clientes" class="content-section hidden">
                <div class="card p-4 shadow-sm">
                    <h4>Clientes</h4>
                    <div class="row g-2 mb-3">
                        <div class="col-md-5"><input type="text" id="cliNombre" class="form-control" placeholder="Razón Social"></div>
                        <div class="col-md-5"><input type="text" id="cliDir" class="form-control" placeholder="Dirección"></div>
                        <div class="col-md-2"><button class="btn btn-dark w-100" onclick="guardarCliente()">Añadir</button></div>
                    </div>
                    <table class="table"><tbody id="tablaClientes"></tbody></table>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyCjYp0idCxs32QAofYLVEGcwvmd3HXy-3Y",
      authDomain: "prados-del-sol.firebaseapp.com",
      projectId: "prados-del-sol",
      storageBucket: "prados-del-sol.firebasestorage.app",
      messagingSenderId: "30316921952",
      appId: "1:30316921952:web:b0f88b9c35f270d548ef05"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    let articulos = [], proveedores = [], acuerdos = [], clientes = [];

    function login() { auth.signInWithEmailAndPassword(document.getElementById('loginEmail').value, document.getElementById('loginPass').value); }
    function logout() { auth.signOut(); }
    auth.onAuthStateChanged(user => {
        if (user) { document.getElementById('loginScreen').classList.add('hidden'); document.getElementById('appSystem').classList.remove('hidden'); iniciarApp(); }
        else { document.getElementById('loginScreen').classList.remove('hidden'); document.getElementById('appSystem').classList.add('hidden'); }
    });

    async function iniciarApp() {
        const base = [
            {n: "botella 850cc", m: 5000}, {n: "botella 900cc", m: 5000}, {n: "botella 1.5lts", m: 3000}, {n: "bidon de 5lts", m: 1000},
            {n: "caja de 900cc", m: 1000}, {n: "caja 1.5lts", m: 500}, {n: "caja de 5lts", m: 300},
            {n: "etiqueta de 900cc", m: 10000}, {n: "etiqueta 1.5lts", m: 5000}, {n: "etiqueta de 5lts", m: 2000}
        ];
        
        db.collection("articulos").orderBy("nombre").onSnapshot(async s => {
            articulos = s.docs.map(d => ({id:d.id, ...d.data()}));
            for (let b of base) {
                if (!articulos.find(a => a.nombre === b.n)) await db.collection("articulos").add({ nombre: b.n, minimo: b.m });
            }
            renderMaestro();
            const html = articulos.map(a => `<option value="${a.nombre}">${a.nombre}</option>`).join('');
            document.getElementById('acArt').innerHTML = html;
            document.getElementById('vtaArticulo').innerHTML = '<option value="">-- Seleccionar --</option>' + html;
        });

        db.collection("proveedores").orderBy("nombre").onSnapshot(s => {
            proveedores = s.docs.map(d => ({id:d.id, ...d.data()}));
            document.getElementById('selProveedor').innerHTML = '<option value="">-- Proveedor --</option>' + proveedores.map(p => `<option value="${p.nombre}">${p.nombre}</option>`).join('');
            document.getElementById('acProv').innerHTML = document.getElementById('selProveedor').innerHTML;
            renderLista('listaProvs', proveedores, 'proveedores');
        });

        db.collection("clientes").orderBy("nombre").onSnapshot(s => {
            clientes = s.docs.map(d => ({id:d.id, ...d.data()}));
            document.getElementById('vtaCliente').innerHTML = '<option value="">-- Cliente --</option>' + clientes.map(c => `<option value="${c.nombre}">${c.nombre}</option>`).join('');
            renderClientes();
        });

        db.collection("acuerdos").onSnapshot(s => { acuerdos = s.docs.map(d => ({id:d.id, ...d.data()})); renderAcuerdos(); });

        db.collection("stock").onSnapshot(s => {
            const res = {}; s.docs.forEach(d => { res[d.data().articulo] = (res[d.data().articulo] || 0) + d.data().cantidad; });
            document.getElementById('tablaStock').innerHTML = Object.keys(res).map(artNombre => {
                const artData = articulos.find(a => a.nombre === artNombre);
                const min = artData ? (artData.minimo || 0) : 0;
                const actual = res[artNombre];
                const claseFila = actual <= min ? 'stock-peligro' : '';
                return `<tr class="${claseFila}">
                    <td>${actual <= min ? '⚠️ ' : ''}${artNombre}</td>
                    <td class="text-center fs-5">${actual.toLocaleString()}</td>
                    <td class="text-center text-muted">${min.toLocaleString()}</td>
                    <td class="text-end"><button class="btn btn-sm btn-link text-danger" onclick="limpiarArt('${artNombre}')"><i class="fas fa-trash"></i></button></td>
                </tr>`;
            }).join('');
        });
    }

    // --- VENTAS (TRIPLE DESCUENTO) ---
    function actualizarPrevisualizacion() {
        const p = parseInt(document.getElementById('vtaPallets').value) || 0;
        const c = parseInt(document.getElementById('vtaCxP').value) || 0;
        const u = parseInt(document.getElementById('vtaUxC').value) || 0;
        const totalU = p * c * u;
        const totalC = p * c;
        document.getElementById('resTotalAceite').innerText = totalU.toLocaleString();
        document.getElementById('resTotalCajas').innerText = totalC.toLocaleString();
        document.getElementById('resTotalEtiquetas').innerText = totalU.toLocaleString();
    }

    async function procesarDespacho() {
        const prod = document.getElementById('vtaArticulo').value;
        const totalU = parseInt(document.getElementById('resTotalAceite').innerText.replace(/\./g,''));
        const totalC = parseInt(document.getElementById('resTotalCajas').innerText.replace(/\./g,''));
        if(!prod || totalU <= 0) return alert("Verificar selección");

        const batch = db.batch();
        batch.set(db.collection("stock").doc(), { articulo: prod, cantidad: -totalU, fecha: firebase.firestore.FieldValue.serverTimestamp() });

        let caja = "", etiqueta = "";
        const pN = prod.toLowerCase();
        if (pN.includes("850cc") || pN.includes("900cc")) { caja = "caja de 900cc"; etiqueta = "etiqueta de 900cc"; }
        else if (pN.includes("1.5lts")) { caja = "caja 1.5lts"; etiqueta = "etiqueta 1.5lts"; }
        else if (pN.includes("5lts")) { caja = "caja de 5lts"; etiqueta = "etiqueta de 5lts"; }

        if (caja !== "") batch.set(db.collection("stock").doc(), { articulo: caja, cantidad: -totalC, fecha: firebase.firestore.FieldValue.serverTimestamp() });
        if (etiqueta !== "") batch.set(db.collection("stock").doc(), { articulo: etiqueta, cantidad: -totalU, fecha: firebase.firestore.FieldValue.serverTimestamp() });

        await batch.commit();
        alert("Despacho completado con éxito.");
        actualizarPrevisualizacion();
    }

    // --- LOGICA DE CARGA Y CONFIG ---
    function filtrarArticulosAcuerdo() {
        const vinculados = acuerdos.filter(a => a.proveedor === document.getElementById('selProveedor').value);
        document.getElementById('selArticulo').innerHTML = '<option value="">-- Artículo --</option>' + vinculados.map(a => `<option value="${a.articulo}">${a.articulo}</option>`).join('');
    }
    function calcularCarga() { document.getElementById('txtTotalFinal').innerText = (parseInt(document.getElementById('inpCantidad').value) || 0).toLocaleString(); }
    async function guardarIngreso() {
        const art = document.getElementById('selArticulo').value;
        const cant = parseInt(document.getElementById('txtTotalFinal').innerText.replace(/\./g,''));
        if(art && cant > 0) { await db.collection("stock").add({ articulo: art, cantidad: cant, fecha: firebase.firestore.FieldValue.serverTimestamp() }); alert("Stock actualizado"); }
    }
    function guardarArt() { 
        const n = document.getElementById('confNuevoArt').value.toLowerCase().trim();
        const m = parseInt(document.getElementById('confMinArt').value) || 0;
        if(n) db.collection("articulos").add({nombre: n, minimo: m}); 
    }
    function renderMaestro() {
        document.getElementById('listaArts').innerHTML = articulos.map(a => `
            <div class="list-group-item d-flex justify-content-between align-items-center">
                <span>${a.nombre} (Mín: ${a.minimo})</span>
                <div>
                    <i class="fas fa-edit text-primary me-2" onclick="editMin('${a.id}', ${a.minimo})"></i>
                    <i class="fas fa-trash text-danger" onclick="db.collection('articulos').doc('${a.id}').delete()"></i>
                </div>
            </div>`).join('');
    }
    function editMin(id, actual) {
        const nuevo = prompt("Nuevo stock mínimo:", actual);
        if(nuevo !== null) db.collection("articulos").doc(id).update({minimo: parseInt(nuevo)});
    }
    function guardarProv() { db.collection("proveedores").add({nombre: document.getElementById('confNuevoProv').value}); }
    function guardarAcuerdo() { db.collection("acuerdos").add({proveedor: document.getElementById('acProv').value, articulo: document.getElementById('acArt').value}); }
    function renderAcuerdos() { document.getElementById('listaAcuerdos').innerHTML = acuerdos.map(ac => `<div class="border-bottom py-1 small">${ac.proveedor} ➔ ${ac.articulo} <i class="fas fa-times text-danger ms-2" onclick="db.collection('acuerdos').doc('${ac.id}').delete()"></i></div>`).join(''); }
    function renderLista(id, data, coll) { document.getElementById(id).innerHTML = data.map(item => `<div class="list-group-item d-flex justify-content-between p-1">${item.nombre} <i class="fas fa-times text-danger" onclick="db.collection('${coll}').doc('${item.id}').delete()"></i></div>`).join(''); }
    function guardarCliente() { db.collection("clientes").add({nombre: document.getElementById('cliNombre').value, dir: document.getElementById('cliDir').value}); }
    function renderClientes() { document.getElementById('tablaClientes').innerHTML = clientes.map(c => `<tr><td>${c.nombre}</td><td>${c.dir}</td><td><i class="fas fa-trash text-danger" onclick="db.collection('clientes').doc('${c.id}').delete()"></i></td></tr>`).join(''); }
    function showTab(id) { document.querySelectorAll('.content-section').forEach(s => s.classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); }
    async function limpiarArt(n) { if(confirm("Vaciar stock de "+n+"?")) { const snp = await db.collection("stock").where("articulo","==",n).get(); const b = db.batch(); snp.forEach(d => b.delete(d.ref)); await b.commit(); } }
</script>
</body>
</html>
