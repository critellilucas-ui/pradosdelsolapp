<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Prados del Sol - Sistema de Gestión</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding-bottom: 80px; }
        .sidebar { background-color: #2c3e50; color: white; min-height: 100vh; position: sticky; top: 0; }
        .nav-link { color: #bdc3c7; cursor: pointer; padding: 12px; border-radius: 8px; margin-bottom: 5px; text-decoration: none; display: block; }
        .nav-link.active, .nav-link:hover { color: white; background-color: #3498db; }
        
        @media (max-width: 768px) {
            .sidebar { display: none !important; }
            .mobile-header { display: flex; justify-content: space-between; align-items: center; background: #2c3e50; color: white; padding: 10px 15px; position: fixed; top: 0; left: 0; right: 0; z-index: 1000; }
            .mobile-nav { display: flex; justify-content: space-around; position: fixed; bottom: 0; left: 0; width: 100%; background: white; border-top: 1px solid #ddd; padding: 10px 0; z-index: 1000; }
            .nav-icon { text-align: center; color: #7f8c8d; font-size: 0.7rem; flex: 1; cursor: pointer; }
            .nav-icon i { font-size: 1.3rem; display: block; }
            .nav-icon.active { color: #3498db; font-weight: bold; }
            #appSystem { padding-top: 60px; }
        }

        .hidden { display: none !important; }
        .card { border-radius: 12px; border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 15px; }
        .btn-primary { background-color: #3498db; border: none; }
        .badge-item { background: #ebf5fb; color: #2980b9; padding: 8px 12px; border-radius: 20px; font-size: 0.85rem; display: inline-flex; align-items: center; margin: 4px; border: 1px solid #3498db; }
        label { font-size: 0.75rem; font-weight: bold; color: #34495e; margin-bottom: 2px; }
    </style>
</head>
<body>

<div id="loginScreen" class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card p-4 shadow w-100" style="max-width: 380px;">
        <h3 class="text-center mb-4 fw-bold text-primary">PRADOS DEL SOL</h3>
        <input type="email" id="loginEmail" class="form-control mb-3" placeholder="Usuario/Email">
        <input type="password" id="loginPass" class="form-control mb-3" placeholder="Contraseña">
        <button onclick="login()" class="btn btn-primary w-100 py-2">ENTRAR</button>
    </div>
</div>

<div id="appSystem" class="container-fluid hidden">
    <div class="mobile-header d-md-none">
        <span class="fw-bold">PRADOS DEL SOL</span>
        <i class="fas fa-sign-out-alt" onclick="logout()"></i>
    </div>

    <div class="row">
        <div class="col-md-2 sidebar p-3 d-none d-md-block">
            <h4 class="text-center mb-4">MENÚ</h4>
            <nav>
                <a class="nav-link active" onclick="showTab('stock')"><i class="fas fa-boxes me-2"></i>Stock</a>
                <a class="nav-link" onclick="showTab('produccion')"><i class="fas fa-industry me-2"></i>Producción</a>
                <a class="nav-link" onclick="showTab('ventas')"><i class="fas fa-file-invoice me-2"></i>Ventas/Remito</a>
                <a class="nav-link" onclick="showTab('clientes')"><i class="fas fa-users me-2"></i>Clientes</a>
                <a class="nav-link" onclick="showTab('historial')"><i class="fas fa-history me-2"></i>Historial</a>
                <a class="nav-link" onclick="showTab('config')"><i class="fas fa-cog me-2"></i>Config</a>
            </nav>
        </div>

        <div class="col-md-10 p-3">
            
            <div id="ventas" class="content-section hidden">
                <div class="card p-3 border-top border-primary border-4">
                    <h5 class="fw-bold text-primary mb-3"><i class="fas fa-file-signature me-2"></i>NUEVO REMITO DE VENTA</h5>
                    
                    <div class="row g-2 mb-3 bg-light p-2 rounded border">
                        <div class="col-12"><label>CLIENTE</label><select id="vtaCliente" class="form-select"></select></div>
                        <div class="col-12"><label>NRO. REMITO</label><input type="text" id="vtaNumRemito" class="form-control" placeholder="0001-0000XXXX"></div>
                    </div>

                    <div class="row g-2 mb-3 bg-white p-2 rounded border">
                        <div class="col-12 text-muted fw-bold small mb-1">DATOS DE LOGÍSTICA</div>
                        <div class="col-6"><label>NOMBRE CHOFER</label><input type="text" id="vtaChoferNombre" class="form-control form-control-sm" placeholder="Nombre y Apellido"></div>
                        <div class="col-6"><label>DNI</label><input type="text" id="vtaChoferDni" class="form-control form-control-sm" placeholder="DNI"></div>
                        <div class="col-6"><label>PATENTE CAMIÓN</label><input type="text" id="vtaPatenteCamion" class="form-control form-control-sm" placeholder="ABC-123"></div>
                        <div class="col-6"><label>PATENTE SEMI</label><input type="text" id="vtaPatenteSemi" class="form-control form-control-sm" placeholder="XYZ-987"></div>
                    </div>

                    <div class="row g-2 border p-2 rounded">
                        <div class="col-12"><label>ARTÍCULO</label><select id="vtaArt" class="form-select" onchange="sugerirConfigVenta()"></select></div>
                        <div class="col-4"><label>CANT.</label><input type="number" id="vtaCantLog" class="form-control" value="1" oninput="calcVentaItem()"></div>
                        <div class="col-4"><label>TIPO</label><select id="vtaTipo" class="form-select" onchange="calcVentaItem()"><option value="p">Pallet</option><option value="c">Caja</option><option value="u">Unidad</option></select></div>
                        <div class="col-4"><label>LOTE</label><input type="text" id="vtaLote" class="form-control" placeholder="Lote"></div>
                        <div class="col-4"><label>CxP</label><input type="number" id="vtaCxP" class="form-control" oninput="calcVentaItem()"></div>
                        <div class="col-4"><label>UxC</label><input type="number" id="vtaUxC" class="form-control" oninput="calcVentaItem()"></div>
                        <div class="col-4"><label>&nbsp;</label><button class="btn btn-dark w-100" onclick="agregarItemVenta()"><i class="fas fa-plus"></i></button></div>
                        <div class="col-12 text-center small mt-1">Total Unidades: <span id="vtaTotalItem" class="fw-bold text-primary">0</span></div>
                    </div>

                    <div id="listaTempVenta" class="my-3"></div>

                    <button class="btn btn-primary w-100 py-3 fw-bold shadow" onclick="finalizarVenta()">
                        <i class="fas fa-print me-2"></i>FINALIZAR Y DESCARGAR PDF
                    </button>
                </div>
            </div>

            <div id="stock" class="content-section">
                <div class="card p-3 shadow-sm border-top border-success border-4">
                    <h6>STOCK ACTUAL</h6>
                    <div class="table-responsive">
                        <table class="table table-sm align-middle">
                            <thead class="table-dark"><tr><th>Artículo</th><th class="text-end">Existencia</th></tr></thead>
                            <tbody id="tablaStockGeneral"></tbody>
                        </table>
                    </div>
                </div>
                <div class="card p-3 border-start border-success border-4">
                    <h6>INGRESO MERCADERÍA / INSUMOS</h6>
                    <div class="row g-2">
                        <div class="col-12"><select id="selProveedor" class="form-select" onchange="filtrarArticulosAcuerdo()"></select></div>
                        <div class="col-8"><select id="selArticulo" class="form-select" onchange="sugerirConfigIngreso()"></select></div>
                        <div class="col-4"><input type="number" id="inpCantidad" class="form-control" placeholder="Cant."></div>
                        <div class="col-12"><button class="btn btn-success w-100" onclick="guardarIngreso()">INGRESAR</button></div>
                    </div>
                </div>
            </div>

            <div id="produccion" class="content-section hidden">
                <div class="card p-3 border-top border-info border-4">
                    <h5 class="text-info">PLANILLA DE PRODUCCIÓN</h5>
                    <div class="row g-2">
                        <div class="col-12"><label>Producto a Elaborar</label><select id="prodArticulo" class="form-select" onchange="calcP()"></select></div>
                        <div class="col-4"><label>Pallets</label><input type="number" id="prodPal" class="form-control" value="1" oninput="calcP()"></div>
                        <div class="col-4"><label>CxP</label><input type="number" id="prodCxP" class="form-control" value="75" oninput="calcP()"></div>
                        <div class="col-4"><label>UxC</label><input type="number" id="prodUxC" class="form-control" value="12" oninput="calcP()"></div>
                        <div class="col-12 py-2"><small id="insumosPreview" class="text-muted"></small></div>
                        <div class="col-12"><button class="btn btn-info text-white w-100 fw-bold" onclick="ejecutarProduccion()">CONFIRMAR PRODUCCIÓN</button></div>
                    </div>
                </div>
            </div>

            <div id="clientes" class="content-section hidden">
                <div class="card p-3 border-top border-primary border-4">
                    <h6>NUEVO CLIENTE</h6>
                    <div class="row g-2">
                        <div class="col-12"><input type="text" id="cliNombre" class="form-control" placeholder="Razón Social"></div>
                        <div class="col-6"><input type="text" id="cliCuit" class="form-control" placeholder="CUIT"></div>
                        <div class="col-6"><input type="text" id="cliLoc" class="form-control" placeholder="Localidad/Dirección"></div>
                        <div class="col-12"><button class="btn btn-primary w-100" onclick="guardarCliente()">REGISTRAR CLIENTE</button></div>
                    </div>
                </div>
                <div id="listadoClientes" class="row g-2 mt-3"></div>
            </div>

            <div id="historial" class="content-section hidden">
                <div class="card p-3 mb-2">
                    <div class="row g-2">
                        <div class="col-6"><input type="date" id="repFecha" class="form-control"></div>
                        <div class="col-6"><button class="btn btn-dark w-100" onclick="generarReporteDetallado()">PDF DIARIO</button></div>
                    </div>
                </div>
                <div class="card overflow-auto">
                    <table class="table table-sm">
                        <tbody id="listaHistorial"></tbody>
                    </table>
                </div>
            </div>

            <div id="config" class="content-section hidden">
                <div class="card p-3">
                    <h6>ARTÍCULOS E INSUMOS</h6>
                    <div class="input-group mb-2"><input type="text" id="confArt" class="form-control"><button class="btn btn-primary" onclick="guardarArt()">+</button></div>
                    <div id="listaArts" class="small"></div>
                </div>
            </div>

        </div>
    </div>

    <div class="mobile-nav d-md-none">
        <div class="nav-icon active" onclick="showTab('stock')"><i class="fas fa-boxes"></i>Stock</div>
        <div class="nav-icon" onclick="showTab('produccion')"><i class="fas fa-industry"></i>Prod</div>
        <div class="nav-icon" onclick="showTab('ventas')"><i class="fas fa-file-invoice"></i>Ventas</div>
        <div class="nav-icon" onclick="showTab('clientes')"><i class="fas fa-users"></i>Cli</div>
        <div class="nav-icon" onclick="showTab('historial')"><i class="fas fa-history"></i>Hist</div>
    </div>
</div>

<script>
    // DATOS REALES RECONSTRUIDOS DE MAXIMILIANO MEZA
    const EMPRESA = {
        nombre: "MEZA MAXIMILIANO ALBERTO",
        fantasia: "PRADOS DEL SOL",
        cuit: "20-31692195-2",
        direccion: "CALLE 123 NRO 456 - PARQUE INDUSTRIAL",
        localidad: "CHIVILCOY (6620) - BUENOS AIRES",
        iva: "IVA RESPONSABLE INSCRIPTO",
        inicio: "01/01/2015"
    };

    // Firebase Config
    const firebaseConfig = { apiKey: "AIzaSyCjYp0idCxs32QAofYLVEGcwvmd3HXy-3Y", authDomain: "prados-del-sol.firebaseapp.com", projectId: "prados-del-sol", storageBucket: "prados-del-sol.firebasestorage.app", messagingSenderId: "30316921952", appId: "1:30316921952:web:b0f88b9c35f270d548ef05" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    let articulos = [], proveedores = [], acuerdos = [], clientes = [], stockGlobal = {}, itemsVenta = [];

    // --- LOGICA LOGIN ---
    function login() { auth.signInWithEmailAndPassword(document.getElementById('loginEmail').value, document.getElementById('loginPass').value).catch(e => alert("Error: " + e.message)); }
    function logout() { auth.signOut().then(() => location.reload()); }
    auth.onAuthStateChanged(u => { if(u){ document.getElementById('loginScreen').classList.add('hidden'); document.getElementById('appSystem').classList.remove('hidden'); init(); } });

    function init() {
        document.getElementById('repFecha').valueAsDate = new Date();
        db.collection("articulos").orderBy("nombre").onSnapshot(s => { articulos = s.docs.map(d=>({id:d.id, ...d.data()})); renderSelects(); });
        db.collection("proveedores").onSnapshot(s => { proveedores = s.docs.map(d=>({id:d.id, ...d.data()})); renderSelects(); });
        db.collection("acuerdos").onSnapshot(s => { acuerdos = s.docs.map(d=>({id:d.id, ...d.data()})); });
        db.collection("clientes").orderBy("nombre").onSnapshot(s => { clientes = s.docs.map(d=>({id:d.id, ...d.data()})); renderSelects(); });
        db.collection("stock").onSnapshot(s => { stockGlobal = {}; s.docs.forEach(d => { stockGlobal[d.data().articulo] = (stockGlobal[d.data().articulo] || 0) + d.data().cantidad; }); renderStock(); });
    }

    function renderSelects() {
        const hArt = articulos.map(a => `<option value="${a.nombre}">${a.nombre}</option>`).join('');
        document.getElementById('vtaArt').innerHTML = hArt;
        document.getElementById('prodArticulo').innerHTML = '<option value="">-- Elija Producto --</option>' + hArt;
        document.getElementById('selArticulo').innerHTML = hArt;
        
        document.getElementById('vtaCliente').innerHTML = clientes.map(c => `<option value="${c.id}">${c.nombre}</option>`).join('');
        document.getElementById('selProveedor').innerHTML = '<option value="">-- Prov --</option>' + proveedores.map(p => `<option value="${p.nombre}">${p.nombre}</option>`).join('');
        
        // Listado config
        document.getElementById('listaArts').innerHTML = articulos.map(a => `<div class="d-flex justify-content-between border-bottom py-1">${a.nombre} <i class="fas fa-trash text-danger" onclick="db.collection('articulos').doc('${a.id}').delete()"></i></div>`).join('');
    }

    function showTab(id) {
        document.querySelectorAll('.content-section').forEach(s => s.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
        document.querySelectorAll('.nav-link, .nav-icon').forEach(n => n.classList.remove('active'));
        window.scrollTo(0,0);
    }

    // --- LOGICA VENTAS & REMITO ---
    function sugerirConfigVenta() {
        const a = document.getElementById('vtaArt').value;
        const ac = acuerdos.find(x => x.articulo === a);
        if(ac) { document.getElementById('vtaCxP').value = ac.cxp; document.getElementById('vtaUxC').value = ac.uxc; }
        calcVentaItem();
    }

    function calcVentaItem() {
        const c = parseFloat(document.getElementById('vtaCantLog').value)||0, t = document.getElementById('vtaTipo').value;
        const cxp = parseFloat(document.getElementById('vtaCxP').value)||0, uxc = parseFloat(document.getElementById('vtaUxC').value)||0;
        let total = (t==='p') ? c*cxp*uxc : (t==='c' ? c*uxc : c);
        document.getElementById('vtaTotalItem').innerText = Math.round(total).toLocaleString();
    }

    function agregarItemVenta() {
        const art = document.getElementById('vtaArt').value;
        const total = parseInt(document.getElementById('vtaTotalItem').innerText.replace(/\./g,''));
        if(!art || total <= 0) return;
        itemsVenta.push({
            art: art,
            cant: total,
            pres: document.getElementById('vtaCantLog').value + " " + document.getElementById('vtaTipo').value,
            lote: document.getElementById('vtaLote').value || 'S/L'
        });
        renderTempVenta();
    }

    function renderTempVenta() {
        document.getElementById('listaTempVenta').innerHTML = itemsVenta.map((it, i) => `
            <div class="badge-item">
                <span>${it.art} | ${it.cant} Un. | Lote: ${it.lote}</span>
                <i class="fas fa-times ms-2 text-danger" style="cursor:pointer" onclick="itemsVenta.splice(${i},1);renderTempVenta()"></i>
            </div>`).join('');
    }

    async function finalizarVenta() {
        if(itemsVenta.length === 0) return alert("Cargue artículos");
        const cliId = document.getElementById('vtaCliente').value;
        const cliente = clientes.find(c => c.id === cliId);
        const nroRemito = document.getElementById('vtaNumRemito').value || "0000-00000000";
        
        const logistica = {
            chofer: document.getElementById('vtaChoferNombre').value || "-",
            dni: document.getElementById('vtaChoferDni').value || "-",
            camion: document.getElementById('vtaPatenteCamion').value || "-",
            semi: document.getElementById('vtaPatenteSemi').value || "-"
        };

        const batch = db.batch();
        itemsVenta.forEach(it => {
            batch.set(db.collection("stock").doc(), {
                articulo: it.art, cantidad: -it.cant, tipo: `VENTA REM ${nroRemito}`, fecha: firebase.firestore.FieldValue.serverTimestamp()
            });
        });

        await batch.commit();

        // GENERAR PDF
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();

        // Estructura de Recuadros (Espejo de Remito Real)
        doc.rect(10, 10, 190, 45); // Recuadro Cabecera
        doc.line(105, 10, 105, 55); // Línea divisoria central
        
        // Izquierda: Datos Vendedor
        doc.setFontSize(14); doc.setFont("helvetica", "bold");
        doc.text(EMPRESA.fantasia, 15, 20);
        doc.setFontSize(9); doc.text(EMPRESA.nombre, 15, 26);
        doc.setFont("helvetica", "normal");
        doc.text(EMPRESA.direccion, 15, 32);
        doc.text(EMPRESA.localidad, 15, 37);
        doc.text(EMPRESA.iva, 15, 50);

        // Centro: Letra R
        doc.setFillColor(255,255,255);
        doc.rect(100, 10, 10, 10, 'F');
        doc.rect(100, 10, 10, 10);
        doc.setFontSize(16); doc.text("R", 105, 17, {align:"center"});
        doc.setFontSize(7); doc.text("Cod. 91", 105, 19, {align:"center"});

        // Derecha: Datos Comprobante
        doc.setFontSize(16); doc.setFont("helvetica", "bold");
        doc.text("REMITO", 110, 20);
        doc.setFontSize(10);
        doc.text("N°: " + nroRemito, 110, 30);
        doc.text("Fecha: " + new Date().toLocaleDateString(), 110, 37);
        doc.text("CUIT: " + EMPRESA.cuit, 110, 44);
        doc.text("Inic. Actividad: " + EMPRESA.inicio, 110, 51);

        // Datos Cliente
        doc.rect(10, 58, 190, 25);
        doc.setFontSize(10); doc.setFont("helvetica", "bold");
        doc.text("DESTINATARIO: ", 12, 65);
        doc.text("DOMICILIO: ", 12, 72);
        doc.text("CUIT: ", 12, 79);
        doc.setFont("helvetica", "normal");
        doc.text(cliente.nombre.toUpperCase(), 45, 65);
        doc.text(cliente.localidad.toUpperCase(), 45, 72);
        doc.text(cliente.cuit, 45, 79);

        // Datos Logistica / Chofer
        doc.rect(10, 85, 190, 20);
        doc.setFont("helvetica", "bold");
        doc.text("TRANSPORTE / CHOFER: ", 12, 92);
        doc.text("PATENTES: ", 12, 99);
        doc.setFont("helvetica", "normal");
        doc.text(`${logistica.chofer} (DNI: ${logistica.dni})`, 60, 92);
        doc.text(`CAMIÓN: ${logistica.camion} | ACOPLADO: ${logistica.semi}`, 60, 99);

        // Tabla de productos
        doc.autoTable({
            startY: 110,
            head: [['CANTIDAD', 'PRESENTACIÓN', 'DESCRIPCIÓN', 'LOTE']],
            body: itemsVenta.map(i => [i.cant.toLocaleString(), i.pres, i.art, i.lote]),
            theme: 'grid',
            headStyles: { fillColor: [240, 240, 240], textColor: 0, fontStyle: 'bold' }
        });

        // Pie de firma
        const finalY = doc.lastAutoTable.finalY + 30;
        doc.line(120, finalY, 190, finalY);
        doc.text("FIRMA Y ACLARACIÓN RECIBIDO", 125, finalY + 5);

        doc.save(`Remito_${nroRemito}.pdf`);
        itemsVenta = []; renderTempVenta(); alert("Operación Exitosa");
    }

    // --- FUNCIONES AUX ---
    function renderStock() {
        document.getElementById('tablaStockGeneral').innerHTML = Object.keys(stockGlobal).sort().map(k => `<tr><td>${k}</td><td class="text-end fw-bold">${stockGlobal[k].toLocaleString()}</td></tr>`).join('');
    }
    function guardarArt() { const n = document.getElementById('confArt').value; if(n) db.collection("articulos").add({nombre: n.toLowerCase()}); document.getElementById('confArt').value=""; }
    async function guardarCliente() { await db.collection("clientes").add({ nombre: document.getElementById('cliNombre').value, cuit: document.getElementById('cliCuit').value, localidad: document.getElementById('cliLoc').value }); alert("Cliente Guardado"); }
</script>
</body>
</html>
