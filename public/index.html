<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prados del Sol - Sistema de Despacho Automatizado</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', sans-serif; }
        .sidebar { min-height: 100vh; background-color: #212529; color: white; padding: 20px; position: sticky; top: 0; }
        .nav-link { color: #adb5bd; cursor: pointer; padding: 12px; border-radius: 8px; margin-bottom: 5px; display: block; text-decoration: none; }
        .nav-link:hover, .nav-link.active { color: white; background-color: #0d6efd; }
        .hidden { display: none !important; }
        .card { border: none; box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075); border-radius: 10px; }
        .resumen-remito { background-color: #fff3cd; border: 1px dashed #ffc107; padding: 15px; border-radius: 8px; }
    </style>
</head>
<body>

<div id="loginScreen" class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card p-4 shadow-lg" style="width: 380px;">
        <h4 class="text-center mb-4">Prados del Sol</h4>
        <input type="email" id="loginEmail" class="form-control mb-3" placeholder="Correo">
        <input type="password" id="loginPass" class="form-control mb-3" placeholder="Contraseña">
        <button onclick="login()" class="btn btn-primary w-100">Ingresar</button>
    </div>
</div>

<div id="appSystem" class="container-fluid hidden">
    <div class="row">
        <div class="col-md-2 sidebar">
            <h5 class="text-center mb-4 border-bottom pb-3 text-info">GESTIÓN PRADOS</h5>
            <nav>
                <a class="nav-link active" id="btn-stock" onclick="showTab('stock')"><i class="fas fa-boxes me-2"></i> Inventario</a>
                <a class="nav-link" id="btn-ventas" onclick="showTab('ventas')"><i class="fas fa-file-contract me-2"></i> Nueva Venta</a>
                <a class="nav-link" id="btn-clientes" onclick="showTab('clientes')"><i class="fas fa-user-friends me-2"></i> Clientes</a>
                <a class="nav-link" id="btn-config" onclick="showTab('config')"><i class="fas fa-cog me-2"></i> Configuración</a>
                <a class="nav-link mt-5 text-danger" onclick="logout()"><i class="fas fa-power-off me-2"></i> Salir</a>
            </nav>
        </div>

        <div class="col-md-10 p-4">
            
            <div id="stock" class="content-section">
                <div class="d-flex justify-content-between mb-4">
                    <h3>Panel de Stock Real</h3>
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalIngreso"><i class="fas fa-plus me-1"></i> Entrada</button>
                </div>
                <div class="card p-3">
                    <table class="table align-middle">
                        <thead class="table-dark"><tr><th>Producto</th><th class="text-center">Unidades</th><th>Estado</th><th class="text-end">Acción</th></tr></thead>
                        <tbody id="tablaStockConsolidado"></tbody>
                    </table>
                </div>
            </div>

            <div id="ventas" class="content-section hidden">
                <div class="row">
                    <div class="col-md-7">
                        <div class="card p-4 border-top border-primary border-4">
                            <h4>Armado de Despacho</h4>
                            <div class="row g-3">
                                <div class="col-md-12">
                                    <label class="fw-bold">Cliente</label>
                                    <select id="vtaCliente" class="form-select" onchange="calcularVentaFinal()"></select>
                                </div>
                                <div class="col-md-12">
                                    <label class="fw-bold text-primary">Elegir Formato Guardado (Define el Artículo)</label>
                                    <select id="vtaFormatoSel" class="form-select" onchange="aplicarFormatoVenta()"></select>
                                </div>
                                <div class="col-md-4"><label>Pallets</label><input type="number" id="vtaPallets" class="form-control" value="1" oninput="calcularVentaFinal()"></div>
                                <div class="col-md-4"><label>Cajas x Pallet</label><input type="number" id="vtaCjxP" class="form-control" oninput="calcularVentaFinal()"></div>
                                <div class="col-md-4"><label>Unid. x Caja</label><input type="number" id="vtaUxC" class="form-control" oninput="calcularVentaFinal()"></div>
                                <div class="col-md-12"><label class="fw-bold">Transporte</label><input type="text" id="vtaTransporte" class="form-control"></div>
                            </div>

                            <div class="resumen-remito mt-4">
                                <div id="remitoDetalle" class="small mb-2 fw-bold"></div>
                                <div class="d-flex justify-content-between"><span>Artículo a descontar:</span><span id="resArticuloNombre" class="fw-bold">---</span></div>
                                <div class="d-flex justify-content-between"><span>Total Unidades:</span><span id="resBotellas" class="fw-bold text-danger fs-5">0</span></div>
                                <div class="d-flex justify-content-between"><span>Cajas (Insumo):</span><span id="resCajas" class="fw-bold text-primary fs-5">0</span></div>
                            </div>
                            <button class="btn btn-primary w-100 mt-3 py-3 fw-bold" onclick="confirmarVentaRemito()"><i class="fas fa-file-pdf me-2"></i> PROCESAR DESPACHO</button>
                        </div>
                    </div>
                </div>
            </div>

            <div id="config" class="content-section hidden">
                <div class="row g-4">
                    <div class="col-md-4">
                        <div class="card p-3">
                            <h5>1. Maestro de Artículos</h5>
                            <div class="input-group mb-2"><input type="text" id="confNuevoArt" class="form-control"><button class="btn btn-info text-white" onclick="guardarArticuloCloud()">+</button></div>
                            <div id="listaArticulosMaster" class="list-group"></div>
                        </div>
                    </div>
                    <div class="col-md-8">
                        <div class="card p-3">
                            <h5>2. Configurar Formatos de Venta</h5>
                            <div class="row g-2">
                                <div class="col-md-4"><label class="small">Nombre Formato</label><input type="text" id="fNombre" class="form-control" placeholder="Ej: Pallet 850 Export"></div>
                                <div class="col-md-4"><label class="small">Vincular a Artículo</label><select id="fArticuloVinculado" class="form-select"></select></div>
                                <div class="col-md-2"><label class="small">Cajas</label><input type="number" id="fCajas" class="form-control"></div>
                                <div class="col-md-2"><label class="small">u/Caja</label><input type="number" id="fUni" class="form-control"></div>
                                <div class="col-12 mt-2"><button class="btn btn-warning w-100" onclick="guardarFormato()">Guardar Formato Vinculado</button></div>
                            </div>
                            <div id="listaFormatos" class="row mt-3"></div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<div class="modal fade" id="modalIngreso" tabindex="-1">
    <div class="modal-dialog"><div class="modal-content">
        <div class="modal-header bg-primary text-white"><h5>Entrada de Stock</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
            <label>Proveedor</label><select id="selProveedor" class="form-select mb-2" onchange="actualizarFiltroArticulos();"></select>
            <label>Artículo</label><select id="selArticulo" class="form-select mb-2" onchange="calcularIngreso();"></select>
            <div class="row g-2"><div class="col-6"><input type="number" id="inpCantidad" class="form-control" oninput="calcularIngreso()"></div><div class="col-6"><select id="selTipoCarga" class="form-select" onchange="calcularIngreso()"><option value="u">Unid</option><option value="c">Cajas</option><option value="p">Pallets</option></select></div></div>
            <div class="mt-3 p-2 bg-light text-center fw-bold">Total: <span id="txtTotalFinal">0</span></div>
        </div>
        <div class="modal-footer"><button class="btn btn-success w-100" onclick="guardarIngresoCloud()">CONFIRMAR INGRESO</button></div>
    </div></div>
</div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyCjYp0idCxs32QAofYLVEGcwvmd3HXy-3Y",
      authDomain: "prados-del-sol.firebaseapp.com",
      projectId: "prados-del-sol",
      storageBucket: "prados-del-sol.firebasestorage.app",
      messagingSenderId: "30316921952",
      appId: "1:30316921952:web:b0f88b9c35f270d548ef05"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    let articulosLocal = [], formatosLocal = [], clientesLocal = [], stockActual = {};
    const NOMBRE_CAJA_900 = "Cajas de 900cc";
    let articuloSeleccionadoEnFormato = "";

    function login() { auth.signInWithEmailAndPassword(document.getElementById('loginEmail').value, document.getElementById('loginPass').value); }
    function logout() { auth.signOut(); }

    auth.onAuthStateChanged(user => {
        if (user) {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('appSystem').classList.remove('hidden');
            iniciarApp();
        } else {
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('appSystem').classList.add('hidden');
        }
    });

    function iniciarApp() {
        db.collection("articulos").orderBy("nombre").onSnapshot(s => {
            articulosLocal = s.docs.map(d => ({id:d.id, ...d.data()}));
            document.getElementById('fArticuloVinculado').innerHTML = articulosLocal.map(a => `<option value="${a.nombre}">${a.nombre}</option>`).join('');
            renderArticulosMaster();
        });
        db.collection("clientes").orderBy("nombre").onSnapshot(s => {
            clientesLocal = s.docs.map(d => ({id:d.id, ...d.data()}));
            document.getElementById('vtaCliente').innerHTML = '<option value="">-- Cliente --</option>' + clientesLocal.map(c => `<option value="${c.nombre}">${c.nombre}</option>`).join('');
        });
        db.collection("formatos").onSnapshot(s => {
            formatosLocal = s.docs.map(d => ({id:d.id, ...d.data()}));
            document.getElementById('vtaFormatoSel').innerHTML = '<option value="">-- Seleccionar Formato --</option>' + formatosLocal.map(f => `<option value="${f.id}">${f.nombre} (${f.articulo})</option>`).join('');
            renderFormatos();
        });
        db.collection("stock").onSnapshot(s => {
            const movs = s.docs.map(d => d.data());
            const res = {}; movs.forEach(m => res[m.articulo] = (res[m.articulo] || 0) + m.cantidad);
            stockActual = res;
            document.getElementById('tablaStockConsolidado').innerHTML = articulosLocal.map(a => `<tr><td>${a.nombre}</td><td class="text-center fw-bold">${(res[a.nombre] || 0).toLocaleString()}</td><td><span class="badge ${(res[a.nombre]||0)>100?'bg-success':'bg-danger'}">STOCK</span></td><td class="text-end"><button class="btn btn-sm btn-outline-danger" onclick="limpiarArt('${a.nombre}')">×</button></td></tr>`).join('');
        });
    }

    function aplicarFormatoVenta() {
        const f = formatosLocal.find(x => x.id === document.getElementById('vtaFormatoSel').value);
        if(f) {
            articuloSeleccionadoEnFormato = f.articulo;
            document.getElementById('vtaCjxP').value = f.cajas;
            document.getElementById('vtaUxC').value = f.unidades;
            document.getElementById('resArticuloNombre').innerText = f.articulo;
            calcularVentaFinal();
        }
    }

    function calcularVentaFinal() {
        const p = parseInt(document.getElementById('vtaPallets').value) || 0;
        const c = parseInt(document.getElementById('vtaCjxP').value) || 0;
        const u = parseInt(document.getElementById('vtaUxC').value) || 0;
        const art = articuloSeleccionadoEnFormato;
        
        const totCajas = p * c;
        const totBots = totCajas * u;

        document.getElementById('resBotellas').innerText = totBots.toLocaleString();
        const aplicaCaja = (art.includes("850") || art.includes("900") || art.includes("910"));
        document.getElementById('resCajas').innerText = aplicaCaja ? totCajas.toLocaleString() : 0;
    }

    async function confirmarVentaRemito() {
        const cliN = document.getElementById('vtaCliente').value;
        const bots = parseInt(document.getElementById('resBotellas').innerText.replace(/\./g,''));
        const cjs = parseInt(document.getElementById('resCajas').innerText.replace(/\./g,''));
        const art = articuloSeleccionadoEnFormato;

        if(!art || !cliN || bots <= 0) return alert("Seleccione un formato y un cliente");

        const batch = db.batch();
        batch.set(db.collection("stock").doc(), { articulo: art, cantidad: -bots, fecha: firebase.firestore.FieldValue.serverTimestamp(), motivo: `Venta ${cliN}` });
        if(cjs > 0) batch.set(db.collection("stock").doc(), { articulo: NOMBRE_CAJA_900, cantidad: -cjs, fecha: firebase.firestore.FieldValue.serverTimestamp(), motivo: `Insumo ${cliN}` });
        
        await batch.commit();
        alert("Despacho Exitoso. Stock de " + art + " descontado.");
    }

    function guardarFormato() {
        const n = document.getElementById('fNombre').value, a = document.getElementById('fArticuloVinculado').value;
        const c = parseInt(document.getElementById('fCajas').value), u = parseInt(document.getElementById('fUni').value);
        if(n && a) db.collection("formatos").add({nombre:n, articulo:a, cajas:c, unidades:u});
    }

    function guardarArticuloCloud() { const n = document.getElementById('confNuevoArt').value; if(n) db.collection("articulos").add({nombre:n}); }
    function renderArticulosMaster() { document.getElementById('listaArticulosMaster').innerHTML = articulosLocal.map(a => `<div class="list-group-item d-flex justify-content-between">${a.nombre} <span onclick="db.collection('articulos').doc('${a.id}').delete()">×</span></div>`).join(''); }
    function renderFormatos() { document.getElementById('listaFormatos').innerHTML = formatosLocal.map(f => `<div class="col-md-4 mb-2"><div class="card p-2 small"><b>${f.nombre}</b><br>${f.articulo}<br><span class="text-danger" onclick="db.collection('formatos').doc('${f.id}').delete()">Eliminar</span></div></div>`).join(''); }
    function showTab(id) { document.querySelectorAll('.content-section').forEach(s => s.classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); }
    async function limpiarArt(n) { if(confirm("Vaciar?")) { const snp = await db.collection("stock").where("articulo","==",n).get(); const b = db.batch(); snp.forEach(d => b.delete(d.ref)); await b.commit(); } }
</script>
</body>
</html>
