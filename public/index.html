<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Prados del Sol - Sistema de Gestión</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #1a5c37;
            --accent-color: #007bff;
            --sun-color: #f9bc15;
        }

        body { 
            background-color: #f4f7f6; 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0;
        }

        /* FONDO PERSONALIZADO DE PORTADA */
        #loginScreen {
            background: url('https://r.jina.ai/i/9e009f45348f43068f3e589cc5987157') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            text-align: center;
            border: none;
        }

        .login-card img {
            width: 180px;
            margin-bottom: 20px;
        }

        .form-control {
            border-radius: 10px;
            height: 48px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
        }

        .btn-ingresar {
            background-color: #2b78d2;
            color: white;
            border-radius: 10px;
            height: 48px;
            font-weight: bold;
            width: 100%;
            border: none;
            transition: 0.3s;
        }

        .btn-ingresar:hover { background-color: #1a5cad; }

        /* ESTILO INTERNO DEL SISTEMA */
        .sidebar { background-color: var(--primary-color); color: white; min-height: 100vh; padding: 20px; }
        .nav-link { color: rgba(255,255,255,0.8); cursor: pointer; padding: 12px; border-radius: 10px; margin-bottom: 5px; }
        .nav-link:hover, .nav-link.active { background: rgba(255,255,255,0.15); color: white; }
        .content-section { background: white; border-radius: 20px; padding: 25px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .hidden { display: none !important; }

        @media (max-width: 768px) {
            .sidebar { min-height: auto; padding: 10px; }
            .nav-custom { display: flex; overflow-x: auto; white-space: nowrap; gap: 5px; }
            .nav-link { font-size: 0.8rem; padding: 8px 12px !important; }
        }
    </style>
</head>
<body>

<div id="loginScreen">
    <div class="login-card mx-3">
        <div class="mb-4">
            <i class="fas fa-sun fa-3x text-warning"></i>
            <h3 class="fw-bold mt-2" style="color: #0b4a8d; letter-spacing: 1px;">PRADOS <small style="font-size: 0.5em; vertical-align: middle;">DEL</small> SOL</h3>
        </div>
        <input type="email" id="loginEmail" class="form-control" placeholder="Correo electrónico">
        <input type="password" id="loginPass" class="form-control" placeholder="Contraseña">
        <button onclick="login()" class="btn-ingresar shadow-sm">INGRESAR</button>
    </div>
</div>

<div id="appSystem" class="container-fluid hidden">
    <div class="row">
        <div class="col-md-2 sidebar shadow">
            <h5 class="text-center fw-bold mb-4">MENÚ PLANTA</h5>
            <nav class="nav-custom">
                <a class="nav-link active" onclick="showTab('stock')"><i class="fas fa-boxes me-2"></i> Stock</a>
                <a class="nav-link" onclick="showTab('ventas')"><i class="fas fa-truck me-2"></i> Ventas</a>
                <a class="nav-link" onclick="showTab('historial')"><i class="fas fa-history me-2"></i> Historial</a>
                <a class="nav-link" onclick="showTab('config')"><i class="fas fa-cogs me-2"></i> Config</a>
                <a class="nav-link text-warning mt-4" onclick="logout()"><i class="fas fa-power-off me-2"></i> Salir</a>
            </nav>
        </div>

        <div class="col-md-10 p-4">
            <div id="stock" class="content-section shadow-sm">
                <div class="row g-3">
                    <div class="col-md-8">
                        <div class="p-3 border rounded bg-light mb-3">
                            <h6 class="fw-bold text-success"><i class="fas fa-plus me-2"></i>Ingreso de Mercadería</h6>
                            <div class="row g-2">
                                <div class="col-6"><select id="selProveedor" class="form-select" onchange="filtrarArticulosAcuerdo()"></select></div>
                                <div class="col-6"><select id="selArticulo" class="form-select" onchange="calcularCarga()"></select></div>
                                <div class="col-4"><select id="selTipoCarga" class="form-select" onchange="calcularCarga()"><option value="p">Pallets</option><option value="c">Cajas</option><option value="u">Unidades</option></select></div>
                                <div class="col-4"><input type="number" id="inpCantidad" class="form-control" placeholder="Cant." oninput="calcularCarga()"></div>
                                <div class="col-4"><button class="btn btn-success w-100 fw-bold" onclick="guardarIngreso()">SUMAR</button></div>
                            </div>
                            <small class="text-muted">Total unidades: <span id="txtTotalFinal" class="fw-bold">0</span></small>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="p-3 border rounded bg-white mb-3 border-warning">
                            <h6 class="fw-bold text-warning"><i class="fas fa-cut me-2"></i>Uso Interno (Stretch/Cintas)</h6>
                            <select id="consumoArticulo" class="form-select mb-2"></select>
                            <div class="input-group input-group-sm">
                                <input type="number" id="consumoCantidad" class="form-control" placeholder="Cant.">
                                <button class="btn btn-warning fw-bold" onclick="registrarConsumo()">RESTAR</button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="table-responsive mt-3">
                    <table class="table table-hover">
                        <thead class="table-dark"><tr><th>Artículo</th><th class="text-center">Stock Real</th><th class="text-center">Mínimo</th><th></th></tr></thead>
                        <tbody id="tablaStock"></tbody>
                    </table>
                </div>
            </div>

            <div id="ventas" class="content-section hidden">
                <h5 class="fw-bold text-primary mb-4">Despacho de Productos</h5>
                <div class="row g-3">
                    <div class="col-md-6"><label class="small fw-bold">Cliente</label><select id="vtaCliente" class="form-select"></select></div>
                    <div class="col-md-6"><label class="small fw-bold">Producto</label><select id="vtaArticulo" class="form-select" onchange="actualizarPrevisualizacion()"></select></div>
                    <div class="col-4"><label class="small">Pallets</label><input type="number" id="vtaPallets" class="form-control" value="28" oninput="actualizarPrevisualizacion()"></div>
                    <div class="col-4"><label class="small">CxP</label><input type="number" id="vtaCxP" class="form-control" value="75" oninput="actualizarPrevisualizacion()"></div>
                    <div class="col-4"><label class="small">UxC</label><input type="number" id="vtaUxC" class="form-control" value="12" oninput="actualizarPrevisualizacion()"></div>
                </div>
                <div class="mt-4 p-3 bg-light rounded border d-flex justify-content-around text-center">
                    <div><small class="d-block">ACEITE (U)</small><h4 id="resTotalAceite" class="text-danger fw-bold">0</h4></div>
                    <div><small class="d-block">CAJAS (U)</small><h4 id="resTotalCajas" class="text-primary fw-bold">0</h4></div>
                    <div><small class="d-block">ETIQ. (U)</small><h4 id="resTotalEtiquetas" class="text-success fw-bold">0</h4></div>
                </div>
                <button class="btn btn-primary w-100 mt-4 py-3 fw-bold shadow" onclick="procesarDespacho()">CONFIRMAR CARGA</button>
            </div>

            <div id="historial" class="content-section hidden">
                <div class="d-flex justify-content-between mb-3">
                    <h5 class="fw-bold">Movimientos del Mes</h5>
                    <input type="month" id="filtroMes" class="form-control w-auto" onchange="cargarHistorial()">
                </div>
                <div class="table-responsive">
                    <table class="table table-sm">
                        <thead class="table-light"><tr><th>Fecha</th><th>Artículo</th><th>Tipo</th><th class="text-center">Cant.</th></tr></thead>
                        <tbody id="listaHistorial"></tbody>
                    </table>
                </div>
            </div>

            <div id="config" class="content-section hidden">
                <div class="row g-4">
                    <div class="col-md-6">
                        <h6>Maestro de Insumos</h6>
                        <div class="input-group mb-3">
                            <input type="text" id="confNuevoArt" class="form-control" placeholder="Nombre">
                            <input type="number" id="confMinArt" class="form-control" placeholder="Min" style="max-width: 80px;">
                            <button class="btn btn-dark" onclick="guardarArt()">+</button>
                        </div>
                        <div id="listaArts" class="list-group list-group-flush" style="max-height: 300px; overflow-y: auto;"></div>
                    </div>
                    <div class="col-md-6">
                        <h6>Proveedores</h6>
                        <div class="input-group mb-3"><input type="text" id="confNuevoProv" class="form-control"><button class="btn btn-dark" onclick="guardarProv()">+</button></div>
                        <div id="listaProvs" class="list-group list-group-flush"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // --- FIREBASE CONFIG ---
    const firebaseConfig = {
      apiKey: "AIzaSyCjYp0idCxs32QAofYLVEGcwvmd3HXy-3Y",
      authDomain: "prados-del-sol.firebaseapp.com",
      projectId: "prados-del-sol",
      storageBucket: "prados-del-sol.firebasestorage.app",
      messagingSenderId: "30316921952",
      appId: "1:30316921952:web:b0f88b9c35f270d548ef05"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    let articulos = [], proveedores = [], acuerdos = [], clientes = [], stockActualGlobal = {};

    function login() { 
        const email = document.getElementById('loginEmail').value;
        const pass = document.getElementById('loginPass').value;
        auth.signInWithEmailAndPassword(email, pass).catch(e => alert("Error: " + e.message)); 
    }
    function logout() { auth.signOut(); }
    
    auth.onAuthStateChanged(user => {
        if (user) { 
            document.getElementById('loginScreen').classList.add('hidden'); 
            document.getElementById('appSystem').classList.remove('hidden'); 
            const hoy = new Date();
            document.getElementById('filtroMes').value = hoy.getFullYear() + "-" + String(hoy.getMonth()+1).padStart(2, '0');
            iniciarApp(); 
        } else {
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('appSystem').classList.add('hidden');
        }
    });

    async function iniciarApp() {
        db.collection("articulos").orderBy("nombre").onSnapshot(s => {
            articulos = s.docs.map(d => ({id:d.id, ...d.data()}));
            renderMaestro();
            const html = articulos.map(a => `<option value="${a.nombre}">${a.nombre}</option>`).join('');
            document.getElementById('vtaArticulo').innerHTML = '<option value="">-- Producto --</option>' + html;
            document.getElementById('consumoArticulo').innerHTML = '<option value="">-- Artículo de Uso --</option>' + html;
        });

        db.collection("proveedores").orderBy("nombre").onSnapshot(s => {
            proveedores = s.docs.map(d => ({id:d.id, ...d.data()}));
            document.getElementById('selProveedor').innerHTML = '<option value="">-- Proveedor --</option>' + proveedores.map(p => `<option value="${p.nombre}">${p.nombre}</option>`).join('');
            renderLista('listaProvs', proveedores, 'proveedores');
        });

        db.collection("acuerdos").onSnapshot(s => { acuerdos = s.docs.map(d => ({id:d.id, ...d.data()})); });

        db.collection("stock").onSnapshot(s => {
            const res = {}; s.docs.forEach(d => { res[d.data().articulo] = (res[d.data().articulo] || 0) + d.data().cantidad; });
            stockActualGlobal = res;
            document.getElementById('tablaStock').innerHTML = Object.keys(res).map(artNombre => {
                const artData = articulos.find(a => a.nombre === artNombre);
                const min = artData ? (artData.minimo || 0) : 0;
                const actual = res[artNombre];
                return `<tr class="${actual <= min ? 'table-danger' : ''}">
                    <td class="fw-bold">${artNombre}</td>
                    <td class="text-center fw-bold fs-5">${actual.toLocaleString()}</td>
                    <td class="text-center text-muted small">${min}</td>
                    <td class="text-end"><i class="fas fa-trash text-muted" onclick="limpiarArt('${artNombre}')"></i></td>
                </tr>`;
            }).join('');
        });
        
        db.collection("clientes").orderBy("nombre").onSnapshot(s => {
            clientes = s.docs.map(d => ({id:d.id, ...d.data()}));
            document.getElementById('vtaCliente').innerHTML = '<option value="">-- Cliente --</option>' + clientes.map(c => `<option value="${c.nombre}">${c.nombre}</option>`).join('');
        });
    }

    // --- FUNCIONALIDAD ---
    function filtrarArticulosAcuerdo() {
        const prov = document.getElementById('selProveedor').value;
        const filtrados = acuerdos.filter(a => a.proveedor === prov);
        document.getElementById('selArticulo').innerHTML = '<option value="">-- Artículo --</option>' + filtrados.map(a => `<option value="${a.articulo}">${a.articulo}</option>`).join('');
    }
    function calcularCarga() {
        const prov = document.getElementById('selProveedor').value;
        const art = document.getElementById('selArticulo').value;
        const cant = parseInt(document.getElementById('inpCantidad').value) || 0;
        const tipo = document.getElementById('selTipoCarga').value;
        const ac = acuerdos.find(x => x.proveedor === prov && x.articulo === art);
        let total = (ac && tipo === 'p') ? cant * ac.cxp * ac.uxc : (ac && tipo === 'c') ? cant * ac.uxc : cant;
        document.getElementById('txtTotalFinal').innerText = total.toLocaleString();
    }
    async function guardarIngreso() {
        const art = document.getElementById('selArticulo').value;
        const totalU = parseInt(document.getElementById('txtTotalFinal').innerText.replace(/\./g,''));
        if(art && totalU > 0) {
            await db.collection("stock").add({ articulo: art, cantidad: totalU, tipo: "ingreso", fecha: firebase.firestore.FieldValue.serverTimestamp() });
            document.getElementById('inpCantidad').value = "";
        }
    }
    async function registrarConsumo() {
        const art = document.getElementById('consumoArticulo').value;
        const cant = parseInt(document.getElementById('consumoCantidad').value) || 0;
        if(!art || cant <= 0) return;
        await db.collection("stock").add({ articulo: art, cantidad: -cant, tipo: "consumo_interno", fecha: firebase.firestore.FieldValue.serverTimestamp() });
        document.getElementById('consumoCantidad').value = "";
    }
    function actualizarPrevisualizacion() {
        const p = parseInt(document.getElementById('vtaPallets').value) || 0;
        const c = parseInt(document.getElementById('vtaCxP').value) || 0;
        const u = parseInt(document.getElementById('vtaUxC').value) || 0;
        document.getElementById('resTotalAceite').innerText = (p * c * u).toLocaleString();
        document.getElementById('resTotalCajas').innerText = (p * c).toLocaleString();
        document.getElementById('resTotalEtiquetas').innerText = (p * c * u).toLocaleString();
    }
    async function procesarDespacho() {
        const prod = document.getElementById('vtaArticulo').value;
        const totalU = parseInt(document.getElementById('resTotalAceite').innerText.replace(/\./g,''));
        if(!prod || totalU <= 0) return alert("Datos incompletos");
        await db.collection("stock").add({ articulo: prod, cantidad: -totalU, tipo: "venta", fecha: firebase.firestore.FieldValue.serverTimestamp() });
        alert("Carga registrada con éxito");
    }
    async function cargarHistorial() {
        const mesSel = document.getElementById('filtroMes').value;
        const start = new Date(mesSel + "-01T00:00:00");
        const end = new Date(start.getFullYear(), start.getMonth() + 1, 0, 23, 59, 59);
        const snp = await db.collection("stock").where("fecha", ">=", start).where("fecha", "<=", end).orderBy("fecha", "desc").get();
        let h = "";
        snp.forEach(doc => {
            const d = doc.data();
            h += `<tr><td class="small">${d.fecha ? d.fecha.toDate().toLocaleDateString() : 'S/F'}</td><td class="fw-bold">${d.articulo}</td><td>${d.tipo}</td><td class="text-center fw-bold ${d.cantidad<0?'text-danger':'text-success'}">${d.cantidad}</td></tr>`;
        });
        document.getElementById('listaHistorial').innerHTML = h;
    }
    function showTab(id) {
        document.querySelectorAll('.content-section').forEach(s => s.classList.add('hidden'));
        document.querySelectorAll('.nav-link').forEach(n => n.classList.remove('active'));
        document.getElementById(id).classList.remove('hidden');
        if(event) event.currentTarget.classList.add('active');
        if(id === 'historial') cargarHistorial();
    }
    function guardarArt() { const n = document.getElementById('confNuevoArt').value; const m = parseInt(document.getElementById('confMinArt').value) || 0; if(n) db.collection("articulos").add({nombre: n.toLowerCase(), minimo: m}); }
    function renderMaestro() { document.getElementById('listaArts').innerHTML = articulos.map(a => `<div class="list-group-item d-flex justify-content-between p-1 small">${a.nombre} <i class="fas fa-times text-danger" onclick="db.collection('articulos').doc('${a.id}').delete()"></i></div>`).join(''); }
    function guardarProv() { const n = document.getElementById('confNuevoProv').value; if(n) db.collection("proveedores").add({nombre: n}); }
    function renderLista(id, data, coll) { document.getElementById(id).innerHTML = data.map(item => `<div class="list-group-item d-flex justify-content-between p-1 small">${item.nombre} <i class="fas fa-times text-danger" onclick="db.collection('${coll}').doc('${item.id}').delete()"></i></div>`).join(''); }
    async function limpiarArt(n) { if(confirm("¿Vaciar stock?")) { const snp = await db.collection("stock").where("articulo","==",n).get(); const b = db.batch(); snp.forEach(d => b.delete(d.ref)); await b.commit(); } }
</script>
</body>
</html>
