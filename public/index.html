<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prados del Sol - Gestión de Insumos</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', sans-serif; }
        .sidebar { min-height: 100vh; background-color: #212529; color: white; padding: 20px; position: sticky; top: 0; }
        .nav-link { color: #adb5bd; cursor: pointer; padding: 12px; border-radius: 8px; margin-bottom: 5px; display: block; text-decoration: none; }
        .nav-link:hover, .nav-link.active { color: white; background-color: #0d6efd; }
        .hidden { display: none !important; }
        .card { border: none; box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075); border-radius: 10px; }
        .bg-detalle { background-color: #e9ecef; border-radius: 8px; padding: 10px; }
    </style>
</head>
<body>

<div id="loginScreen" class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card p-4 shadow-lg" style="width: 380px;">
        <h4 class="text-center mb-4">Prados del Sol</h4>
        <input type="email" id="loginEmail" class="form-control mb-3" placeholder="Correo">
        <input type="password" id="loginPass" class="form-control mb-3" placeholder="Contraseña">
        <button onclick="login()" class="btn btn-primary w-100">Ingresar</button>
    </div>
</div>

<div id="appSystem" class="container-fluid hidden">
    <div class="row">
        <div class="col-md-2 sidebar">
            <h5 class="text-center mb-4 border-bottom pb-3 text-info">GESTIÓN PRADOS</h5>
            <nav>
                <a class="nav-link active" onclick="showTab('stock')"><i class="fas fa-boxes me-2"></i> Inventario</a>
                <a class="nav-link" onclick="showTab('ventas')"><i class="fas fa-file-contract me-2"></i> Nueva Venta</a>
                <a class="nav-link" onclick="showTab('clientes')"><i class="fas fa-user-friends me-2"></i> Clientes</a>
                <a class="nav-link" onclick="showTab('config')"><i class="fas fa-cog me-2"></i> Configuración</a>
                <a class="nav-link mt-5 text-danger" onclick="logout()"><i class="fas fa-power-off me-2"></i> Salir</a>
            </nav>
        </div>

        <div class="col-md-10 p-4">
            
            <div id="stock" class="content-section">
                <div class="d-flex justify-content-between mb-4">
                    <h3>Panel de Stock Real</h3>
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalIngreso"><i class="fas fa-plus me-1"></i> Entrada de Mercancía</button>
                </div>
                <div class="card p-3">
                    <table class="table align-middle">
                        <thead class="table-dark">
                            <tr><th>Artículo / Insumo</th><th class="text-center">Cant. Unidades</th><th>Estado</th><th class="text-end">Limpiar</th></tr>
                        </thead>
                        <tbody id="tablaStockConsolidado"></tbody>
                    </table>
                </div>
            </div>

            <div id="ventas" class="content-section hidden">
                <div class="row">
                    <div class="col-md-7">
                        <div class="card p-4 border-top border-primary border-4">
                            <h4>Armado de Despacho</h4>
                            <div class="row g-3">
                                <div class="col-md-6"><label>Cliente</label><select id="vtaCliente" class="form-select" onchange="calcularVentaFinal()"></select></div>
                                <div class="col-md-6"><label>Aceite</label><select id="vtaArticulo" class="form-select" onchange="calcularVentaFinal()"></select></div>
                                <div class="col-md-12"><label class="text-primary">Formato Guardado</label><select id="vtaFormatoSel" class="form-select" onchange="aplicarFormatoVenta()"></select></div>
                                <div class="col-md-4"><label>Pallets</label><input type="number" id="vtaPallets" class="form-control" value="28" oninput="calcularVentaFinal()"></div>
                                <div class="col-md-4"><label>Cajas x Pallet</label><input type="number" id="vtaCjxP" class="form-control" oninput="calcularVentaFinal()"></div>
                                <div class="col-md-4"><label>Unid. x Caja</label><input type="number" id="vtaUxC" class="form-control" oninput="calcularVentaFinal()"></div>
                            </div>
                            <button class="btn btn-primary w-100 mt-4 py-2 fw-bold" onclick="confirmarVentaRemito()">DESCONTAR STOCK</button>
                        </div>
                    </div>
                </div>
            </div>

            <div id="clientes" class="content-section hidden">
                <div class="card p-4">
                    <h4>Gestión de Clientes</h4>
                    <div class="row g-2 mb-4">
                        <div class="col-md-3"><input type="text" id="cliNombre" class="form-control" placeholder="Nombre"></div>
                        <div class="col-md-3"><input type="text" id="cliID" class="form-control" placeholder="CUIT"></div>
                        <div class="col-md-4"><input type="text" id="cliDir" class="form-control" placeholder="Dirección"></div>
                        <div class="col-md-2"><button class="btn btn-dark w-100" onclick="guardarCliente()">Añadir</button></div>
                    </div>
                    <table class="table table-hover">
                        <tbody id="tablaClientes"></tbody>
                    </table>
                </div>
            </div>

            <div id="config" class="content-section hidden">
                <div class="row g-4">
                    <div class="col-md-4">
                        <div class="card p-3">
                            <h5>Proveedores</h5>
                            <div class="input-group mb-2"><input type="text" id="confNuevoProv" class="form-control"><button class="btn btn-dark" onclick="guardarProveedor()">+</button></div>
                            <div id="listaProveedores" class="list-group"></div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card p-3">
                            <h5>Artículos</h5>
                            <div class="input-group mb-2"><input type="text" id="confNuevoArt" class="form-control"><button class="btn btn-info text-white" onclick="guardarArticuloCloud()">+</button></div>
                            <div id="listaArticulosMaster" class="list-group"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="modalIngreso" tabindex="-1">
    <div class="modal-dialog"><div class="modal-content">
        <div class="modal-header bg-primary text-white"><h5>Entrada de Mercadería</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
            <label class="fw-bold">Proveedor</label><select id="selProveedor" class="form-select mb-3"></select>
            <label class="fw-bold">Artículo</label><select id="selArticulo" class="form-select mb-3"></select>
            
            <div class="bg-detalle mb-3">
                <label class="fw-bold">Modo de Carga</label>
                <select id="selTipoCarga" class="form-select mb-3" onchange="toggleInputsCarga()">
                    <option value="u">Carga por Unidades Sueltas</option>
                    <option value="c">Carga por Cajas</option>
                    <option value="p">Carga por Pallets</option>
                </select>

                <div class="row g-2">
                    <div class="col-12" id="divPrincipal">
                        <label id="lblPrincipal">Cantidad de Unidades</label>
                        <input type="number" id="inpCantidad" class="form-control" oninput="calcularIngreso()">
                    </div>
                    
                    <div class="col-6 hidden" id="divCajasXPallet">
                        <label>Cajas x Pallet</label>
                        <input type="number" id="inpCjxP" class="form-control" value="75" oninput="calcularIngreso()">
                    </div>

                    <div class="col-6 hidden" id="divUnidXCaja">
                        <label>Unid. x Caja</label>
                        <input type="number" id="inpUxC" class="form-control" value="12" oninput="calcularIngreso()">
                    </div>
                </div>
            </div>

            <div class="text-center p-3 border border-primary rounded">
                <span class="text-muted d-block small">TOTAL A INGRESAR AL STOCK</span>
                <span id="txtTotalFinal" class="fs-2 fw-bold text-primary">0</span> <span class="text-primary fw-bold">Unidades</span>
            </div>
        </div>
        <div class="modal-footer"><button class="btn btn-success w-100 py-2 fw-bold" onclick="guardarIngresoCloud()">CONFIRMAR ENTRADA</button></div>
    </div></div>
</div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyCjYp0idCxs32QAofYLVEGcwvmd3HXy-3Y",
      authDomain: "prados-del-sol.firebaseapp.com",
      projectId: "prados-del-sol",
      storageBucket: "prados-del-sol.firebasestorage.app",
      messagingSenderId: "30316921952",
      appId: "1:30316921952:web:b0f88b9c35f270d548ef05"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    let articulosLocal = [], provsLocal = [], formatosLocal = [], clientesLocal = [];

    function login() { auth.signInWithEmailAndPassword(document.getElementById('loginEmail').value, document.getElementById('loginPass').value); }
    function logout() { auth.signOut(); }

    auth.onAuthStateChanged(user => {
        if (user) { document.getElementById('loginScreen').classList.add('hidden'); document.getElementById('appSystem').classList.remove('hidden'); iniciarApp(); }
        else { document.getElementById('loginScreen').classList.remove('hidden'); document.getElementById('appSystem').classList.add('hidden'); }
    });

    function toggleInputsCarga() {
        const modo = document.getElementById('selTipoCarga').value;
        const divPrincipal = document.getElementById('divPrincipal');
        const lblPrincipal = document.getElementById('lblPrincipal');
        const divCjxP = document.getElementById('divCajasXPallet');
        const divUxC = document.getElementById('divUnidXCaja');

        // Resetear campos
        divCjxP.classList.add('hidden');
        divUxC.classList.add('hidden');

        if (modo === 'u') {
            lblPrincipal.innerText = "Cantidad de Unidades";
        } else if (modo === 'c') {
            lblPrincipal.innerText = "Cantidad de Cajas";
            divUxC.classList.remove('hidden');
        } else if (modo === 'p') {
            lblPrincipal.innerText = "Cantidad de Pallets";
            divCjxP.classList.remove('hidden');
            divUxC.classList.remove('hidden');
        }
        calcularIngreso();
    }

    function calcularIngreso() {
        const cant = parseInt(document.getElementById('inpCantidad').value) || 0;
        const modo = document.getElementById('selTipoCarga').value;
        const uxc = parseInt(document.getElementById('inpUxC').value) || 0;
        const cjxp = parseInt(document.getElementById('inpCjxP').value) || 0;

        let total = 0;
        if (modo === 'u') total = cant;
        if (modo === 'c') total = cant * uxc;
        if (modo === 'p') total = cant * cjxp * uxc;

        document.getElementById('txtTotalFinal').innerText = total.toLocaleString();
    }

    // Funciones de Inicialización
    function iniciarApp() {
        db.collection("articulos").orderBy("nombre").onSnapshot(s => {
            articulosLocal = s.docs.map(d => ({id:d.id, ...d.data()}));
            const html = '<option value="">-- Seleccionar --</option>' + articulosLocal.map(a => `<option value="${a.nombre}">${a.nombre}</option>`).join('');
            document.getElementById('vtaArticulo').innerHTML = html;
            document.getElementById('selArticulo').innerHTML = html;
            renderArticulosMaster();
        });
        db.collection("proveedores").orderBy("nombre").onSnapshot(s => {
            provsLocal = s.docs.map(d => ({id:d.id, ...d.data()}));
            document.getElementById('selProveedor').innerHTML = '<option value="">-- Proveedor --</option>' + provsLocal.map(p => `<option value="${p.nombre}">${p.nombre}</option>`).join('');
            renderProveedores();
        });
        db.collection("clientes").orderBy("nombre").onSnapshot(s => {
            clientesLocal = s.docs.map(d => ({id:d.id, ...d.data()}));
            document.getElementById('vtaCliente').innerHTML = '<option value="">-- Cliente --</option>' + clientesLocal.map(c => `<option value="${c.nombre}">${c.nombre}</option>`).join('');
            renderClientes();
        });
        db.collection("stock").onSnapshot(s => {
            const res = {}; s.docs.forEach(d => res[d.data().articulo] = (res[d.data().articulo] || 0) + d.data().cantidad);
            document.getElementById('tablaStockConsolidado').innerHTML = articulosLocal.map(a => `<tr><td>${a.nombre}</td><td class="text-center fw-bold">${(res[a.nombre] || 0).toLocaleString()}</td><td><span class="badge bg-success">STOCK</span></td><td class="text-end"><button class="btn btn-sm btn-outline-danger" onclick="limpiarArt('${a.nombre}')">×</button></td></tr>`).join('');
        });
    }

    async function guardarIngresoCloud() {
        const art = document.getElementById('selArticulo').value;
        const prov = document.getElementById('selProveedor').value;
        const cant = parseInt(document.getElementById('txtTotalFinal').innerText.replace(/\./g,''));
        if(!art || !prov || cant <= 0) return alert("Faltan datos");
        await db.collection("stock").add({ articulo: art, proveedor: prov, cantidad: cant, fecha: firebase.firestore.FieldValue.serverTimestamp() });
        alert("¡Ingreso Exitoso!");
        document.getElementById('inpCantidad').value = "";
    }

    // Restauración de auxiliares
    function guardarProveedor() { const n = document.getElementById('confNuevoProv').value; if(n) db.collection("proveedores").add({nombre:n}); }
    function guardarArticuloCloud() { const n = document.getElementById('confNuevoArt').value; if(n) db.collection("articulos").add({nombre:n}); }
    function renderProveedores() { document.getElementById('listaProveedores').innerHTML = provsLocal.map(p => `<div class="list-group-item d-flex justify-content-between p-1">${p.nombre} <i class="fas fa-times text-danger" onclick="db.collection('proveedores').doc('${p.id}').delete()"></i></div>`).join(''); }
    function renderArticulosMaster() { document.getElementById('listaArticulosMaster').innerHTML = articulosLocal.map(a => `<div class="list-group-item d-flex justify-content-between p-1">${a.nombre} <i class="fas fa-times text-danger" onclick="db.collection('articulos').doc('${a.id}').delete()"></i></div>`).join(''); }
    function showTab(id) { document.querySelectorAll('.content-section').forEach(s => s.classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); }
    async function limpiarArt(n) { if(confirm("¿Vaciar stock?")) { const snp = await db.collection("stock").where("articulo","==",n).get(); const b = db.batch(); snp.forEach(d => b.delete(d.ref)); await b.commit(); } }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
