<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistema Prados del Sol - Estable</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', sans-serif; }
        .sidebar { background-color: #2c3e50; color: white; min-height: 100vh; padding: 20px; }
        .nav-link { color: #bdc3c7; cursor: pointer; padding: 12px; border-radius: 8px; margin-bottom: 8px; display: block; text-decoration: none; }
        .nav-link:hover, .nav-link.active { background: #3498db; color: white; }
        .hidden { display: none !important; }
        .card { border-radius: 12px; border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .header-prod { background: #3498db; color: white; padding: 15px; border-radius: 12px 12px 0 0; }
        label { font-weight: bold; margin-bottom: 5px; font-size: 0.9rem; }
    </style>
</head>
<body>

<div id="loginScreen" class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card p-4 shadow w-100" style="max-width: 380px;">
        <h3 class="text-center mb-4">PRADOS DEL SOL</h3>
        <input type="email" id="loginEmail" class="form-control mb-2" placeholder="Usuario">
        <input type="password" id="loginPass" class="form-control mb-3" placeholder="Contraseña">
        <button onclick="login()" class="btn btn-primary w-100 fw-bold">INGRESAR</button>
    </div>
</div>

<div id="appSystem" class="container-fluid hidden">
    <div class="row">
        <div class="col-md-2 sidebar">
            <h5 class="text-center mb-4 text-info fw-bold">LOGÍSTICA</h5>
            <nav>
                <a class="nav-link active" onclick="showTab('stock')"><i class="fas fa-boxes me-2"></i> Stock</a>
                <a class="nav-link" onclick="showTab('produccion')"><i class="fas fa-industry me-2"></i> Producción</a>
                <a class="nav-link" onclick="showTab('ventas')"><i class="fas fa-truck me-2"></i> Ventas</a>
                <a class="nav-link" onclick="showTab('config')"><i class="fas fa-cog me-2"></i> Configuración</a>
                <hr>
                <a class="nav-link text-danger" onclick="logout()"><i class="fas fa-power-off me-2"></i> Salir</a>
            </nav>
        </div>

        <div class="col-md-10 p-4">
            
            <div id="stock" class="content-section">
                <div class="card p-3 mb-4">
                    <h5 class="fw-bold text-primary mb-3">Ingreso Directo / Proveedores</h5>
                    <div class="row g-2">
                        <div class="col-md-5"><label>Artículo</label><select id="stockArt" class="form-select"></select></div>
                        <div class="col-md-3"><label>Cantidad</label><input type="number" id="stockCant" class="form-control"></div>
                        <div class="col-md-4 d-flex align-items-end"><button class="btn btn-primary w-100" onclick="sumarStockDirecto()">CARGAR AL INVENTARIO</button></div>
                    </div>
                </div>
                <div class="card p-3">
                    <h6 class="fw-bold mb-3">Estado del Depósito</h6>
                    <table class="table table-striped align-middle">
                        <thead class="table-dark"><tr><th>Artículo</th><th class="text-center">Stock Actual</th><th class="text-end">Acción</th></tr></thead>
                        <tbody id="tablaStockBody"></tbody>
                    </table>
                </div>
            </div>

            <div id="produccion" class="content-section hidden">
                <div class="card shadow">
                    <div class="header-prod d-flex justify-content-between align-items-center">
                        <h5 class="m-0"><i class="fas fa-tools me-2"></i> Registro de Producción</h5>
                        <div class="bg-white text-dark px-3 py-1 rounded-pill">
                            <small class="fw-bold">STOCK ACTUAL: </small>
                            <span id="lblStockVivo" class="fw-bold text-primary">0</span>
                        </div>
                    </div>
                    <div class="p-4">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label>¿Qué artículo se produjo?</label>
                                <select id="prodArt" class="form-select form-select-lg" onchange="actualizarLabelProduccion()"></select>
                            </div>
                            <div class="col-md-3">
                                <label>Turno</label>
                                <select id="prodTurno" class="form-select form-select-lg">
                                    <option>Mañana</option><option>Tarde</option><option>Noche</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label>Lote</label>
                                <input type="text" id="prodLote" class="form-control form-select-lg" placeholder="Nº de Lote">
                            </div>
                        </div>

                        <div class="row g-3 mt-3 p-3 bg-light rounded border">
                            <div class="col-md-3"><label>Pallets</label><input type="number" id="pPal" class="form-control" value="1" oninput="calcProd()"></div>
                            <div class="col-md-3"><label>Cajas x Pallet</label><input type="number" id="pCaj" class="form-control" value="75" oninput="calcProd()"></div>
                            <div class="col-md-3"><label>Unid x Caja</label><input type="number" id="pUni" class="form-control" value="12" oninput="calcProd()"></div>
                            <div class="col-md-3 d-flex align-items-center justify-content-end">
                                <div class="text-end">
                                    <small class="d-block text-muted">A SUMAR:</small>
                                    <h3 class="m-0 text-primary fw-bold" id="txtTotalProd">900</h3>
                                </div>
                            </div>
                        </div>
                        <button class="btn btn-success btn-lg w-100 mt-4 fw-bold py-3 shadow" onclick="finalizarProduccion()">
                            CONFIRMAR Y SUMAR AL STOCK
                        </button>
                    </div>
                </div>
            </div>

            <div id="config" class="content-section hidden">
                <div class="card p-4">
                    <h5 class="fw-bold mb-3">Maestro de Artículos</h5>
                    <div class="input-group mb-3">
                        <input type="text" id="newArtName" class="form-control" placeholder="Ej: Botella 900cc">
                        <button class="btn btn-dark" onclick="crearArticulo()">+ AGREGAR ARTÍCULO</button>
                    </div>
                    <div id="listaArtsConfig" class="list-group"></div>
                </div>
            </div>

        </div>
    </div>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyCjYp0idCxs32QAofYLVEGcwvmd3HXy-3Y", authDomain: "prados-del-sol.firebaseapp.com", projectId: "prados-del-sol", storageBucket: "prados-del-sol.firebasestorage.app", messagingSenderId: "30316921952", appId: "1:30316921952:web:b0f88b9c35f270d548ef05" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    let articulos = [];
    let inventario = {};

    function login() { auth.signInWithEmailAndPassword(document.getElementById('loginEmail').value, document.getElementById('loginPass').value); }
    function logout() { auth.signOut(); }
    auth.onAuthStateChanged(user => { 
        if (user) { 
            document.getElementById('loginScreen').classList.add('hidden'); 
            document.getElementById('appSystem').classList.remove('hidden'); 
            init(); 
        } else { 
            document.getElementById('loginScreen').classList.remove('hidden'); 
            document.getElementById('appSystem').classList.add('hidden'); 
        } 
    });

    function init() {
        // Escuchar Artículos
        db.collection("articulos").orderBy("nombre").onSnapshot(s => {
            articulos = s.docs.map(d => ({id: d.id, nombre: d.data().nombre}));
            const options = articulos.map(a => `<option value="${a.nombre}">${a.nombre}</option>`).join('');
            document.getElementById('stockArt').innerHTML = options;
            document.getElementById('prodArt').innerHTML = options;
            renderArtsConfig();
        });

        // Escuchar Movimientos de Stock
        db.collection("stock").onSnapshot(s => {
            inventario = {};
            s.docs.forEach(d => {
                const data = d.data();
                inventario[data.articulo] = (inventario[data.articulo] || 0) + data.cantidad;
            });
            renderTablaStock();
            actualizarLabelProduccion();
        });
    }

    // --- FUNCIONES DE PRODUCCIÓN ---
    function calcProd() {
        const total = (parseInt(document.getElementById('pPal').value)||0) * (parseInt(document.getElementById('pCaj').value)||0) * (parseInt(document.getElementById('pUni').value)||0);
        document.getElementById('txtTotalProd').innerText = total.toLocaleString();
    }

    function actualizarLabelProduccion() {
        const art = document.getElementById('prodArt').value;
        document.getElementById('lblStockVivo').innerText = (inventario[art] || 0).toLocaleString();
    }

    async function finalizarProduccion() {
        const art = document.getElementById('prodArt').value;
        const lote = document.getElementById('prodLote').value;
        const total = parseInt(document.getElementById('txtTotalProd').innerText.replace(/\./g,''));

        if(!art || !lote || total <= 0) return alert("Verifique los datos (Artículo, Lote y Cantidad)");

        await db.collection("stock").add({
            articulo: art,
            cantidad: total,
            tipo: "Producción",
            lote: lote,
            fecha: firebase.firestore.FieldValue.serverTimestamp()
        });

        alert("¡Producción sumada con éxito!");
        document.getElementById('prodLote').value = "";
    }

    // --- FUNCIONES DE STOCK Y CONFIG ---
    function renderTablaStock() {
        document.getElementById('tablaStockBody').innerHTML = Object.keys(inventario).sort().map(k => `
            <tr>
                <td>${k}</td>
                <td class="text-center fw-bold">${inventario[k].toLocaleString()}</td>
                <td class="text-end"><button class="btn btn-sm btn-outline-danger" onclick="resetArtStock('${k}')"><i class="fas fa-trash"></i></button></td>
            </tr>
        `).join('');
    }

    async function sumarStockDirecto() {
        const art = document.getElementById('stockArt').value;
        const cant = parseInt(document.getElementById('stockCant').value)||0;
        if(art && cant > 0) {
            await db.collection("stock").add({ articulo: art, cantidad: cant, tipo: "Ingreso Manual", fecha: firebase.firestore.FieldValue.serverTimestamp() });
            document.getElementById('stockCant').value = "";
        }
    }

    function crearArticulo() {
        const name = document.getElementById('newArtName').value;
        if(name) db.collection("articulos").add({ nombre: name });
        document.getElementById('newArtName').value = "";
    }

    function renderArtsConfig() {
        document.getElementById('listaArtsConfig').innerHTML = articulos.map(a => `
            <div class="list-group-item d-flex justify-content-between align-items-center">
                ${a.nombre}
                <button class="btn btn-sm btn-danger" onclick="db.collection('articulos').doc('${a.id}').delete()">Eliminar</button>
            </div>
        `).join('');
    }

    async function resetArtStock(art) {
        if(!confirm("¿Desea vaciar el stock de " + art + "?")) return;
        const s = await db.collection("stock").where("articulo", "==", art).get();
        const b = db.batch(); s.forEach(d => b.delete(d.ref)); await b.commit();
    }

    function showTab(id) {
        document.querySelectorAll('.content-section').forEach(s => s.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
        event.currentTarget.classList.add('active');
    }
</script>
</body>
</html>
