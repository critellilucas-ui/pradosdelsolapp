<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Prados del Sol - Gestión Móvil v19</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body { background-color: #f0f2f5; font-family: 'Segoe UI', sans-serif; overflow-x: hidden; }
        #loginScreen { background: url('https://r.jina.ai/i/05e24f469399436181b51e44f8f9467d') no-repeat center center fixed; background-size: cover; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { background: rgba(255, 255, 255, 0.95); border-radius: 25px; padding: 40px 30px; width: 100%; max-width: 380px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); text-align: center; }
        .btn-ingresar { background-color: #2b78d2; color: white; border-radius: 12px; height: 50px; font-weight: bold; width: 100%; border: none; margin-top: 10px; }
        .sidebar { background-color: #212529; color: white; padding: 15px; z-index: 1000; }
        @media (min-width: 768px) { .sidebar { min-height: 100vh; position: sticky; top: 0; } }
        @media (max-width: 767px) { .sidebar { position: relative; min-height: auto; padding: 10px; } .nav-custom { display: flex; overflow-x: auto; white-space: nowrap; gap: 5px; padding-bottom: 5px; } .nav-link { font-size: 0.85rem; padding: 8px 12px !important; flex: 0 0 auto; border: 1px solid #444; } }
        .nav-link { color: #adb5bd; cursor: pointer; padding: 12px; border-radius: 8px; transition: 0.3s; text-decoration: none; }
        .nav-link:hover, .nav-link.active { color: white; background-color: #0d6efd; }
        .hidden { display: none !important; }
        .card { border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border-radius: 12px; margin-bottom: 15px; }
        input, select { height: 45px !important; border-radius: 8px !important; }
        .chk-lote { width: 18px; height: 18px; cursor: pointer; }
    </style>
</head>
<body>

<div id="loginScreen">
    <div class="login-card mx-3">
        <div class="logo-container mb-4"><i class="fas fa-sun text-warning fa-3x"></i><h2>PRADOS DEL SOL</h2></div>
        <input type="email" id="loginEmail" class="form-control mb-3" placeholder="Correo">
        <input type="password" id="loginPass" class="form-control mb-3" placeholder="Contraseña">
        <button onclick="login()" class="btn-ingresar shadow-sm">INGRESAR</button>
    </div>
</div>

<div id="appSystem" class="container-fluid hidden">
    <div class="row">
        <div class="col-md-2 sidebar">
            <h5 class="text-center mb-4 border-bottom pb-2 text-info">SISTEMA PRADOS</h5>
            <nav class="nav-custom">
                <a class="nav-link active" onclick="showTab('stock')"><i class="fas fa-boxes me-1"></i> Stock</a>
                <a class="nav-link" onclick="showTab('ventas')"><i class="fas fa-truck me-1"></i> Ventas</a>
                <a class="nav-link" onclick="showTab('historial')"><i class="fas fa-history me-1"></i> Historial</a>
                <a class="nav-link" onclick="showTab('clientes')"><i class="fas fa-users me-1"></i> Clientes</a>
                <a class="nav-link text-danger" onclick="logout()"><i class="fas fa-power-off"></i></a>
            </nav>
        </div>

        <div class="col-md-10 p-2 p-md-4">
            <div id="stock" class="content-section">
                <div class="row">
                    <div class="col-lg-8">
                        <div class="card p-3 border-top border-success border-4 shadow-sm">
                            <h5 class="mb-3 text-success fw-bold">Carga por Proveedor</h5>
                            <div class="row g-2">
                                <div class="col-6"><label class="small fw-bold">Proveedor</label><select id="selProveedor" class="form-select" onchange="filtrarArticulosAcuerdo()"></select></div>
                                <div class="col-6"><label class="small fw-bold">Artículo</label><select id="selArticulo" class="form-select" onchange="calcularCarga()"></select></div>
                                <div class="col-6"><label class="small fw-bold">Tipo</label><select id="selTipoCarga" class="form-select" onchange="calcularCarga()"><option value="p">Pallets</option><option value="c">Cajas</option><option value="u">Unidades</option></select></div>
                                <div class="col-6"><label class="small fw-bold">Cantidad</label><input type="number" id="inpCantidad" class="form-control" oninput="calcularCarga()"></div>
                            </div>
                            <div class="mt-3 d-flex justify-content-between align-items-center bg-light p-2 rounded">
                                <span class="small fw-bold">Total: <span id="txtTotalFinal" class="text-success fs-5">0</span> u.</span>
                                <button class="btn btn-success btn-sm" onclick="guardarIngreso()">CONFIRMAR</button>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-4">
                        <div class="card p-3 border-top border-warning border-4 shadow-sm">
                            <h5 class="text-warning fw-bold">Uso de Fábrica</h5>
                            <select id="consumoArticulo" class="form-select mb-2"></select>
                            <div class="input-group"><input type="number" id="consumoCantidad" class="form-control" placeholder="Cant."><button class="btn btn-warning text-white" onclick="registrarConsumo()">RESTAR</button></div>
                        </div>
                    </div>
                </div>
                <div class="card p-2 shadow-sm">
                    <div class="table-responsive">
                        <table class="table table-sm align-middle mb-0">
                            <thead class="table-dark"><tr><th>Artículo</th><th class="text-center">Stock</th><th class="text-end"></th></tr></thead>
                            <tbody id="tablaStock" style="font-size: 0.9rem;"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div id="ventas" class="content-section hidden">
                <div class="card p-3 border-top border-primary border-4 shadow-sm">
                    <h5 class="text-primary fw-bold mb-3">Nueva Venta / Despacho</h5>
                    <div class="row g-2">
                        <div class="col-12 col-md-6"><label class="small fw-bold">Cliente</label><select id="vtaCliente" class="form-select"></select></div>
                        <div class="col-12 col-md-6"><label class="small fw-bold">Patente del Camión</label><input type="text" id="vtaPatente" class="form-control" placeholder="Cargar en el momento" style="text-transform:uppercase"></div>
                        <div class="col-12"><label class="small fw-bold">Producto</label><select id="vtaArticulo" class="form-select" onchange="actualizarPrevisualizacion()"></select></div>
                        <div class="col-4"><label class="small">Pallets</label><input type="number" id="vtaPallets" class="form-control" value="28" oninput="actualizarPrevisualizacion()"></div>
                        <div class="col-4"><label class="small">CxP</label><input type="number" id="vtaCxP" class="form-control" value="75" oninput="actualizarPrevisualizacion()"></div>
                        <div class="col-4"><label class="small">UxC</label><input type="number" id="vtaUxC" class="form-control" value="12" oninput="actualizarPrevisualizacion()"></div>
                    </div>
                    <div class="resumen-vta mt-3 p-2 bg-light rounded d-flex justify-content-around text-center border">
                        <div><small class="d-block text-muted">Unidades</small><span class="fw-bold text-danger" id="resTotalAceite">0</span></div>
                        <div><small class="d-block text-muted">Cajas</small><span class="fw-bold text-primary" id="resTotalCajas">0</span></div>
                    </div>
                    <button class="btn btn-primary w-100 mt-3 py-2 fw-bold" onclick="procesarDespacho()">CONFIRMAR DESPACHO</button>
                </div>
            </div>

            <div id="historial" class="content-section hidden">
                <div class="card p-3 border-top border-info border-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="fw-bold mb-0">Historial</h5>
                        <button class="btn btn-sm btn-danger hidden" id="btnBorrarLote" onclick="borrarLote()">Borrar Seleccionados</button>
                        <input type="month" id="filtroMes" class="form-control form-control-sm w-auto" onchange="cargarHistorial()">
                    </div>
                    <div class="table-responsive">
                        <table class="table table-sm" style="font-size: 0.8rem;">
                            <thead><tr><th><input type="checkbox" id="selectAll" onclick="toggleAllChecks()"></th><th>Fecha</th><th>Art.</th><th>Info</th><th class="text-center">Cant.</th><th></th></tr></thead>
                            <tbody id="listaHistorial"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div id="clientes" class="content-section hidden">... (Contenido Clientes) ...</div>
        </div>
    </div>
</div>

<script>
    // --- LÓGICA CORE V12 ---
    const firebaseConfig = {
      apiKey: "AIzaSyCjYp0idCxs32QAofYLVEGcwvmd3HXy-3Y",
      authDomain: "prados-del-sol.firebaseapp.com",
      projectId: "prados-del-sol",
      storageBucket: "prados-del-sol.firebasestorage.app",
      messagingSenderId: "30316921952",
      appId: "1:30316921952:web:b0f88b9c35f270d548ef05"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    let articulos = [], proveedores = [], acuerdos = [], clientes = [], stockActualGlobal = {};

    function login() { auth.signInWithEmailAndPassword(document.getElementById('loginEmail').value, document.getElementById('loginPass').value); }
    function logout() { auth.signOut(); }
    
    auth.onAuthStateChanged(user => {
        if (user) { 
            document.getElementById('loginScreen').classList.add('hidden'); 
            document.getElementById('appSystem').classList.remove('hidden'); 
            const hoy = new Date();
            document.getElementById('filtroMes').value = hoy.getFullYear() + "-" + String(hoy.getMonth()+1).padStart(2, '0');
            iniciarApp(); 
        } else {
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('appSystem').classList.add('hidden');
        }
    });

    async function iniciarApp() {
        db.collection("articulos").orderBy("nombre").onSnapshot(s => {
            articulos = s.docs.map(d => ({id:d.id, ...d.data()}));
            const html = articulos.map(a => `<option value="${a.nombre}">${a.nombre}</option>`).join('');
            document.getElementById('vtaArticulo').innerHTML = '<option value="">-- Prod --</option>' + html;
            document.getElementById('consumoArticulo').innerHTML = '<option value="">-- Uso --</option>' + html;
        });

        db.collection("proveedores").orderBy("nombre").onSnapshot(s => {
            proveedores = s.docs.map(d => ({id:d.id, ...d.data()}));
            document.getElementById('selProveedor').innerHTML = '<option value="">-- Prov --</option>' + proveedores.map(p => `<option value="${p.nombre}">${p.nombre}</option>`).join('');
        });

        db.collection("clientes").orderBy("nombre").onSnapshot(s => {
            clientes = s.docs.map(d => ({id:d.id, ...d.data()}));
            document.getElementById('vtaCliente').innerHTML = '<option value="">-- Cliente --</option>' + clientes.map(c => `<option value="${c.nombre}">${c.nombre}</option>`).join('');
        });

        db.collection("acuerdos").onSnapshot(s => { acuerdos = s.docs.map(d => ({id:d.id, ...d.data()})); });

        db.collection("stock").onSnapshot(s => {
            const res = {}; s.docs.forEach(d => { res[d.data().articulo] = (res[d.data().articulo] || 0) + d.data().cantidad; });
            stockActualGlobal = res;
            document.getElementById('tablaStock').innerHTML = Object.keys(res).map(artNombre => {
                return `<tr><td>${artNombre}</td><td class="text-center fw-bold">${res[artNombre].toLocaleString()}</td><td class="text-end"><i class="fas fa-trash text-muted" onclick="limpiarArt('${artNombre}')"></i></td></tr>`;
            }).join('');
        });
    }

    // --- FUNCIONES NUEVAS INTEGRADAS ---

    async function procesarDespacho() {
        const prod = document.getElementById('vtaArticulo').value;
        const pat = document.getElementById('vtaPatente').value.toUpperCase();
        const cli = document.getElementById('vtaCliente').value;
        const totalU = parseInt(document.getElementById('resTotalAceite').innerText.replace(/\./g,''));
        const totalC = parseInt(document.getElementById('resTotalCajas').innerText.replace(/\./g,''));
        
        if(!prod || totalU <= 0 || !pat) return alert("Faltan datos (Patente o Producto)");

        const batch = db.batch();
        const refVenta = db.collection("stock").doc();
        batch.set(refVenta, { 
            articulo: prod, 
            cantidad: -totalU, 
            tipo: "venta", 
            patente: pat, 
            cliente: cli,
            fecha: firebase.firestore.FieldValue.serverTimestamp() 
        });

        // Descuento automático de cajas (Lógica v12)
        let pN = prod.toLowerCase();
        let caja = pN.includes("900cc") ? "caja de 900cc" : pN.includes("1.5lts") ? "caja 1.5lts" : pN.includes("5lts") ? "caja de 5lts" : "";
        if (caja) batch.set(db.collection("stock").doc(), { articulo: caja, cantidad: -totalC, tipo: "venta", fecha: firebase.firestore.FieldValue.serverTimestamp() });

        await batch.commit();
        alert("Despacho realizado con Patente: " + pat);
        document.getElementById('vtaPatente').value = ""; // Limpiar para el próximo
    }

    async function cargarHistorial() {
        const mesSel = document.getElementById('filtroMes').value;
        const start = new Date(mesSel + "-01T00:00:00");
        const end = new Date(start.getFullYear(), start.getMonth() + 1, 0, 23, 59, 59);
        const snp = await db.collection("stock").where("fecha", ">=", start).where("fecha", "<=", end).orderBy("fecha", "desc").get();
        
        let h = "";
        snp.forEach(doc => {
            const d = doc.data();
            const id = doc.id;
            h += `<tr>
                <td><input type="checkbox" class="chk-item" value="${id}" onclick="toggleBtnLote()"></td>
                <td style="font-size:0.7rem">${d.fecha ? d.fecha.toDate().toLocaleDateString() : 'S/F'}</td>
                <td class="fw-bold">${d.articulo}</td>
                <td class="small">${d.patente || d.tipo || ''}</td>
                <td class="text-center ${d.cantidad<0?'text-danger':'text-success'}">${d.cantidad}</td>
                <td><i class="fas fa-times text-danger" onclick="borrarUno('${id}')"></i></td>
            </tr>`;
        });
        document.getElementById('listaHistorial').innerHTML = h;
    }

    // Funciones de borrado
    async function borrarUno(id) {
        if(confirm("¿Borrar este registro?")) {
            await db.collection("stock").doc(id).delete();
            cargarHistorial();
        }
    }

    async function borrarLote() {
        const ids = Array.from(document.querySelectorAll('.chk-item:checked')).map(cb => cb.value);
        if(confirm(`¿Borrar ${ids.length} registros seleccionados?`)) {
            const batch = db.batch();
            ids.forEach(id => batch.delete(db.collection("stock").doc(id)));
            await batch.commit();
            cargarHistorial();
        }
    }

    function toggleAllChecks() {
        const master = document.getElementById('selectAll').checked;
        document.querySelectorAll('.chk-item').forEach(cb => cb.checked = master);
        toggleBtnLote();
    }

    function toggleBtnLote() {
        const haySeleccion = document.querySelectorAll('.chk-item:checked').length > 0;
        document.getElementById('btnBorrarLote').classList.toggle('hidden', !haySeleccion);
    }

    function showTab(id) {
        document.querySelectorAll('.content-section').forEach(s => s.classList.add('hidden'));
        document.querySelectorAll('.nav-link').forEach(n => n.classList.remove('active'));
        document.getElementById(id).classList.remove('hidden');
        if(id === 'historial') cargarHistorial();
        if(event) event.currentTarget.classList.add('active');
    }

    function filtrarArticulosAcuerdo() {
        const prov = document.getElementById('selProveedor').value;
        const filtrados = acuerdos.filter(a => a.proveedor === prov);
        document.getElementById('selArticulo').innerHTML = '<option value="">-- Art --</option>' + filtrados.map(a => `<option value="${a.articulo}">${a.articulo}</option>`).join('');
    }

    function calcularCarga() {
        const prov = document.getElementById('selProveedor').value;
        const art = document.getElementById('selArticulo').value;
        const cant = parseInt(document.getElementById('inpCantidad').value) || 0;
        const tipo = document.getElementById('selTipoCarga').value;
        const ac = acuerdos.find(x => x.proveedor === prov && x.articulo === art);
        let total = (ac && tipo === 'p') ? cant * ac.cxp * ac.uxc : (ac && tipo === 'c') ? cant * ac.uxc : cant;
        document.getElementById('txtTotalFinal').innerText = total.toLocaleString();
    }

    function actualizarPrevisualizacion() {
        const p = parseInt(document.getElementById('vtaPallets').value) || 0;
        const c = parseInt(document.getElementById('vtaCxP').value) || 0;
        const u = parseInt(document.getElementById('vtaUxC').value) || 0;
        document.getElementById('resTotalAceite').innerText = (p * c * u).toLocaleString();
        document.getElementById('resTotalCajas').innerText = (p * c).toLocaleString();
    }

    async function guardarIngreso() {
        const art = document.getElementById('selArticulo').value;
        const totalU = parseInt(document.getElementById('txtTotalFinal').innerText.replace(/\./g,''));
        if(art && totalU > 0) {
            await db.collection("stock").add({ articulo: art, cantidad: totalU, tipo: "ingreso", fecha: firebase.firestore.FieldValue.serverTimestamp() });
            alert("Stock sumado");
            document.getElementById('inpCantidad').value = "";
        }
    }
</script>
</body>
</html>
