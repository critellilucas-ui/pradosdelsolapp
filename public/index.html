<style>
    :root {
        --prados-green: #1a5c37;
        --prados-yellow: #f9bc15;
        --prados-blue: #2b78d2;
    }

    /* Estilo Historial basado en tu imagen */
    .historial-header {
        border-bottom: 2px solid var(--prados-blue);
        padding-bottom: 10px;
        margin-bottom: 20px;
    }

    .btn-borrar-lote {
        background-color: #efefef;
        border: 1px solid #767676;
        border-radius: 2px;
        padding: 2px 10px;
        font-size: 14px;
        transition: 0.2s;
    }

    .btn-borrar-lote:hover:not(:disabled) {
        background-color: #e5e5e5;
        border-color: #4f4f4f;
    }

    .historial-item {
        border-bottom: 1px solid #eee;
        padding: 12px;
        transition: background 0.2s;
        display: flex;
        align-items: center;
    }

    .historial-item:hover {
        background-color: #fcfcfc;
    }

    .selector-fecha {
        border: 1px solid #767676;
        padding: 2px 5px;
        margin: 10px 0;
    }

    .badge-tipo {
        font-size: 0.7rem;
        padding: 3px 8px;
        border-radius: 10px;
        text-transform: uppercase;
        font-weight: bold;
    }
</style>

<div id="historial" class="content-section hidden">
    <div class="card p-4 shadow-sm">
        <div class="historial-header">
            <h4 class="fw-bold m-0">Historial de Movimientos</h4>
        </div>

        <div class="d-flex flex-wrap align-items-center gap-2 mb-3">
            <button id="btnBorrarSeleccion" class="btn-borrar-lote" onclick="borrarSeleccionados()" disabled>
                Borrar Seleccionados
            </button>
            <input type="month" id="filtroMes" class="selector-fecha" onchange="cargarHistorial()">
            <button class="btn-borrar-lote" onclick="toggleSeleccionTodo()">Todo</button>
        </div>

        <div id="listaHistorial" class="mt-2">
            <p class="text-muted">Cargando movimientos...</p>
        </div>
    </div>
</div>

<script>
    // --- LÓGICA DE GESTIÓN DE HISTORIAL ---

    async function cargarHistorial() {
        const lista = document.getElementById('listaHistorial');
        const mesStr = document.getElementById('filtroMes').value;
        if (!mesStr) return;

        const [anio, mes] = mesStr.split('-').map(Number);
        const inicio = new Date(anio, mes - 1, 1);
        const fin = new Date(anio, mes, 0, 23, 59, 59);

        db.collection("stock")
            .where("fecha", ">=", inicio)
            .where("fecha", "<=", fin)
            .orderBy("fecha", "desc")
            .onSnapshot(snapshot => {
                if (snapshot.empty) {
                    lista.innerHTML = '<p class="text-center p-4">No hay registros para este período.</p>';
                    return;
                }

                let html = "";
                snapshot.forEach(doc => {
                    const d = doc.data();
                    const fecha = d.fecha ? d.fecha.toDate().toLocaleDateString() : '---';
                    const esVenta = d.cantidad < 0;
                    
                    html += `
                        <div class="historial-item" id="row-${doc.id}">
                            <div class="me-3">
                                <input type="checkbox" class="chk-item" value="${doc.id}" 
                                       data-cantidad="${d.cantidad}" data-articulo="${d.articulo}" 
                                       onchange="actualizarEstadoBoton()">
                            </div>
                            <div class="flex-grow-1">
                                <div class="d-flex justify-content-between">
                                    <span class="fw-bold">${d.articulo}</span>
                                    <span class="${esVenta ? 'text-danger' : 'text-success'} fw-bold">
                                        ${d.cantidad.toLocaleString()} u.
                                    </span>
                                </div>
                                <div class="small text-muted">
                                    ${fecha} | ${d.cliente || d.proveedor || 'Mov. Interno'}
                                    ${d.patente ? ` | <b class="text-primary">Patente: ${d.patente}</b>` : ''}
                                </div>
                            </div>
                        </div>
                    `;
                });
                lista.innerHTML = html;
                actualizarEstadoBoton();
            });
    }

    function actualizarEstadoBoton() {
        const seleccionados = document.querySelectorAll('.chk-item:checked').length;
        document.getElementById('btnBorrarSeleccion').disabled = seleccionados === 0;
    }

    function toggleSeleccionTodo() {
        const checkboxes = document.querySelectorAll('.chk-item');
        const algunSinMarcar = Array.from(checkboxes).some(c => !c.checked);
        checkboxes.forEach(c => c.checked = algunSinMarcar);
        actualizarEstadoBoton();
    }

    async function borrarSeleccionados() {
        const checks = document.querySelectorAll('.chk-item:checked');
        if (checks.length === 0) return;

        const confirmar = confirm(`¿Está seguro de borrar los ${checks.length} elementos seleccionados?`);
        if (!confirmar) return;

        const reversar = confirm("¿Desea restaurar el stock automáticamente para estos registros?");
        
        const batch = db.batch();

        checks.forEach(chk => {
            const id = chk.value;
            const cantidad = parseFloat(chk.dataset.cantidad);
            const articulo = chk.dataset.articulo;

            // 1. Borrar registro
            batch.delete(db.collection("stock").doc(id));

            // 2. Reversión opcional
            if (reversar) {
                batch.set(db.collection("stock").doc(), {
                    articulo: articulo,
                    cantidad: -cantidad, // Valor opuesto para anular
                    tipo: "ajuste_reversion",
                    fecha: firebase.firestore.FieldValue.serverTimestamp(),
                    notas: "Reversión por borrado masivo"
                });
            }
        });

        try {
            await batch.commit();
            alert("Operación completada con éxito.");
        } catch (error) {
            console.error(error);
            alert("Error al procesar el borrado masivo.");
        }
    }

    // Inicialización
    document.addEventListener('DOMContentLoaded', () => {
        const hoy = new Date();
        document.getElementById('filtroMes').value = hoy.toISOString().substring(0, 7);
    });
</script>
