<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Prados del Sol - Stock Consolidado</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', sans-serif; }
        .sidebar { min-height: 100vh; background-color: #2c3e50; color: white; padding: 20px; position: sticky; top: 0; }
        .nav-link { color: #bdc3c7; cursor: pointer; padding: 12px; border-radius: 5px; margin-bottom: 5px; display: block; text-decoration: none; }
        .nav-link:hover, .nav-link.active { color: white; background-color: #3498db; }
        .hidden { display: none !important; }
        .card { border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-radius: 12px; }
        .table thead { background-color: #34495e; color: white; }
        .prov-tag { font-size: 0.75rem; background: #e9ecef; border-radius: 4px; padding: 2px 6px; margin-right: 4px; display: inline-block; color: #495057; border: 1px solid #dee2e6; }
    </style>
</head>
<body>

<div id="loginScreen" class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card p-4 shadow-lg" style="width: 380px;">
        <h4 class="text-center mb-4">Prados del Sol</h4>
        <input type="email" id="loginEmail" class="form-control mb-3" placeholder="Correo">
        <input type="password" id="loginPass" class="form-control mb-3" placeholder="Contraseña">
        <button onclick="login()" class="btn btn-primary w-100">Ingresar</button>
    </div>
</div>

<div id="appSystem" class="container-fluid hidden">
    <div class="row">
        <div class="col-md-2 sidebar">
            <h5 class="text-center mb-4 border-bottom pb-3">SISTEMA STOCK</h5>
            <nav>
                <a class="nav-link active" id="btn-stock" onclick="showTab('stock')"><i class="fas fa-boxes me-2"></i> Stock Consolidado</a>
                <a class="nav-link" id="btn-config" onclick="showTab('config')"><i class="fas fa-cogs me-2"></i> Configuración</a>
                <a class="nav-link mt-5 text-danger" onclick="logout()"><i class="fas fa-power-off me-2"></i> Salir</a>
            </nav>
        </div>

        <div class="col-md-10 p-4">
            <div id="stock" class="content-section">
                <div class="d-flex justify-content-between mb-4">
                    <h3>Inventario General</h3>
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalIngreso">
                        <i class="fas fa-plus me-1"></i> Registrar Ingreso
                    </button>
                </div>
                <div class="card shadow-sm p-3">
                    <table class="table align-middle">
                        <thead>
                            <tr>
                                <th>Artículo</th>
                                <th class="text-center">Stock Total</th>
                                <th>Desglose por Proveedor (Últimas Cargas)</th>
                                <th class="text-end">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaStockConsolidado"></tbody>
                    </table>
                </div>
            </div>

            <div id="config" class="content-section hidden">
                <h3 class="mb-4">Panel de Control</h3>
                <div class="row g-4">
                    <div class="col-md-4">
                        <div class="card p-3 border-start border-success border-4">
                            <h5>1. Proveedores</h5>
                            <input type="text" id="confNombreProv" class="form-control mb-2" placeholder="Nombre Proveedor">
                            <label class="small fw-bold">Productos:</label>
                            <select id="confProductosProv" class="form-select mb-2" multiple style="height: 120px;">
                                <option value="Botella 850cc">Botella 850cc</option>
                                <option value="Botella 900cc">Botella 900cc</option>
                                <option value="Botella 4lts">Botella 4lts</option>
                                <option value="Tapa 29fl">Tapa 29fl</option>
                                <option value="Tapa 48fl">Tapa 48fl</option>
                                <option value="Cajas">Cajas</option>
                            </select>
                            <button class="btn btn-success w-100 mb-3" onclick="guardarProveedorCloud()">Agregar Proveedor</button>
                            <div id="listaProveedores" class="list-group overflow-auto" style="max-height: 150px;"></div>
                        </div>
                    </div>

                    <div class="col-md-8">
                        <div class="card p-3 border-start border-primary border-4">
                            <h5>2. Configurar Unidades por Proveedor</h5>
                            <div class="row g-2 mb-3">
                                <div class="col-md-4">
                                    <label class="small fw-bold">Proveedor</label>
                                    <select id="confSelProv" class="form-select" onchange="filtrarArticulosConfig()"></select>
                                </div>
                                <div class="col-md-4">
                                    <label class="small fw-bold">Artículo</label>
                                    <select id="confSelArt" class="form-select"></select>
                                </div>
                                <div class="col-md-2">
                                    <label class="small fw-bold">u/Caja</label>
                                    <input type="number" id="confUxC" class="form-control" value="1">
                                </div>
                                <div class="col-md-2">
                                    <label class="small fw-bold">Cajas/P</label>
                                    <input type="number" id="confCxP" class="form-control" value="1">
                                </div>
                            </div>
                            <button class="btn btn-primary w-100" onclick="guardarAcuerdoEmpaque()">Guardar Configuración</button>
                            <hr>
                            <div id="listaAcuerdos" class="row"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="modalIngreso" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title">Entrada de Stock</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <label class="fw-bold">Proveedor</label>
                <select id="selProveedor" class="form-select mb-3" onchange="actualizarFiltroArticulos();"></select>

                <label class="fw-bold">Artículo</label>
                <select id="selArticulo" class="form-select mb-3" onchange="calcularIngreso();"></select>

                <div class="row mb-3">
                    <div class="col-6">
                        <label class="fw-bold">Cantidad</label>
                        <input type="number" id="inpCantidad" class="form-control" value="0" oninput="calcularIngreso()">
                    </div>
                    <div class="col-6">
                        <label class="fw-bold">Formato</label>
                        <select id="selTipoCarga" class="form-select" onchange="calcularIngreso()">
                            <option value="u">Unidades</option>
                            <option value="c">Cajas</option>
                            <option value="p">Pallets</option>
                        </select>
                    </div>
                </div>
                <div class="bg-light p-3 rounded text-center border">
                    <span id="txtTotalFinal" class="fs-2 fw-bold text-primary">0</span> <span class="text-primary fw-bold">unidades</span>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-success w-100 btn-lg" onclick="guardarIngresoCloud()">CONFIRMAR INGRESO</button>
            </div>
        </div>
    </div>
</div>

<script>
    // --- CONFIG FIREBASE ---
    const firebaseConfig = {
      apiKey: "AIzaSyCjYp0idCxs32QAofYLVEGcwvmd3HXy-3Y",
      authDomain: "prados-del-sol.firebaseapp.com",
      projectId: "prados-del-sol",
      storageBucket: "prados-del-sol.firebasestorage.app",
      messagingSenderId: "30316921952",
      appId: "1:30316921952:web:b0f88b9c35f270d548ef05"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    const ARTICULOS_MAESTROS = ["Botella 850cc", "Botella 900cc", "Botella 4lts", "Tapa 29fl", "Tapa 48fl", "Cajas"];
    let acuerdosLocal = [];
    let provsLocal = [];

    // --- AUTH ---
    function login() { auth.signInWithEmailAndPassword(document.getElementById('loginEmail').value, document.getElementById('loginPass').value); }
    function logout() { auth.signOut(); }

    auth.onAuthStateChanged(user => {
        if (user) {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('appSystem').classList.remove('hidden');
            inicializarListeners();
        } else {
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('appSystem').classList.add('hidden');
        }
    });

    function inicializarListeners() {
        // Escuchar Proveedores
        db.collection("proveedores").onSnapshot(snap => {
            provsLocal = snap.docs.map(d => ({id: d.id, ...d.data()}));
            renderizarListaProvs();
            const html = `<option value="">-- Seleccionar --</option>` + provsLocal.map(p => `<option value="${p.nombre}">${p.nombre}</option>`).join('');
            document.getElementById('confSelProv').innerHTML = html;
            document.getElementById('selProveedor').innerHTML = html;
        });

        // Escuchar Acuerdos
        db.collection("acuerdos_empaque").onSnapshot(snap => {
            acuerdosLocal = snap.docs.map(d => ({id: d.id, ...d.data()}));
            renderizarAcuerdos();
        });

        // Escuchar Stock y CONSOLIDAR
        db.collection("stock").onSnapshot(snap => {
            const todosLosMovimientos = snap.docs.map(d => ({id: d.id, ...d.data()}));
            renderizarConsolidado(todosLosMovimientos);
        });
    }

    // --- LÓGICA DE CONSOLIDACIÓN ---
    function renderizarConsolidado(movimientos) {
        const consolidado = {};

        // Agrupar por artículo
        movimientos.forEach(m => {
            if (!consolidado[m.articulo]) {
                consolidado[m.articulo] = { total: 0, proveedores: {}, ids: [] };
            }
            consolidado[m.articulo].total += m.cantidad;
            consolidado[m.articulo].ids.push(m.id);
            
            // Sumar por cada proveedor individualmente para la descripción
            if (!consolidado[m.articulo].proveedores[m.proveedor]) {
                consolidado[m.articulo].proveedores[m.proveedor] = 0;
            }
            consolidado[m.articulo].proveedores[m.proveedor] += m.cantidad;
        });

        let html = "";
        ARTICULOS_MAESTROS.forEach(art => {
            const data = consolidado[art] || { total: 0, proveedores: {}, ids: [] };
            
            // Crear etiquetas de descripción
            let descProvs = "";
            for (const [prov, cant] of Object.entries(data.proveedores)) {
                descProvs += `<span class="prov-tag"><b>${prov}:</b> ${cant.toLocaleString()} u.</span>`;
            }

            html += `
                <tr>
                    <td class="fw-bold text-secondary">${art}</td>
                    <td class="text-center fs-5 fw-bold text-primary">${data.total.toLocaleString()}</td>
                    <td>${descProvs || '<span class="text-muted small">Sin stock</span>'}</td>
                    <td class="text-end">
                        <button class="btn btn-sm btn-outline-danger" title="Limpiar Stock de este artículo" 
                                onclick="borrarStockArticulo('${art}', ${JSON.stringify(data.ids)})">
                            <i class="fas fa-undo"></i>
                        </button>
                    </td>
                </tr>
            `;
        });
        document.getElementById('tablaStockConsolidado').innerHTML = html;
    }

    async function borrarStockArticulo(nombre, ids) {
        if(confirm(`¿Deseas resetear el stock de ${nombre}? Se borrarán todos los registros asociados.`)) {
            for (const id of ids) {
                await db.collection("stock").doc(id).delete();
            }
        }
    }

    // --- FUNCIONES SOPORTE (Idénticas pero estables) ---
    function actualizarFiltroArticulos() {
        const prov = provsLocal.find(p => p.nombre === document.getElementById('selProveedor').value);
        document.getElementById('selArticulo').innerHTML = prov ? prov.productos.map(a => `<option value="${a}">${a}</option>`).join('') : '';
        calcularIngreso();
    }

    function filtrarArticulosConfig() {
        const prov = provsLocal.find(p => p.nombre === document.getElementById('confSelProv').value);
        document.getElementById('confSelArt').innerHTML = prov ? prov.productos.map(a => `<option value="${a}">${a}</option>`).join('') : '';
    }

    function calcularIngreso() {
        const art = document.getElementById('selArticulo').value;
        const prov = document.getElementById('selProveedor').value;
        const cant = parseFloat(document.getElementById('inpCantidad').value) || 0;
        const tipo = document.getElementById('selTipoCarga').value;
        const acuerdo = acuerdosLocal.find(a => a.proveedor === prov && a.articulo === art) || {uxc:1, cxp:1};
        let total = (tipo === 'u') ? cant : (tipo === 'c') ? cant * acuerdo.uxc : cant * (acuerdo.uxc * acuerdo.cxp);
        document.getElementById('txtTotalFinal').innerText = Math.round(total).toLocaleString();
    }

    function guardarIngresoCloud() {
        const art = document.getElementById('selArticulo').value;
        const prov = document.getElementById('selProveedor').value;
        const total = parseInt(document.getElementById('txtTotalFinal').innerText.replace(/\./g, ''));
        if(!art || !prov || total <= 0) return alert("Carga incompleta");
        db.collection("stock").add({ articulo: art, proveedor: prov, cantidad: total, fecha: firebase.firestore.FieldValue.serverTimestamp() })
            .then(() => { bootstrap.Modal.getInstance(document.getElementById('modalIngreso')).hide(); document.getElementById('inpCantidad').value = 0; });
    }

    function guardarProveedorCloud() {
        const nombre = document.getElementById('confNombreProv').value.trim();
        const prods = Array.from(document.getElementById('confProductosProv').selectedOptions).map(o => o.value);
        if(!nombre || prods.length === 0) return alert("Faltan datos");
        db.collection("proveedores").add({ nombre, productos: prods }).then(() => document.getElementById('confNombreProv').value = '');
    }

    function guardarAcuerdoEmpaque() {
        const prov = document.getElementById('confSelProv').value;
        const art = document.getElementById('confSelArt').value;
        const uxc = parseInt(document.getElementById('confUxC').value) || 1;
        const cxp = parseInt(document.getElementById('confCxP').value) || 1;
        if(!prov || !art) return alert("Seleccione datos");
        db.collection("acuerdos_empaque").doc(`${prov}_${art}`.replace(/\s+/g, '')).set({ proveedor: prov, articulo: art, uxc, cxp });
    }

    function renderizarListaProvs() {
        document.getElementById('listaProveedores').innerHTML = provsLocal.map(p => `<div class="list-group-item d-flex justify-content-between p-1 small"><span>${p.nombre}</span><button class="btn btn-sm text-danger" onclick="db.collection('proveedores').doc('${p.id}').delete()">×</button></div>`).join('');
    }

    function renderizarAcuerdos() {
        document.getElementById('listaAcuerdos').innerHTML = acuerdosLocal.map(a => `
            <div class="col-md-6 mb-2">
                <div class="card p-2 bg-light border-0 shadow-sm">
                    <div class="d-flex justify-content-between">
                        <small class="fw-bold">${a.proveedor} > ${a.articulo}</small>
                        <button class="btn btn-sm text-danger" onclick="db.collection('acuerdos_empaque').doc('${a.id}').delete()">×</button>
                    </div>
                    <div class="small">Caja: ${a.uxc}u. | Pallet: ${a.cxp} cj. (${a.uxc*a.cxp}u)</div>
                </div>
            </div>`).join('');
    }

    function showTab(id) {
        document.querySelectorAll('.content-section').forEach(s => s.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
        document.getElementById('btn-'+id).classList.add('active');
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
