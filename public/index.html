<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistema Prados del Sol - Oficial</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body { background-color: #f0f2f5; font-family: 'Segoe UI', sans-serif; }
        .sidebar { background-color: #212529; color: white; padding: 15px; min-height: 100vh; }
        @media (max-width: 767px) { .sidebar { min-height: auto; } .nav-custom { display: flex; overflow-x: auto; gap: 5px; } }
        .nav-link { color: #adb5bd; cursor: pointer; padding: 12px; border-radius: 8px; text-decoration: none; display: block; }
        .nav-link.active, .nav-link:hover { color: white; background-color: #0d6efd; }
        .hidden { display: none !important; }
        .card { border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border-radius: 12px; margin-bottom: 15px; }
        .stock-peligro { background-color: #fff5f5 !important; color: #dc3545 !important; border-left: 5px solid #dc3545 !important; }
        label { font-size: 0.8rem; font-weight: bold; }
    </style>
</head>
<body>

<div id="loginScreen" class="container d-flex justify-content-center align-items-center vh-100 p-3">
    <div class="card p-4 shadow-lg w-100" style="max-width: 400px;">
        <h4 class="text-center mb-4 text-primary fw-bold">PRADOS DEL SOL</h4>
        <input type="email" id="loginEmail" class="form-control mb-3" placeholder="Correo">
        <input type="password" id="loginPass" class="form-control mb-3" placeholder="Contraseña">
        <button onclick="login()" class="btn btn-primary w-100">INGRESAR</button>
    </div>
</div>

<div id="appSystem" class="container-fluid hidden">
    <div class="row">
        <div class="col-md-2 sidebar">
            <h5 class="text-center mb-4 border-bottom pb-2 text-info">LOGÍSTICA</h5>
            <nav class="nav-custom">
                <a class="nav-link active" onclick="showTab('stock')"><i class="fas fa-boxes me-1"></i> Stock</a>
                <a class="nav-link" onclick="showTab('ventas')"><i class="fas fa-truck me-1"></i> Ventas</a>
                <a class="nav-link" onclick="showTab('historial')"><i class="fas fa-history me-1"></i> Historial</a>
                <a class="nav-link" onclick="showTab('clientes')"><i class="fas fa-users me-1"></i> Clientes</a>
                <a class="nav-link" onclick="showTab('config')"><i class="fas fa-cog me-1"></i> Config</a>
                <a class="nav-link text-danger" onclick="logout()"><i class="fas fa-power-off"></i></a>
            </nav>
        </div>

        <div class="col-md-10 p-4">
            <div id="stock" class="content-section">
                <div class="row">
                    <div class="col-lg-8">
                        <div class="card p-3 border-top border-success border-4 shadow-sm">
                            <h5 class="mb-3 text-success fw-bold">Carga por Proveedor</h5>
                            <div class="row g-2">
                                <div class="col-6 col-md-4"><label>Proveedor</label><select id="selProveedor" class="form-select" onchange="filtrarArticulosAcuerdo()"></select></div>
                                <div class="col-6 col-md-4"><label>Artículo</label><select id="selArticulo" class="form-select" onchange="calcularCarga()"></select></div>
                                <div class="col-6 col-md-2"><label>Tipo</label><select id="selTipoCarga" class="form-select" onchange="calcularCarga()"><option value="p">Pallets</option><option value="c">Cajas</option><option value="u">Unidades</option></select></div>
                                <div class="col-6 col-md-2"><label>Cantidad</label><input type="number" id="inpCantidad" class="form-control" oninput="calcularCarga()"></div>
                            </div>
                            <div class="mt-3 d-flex justify-content-between align-items-center bg-light p-2 rounded">
                                <span class="small fw-bold">Total: <span id="txtTotalFinal" class="text-success fs-5">0</span> u.</span>
                                <button class="btn btn-success btn-sm" onclick="guardarIngreso()">CONFIRMAR CARGA</button>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-4">
                        <div class="card p-3 border-top border-warning border-4 shadow-sm">
                            <h5 class="text-warning fw-bold">Consumo Directo</h5>
                            <select id="consumoArticulo" class="form-select mb-2"></select>
                            <div class="input-group">
                                <input type="number" id="consumoCantidad" class="form-control" placeholder="Cant.">
                                <button class="btn btn-warning text-white" onclick="registrarConsumo()">RESTAR</button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="card p-2 shadow-sm">
                    <h6 class="p-2 fw-bold">Inventario Actual</h6>
                    <div class="table-responsive"><table class="table table-sm align-middle mb-0"><thead class="table-dark"><tr><th>Artículo</th><th class="text-center">Stock</th><th class="text-center">Mín.</th><th class="text-end"></th></tr></thead><tbody id="tablaStock"></tbody></table></div>
                </div>
            </div>

            <div id="ventas" class="content-section hidden">
                <div class="card p-3 border-top border-primary border-4 shadow-sm">
                    <h5 class="text-primary fw-bold mb-3">Nuevo Despacho</h5>
                    <div class="row g-2">
                        <div class="col-12 col-md-6"><label>Cliente</label><select id="vtaCliente" class="form-select"></select></div>
                        <div class="col-12 col-md-6"><label>Producto</label><select id="vtaArticulo" class="form-select" onchange="actualizarPrevisualizacion()"></select></div>
                        <div class="col-4"><label>Pallets</label><input type="number" id="vtaPallets" class="form-control" value="28" oninput="actualizarPrevisualizacion()"></div>
                        <div class="col-4"><label>CxP</label><input type="number" id="vtaCxP" class="form-control" value="75" oninput="actualizarPrevisualizacion()"></div>
                        <div class="col-4"><label>UxC</label><input type="number" id="vtaUxC" class="form-control" value="12" oninput="actualizarPrevisualizacion()"></div>
                    </div>
                    
                    <h6 class="mt-4 border-bottom pb-1 small text-muted">LOGÍSTICA / TRANSPORTE</h6>
                    <div class="row g-2">
                        <div class="col-md-3"><label>Chofer</label><input type="text" id="vtaChofer" class="form-control" placeholder="Nombre"></div>
                        <div class="col-md-3"><label>DNI</label><input type="text" id="vtaDni" class="form-control" placeholder="DNI"></div>
                        <div class="col-md-3"><label>Camión</label><input type="text" id="vtaCamion" class="form-control" placeholder="Patente"></div>
                        <div class="col-md-3"><label>Semi</label><input type="text" id="vtaSemi" class="form-control" placeholder="Patente"></div>
                    </div>

                    <div class="mt-3 p-2 bg-light text-center border">Cajas: <b id="resTotalCajas">0</b> | Unidades: <b id="resTotalAceite">0</b></div>
                    <button class="btn btn-primary w-100 mt-3 fw-bold" onclick="procesarDespacho()">GENERAR DESPACHO Y PDF</button>
                </div>
            </div>

            <div id="historial" class="content-section hidden">
                <div class="card p-3 border-top border-info border-4">
                    <div class="d-flex justify-content-between mb-3 align-items-center">
                        <h5 class="fw-bold m-0">Historial de Movimientos</h5>
                        <div class="d-flex gap-2">
                            <input type="month" id="filtroMes" class="form-control" onchange="cargarHistorial()">
                            <button class="btn btn-danger btn-sm" onclick="resetTotalMovimientos()">RESET MODO PRUEBA</button>
                        </div>
                    </div>
                    <div class="table-responsive"><table class="table table-sm"><tbody id="listaHistorial"></tbody></table></div>
                </div>
            </div>

            <div id="clientes" class="content-section hidden">
                <div class="card p-3">
                    <h5 class="fw-bold">Directorio de Clientes</h5>
                    <div class="row g-2 mb-3">
                        <div class="col-md-6"><input type="text" id="cliNombre" class="form-control" placeholder="Razón Social"></div>
                        <div class="col-md-3"><input type="text" id="cliCuit" class="form-control" placeholder="CUIT"></div>
                        <div class="col-md-3"><select id="cliIva" class="form-select"><option>Responsable Inscripto</option><option>Monotributo</option></select></div>
                        <div class="col-12"><input type="text" id="cliDir" class="form-control" placeholder="Dirección Completa"></div>
                        <button class="btn btn-dark w-100" onclick="guardarCliente()">REGISTRAR CLIENTE</button>
                    </div>
                    <div class="table-responsive"><table class="table table-sm"><tbody id="tablaClientes"></tbody></table></div>
                </div>
            </div>

            <div id="config" class="content-section hidden">
                <div class="row">
                    <div class="col-md-6"><div class="card p-3"><h6>Maestro de Artículos</h6><div class="input-group mb-2"><input type="text" id="confNuevoArt" class="form-control" placeholder="Nombre"><input type="number" id="confMinArt" class="form-control" placeholder="Mín"><button class="btn btn-primary" onclick="guardarArt()">+</button></div><div id="listaArts"></div></div></div>
                    <div class="col-md-6"><div class="card p-3"><h6>Vínculos de Carga</h6><div class="row g-1"><div class="col-6"><select id="acProv" class="form-select"></select></div><div class="col-6"><select id="acArt" class="form-select"></select></div><div class="col-6"><input type="number" id="acUxC" class="form-control" placeholder="U/C"></div><div class="col-6"><input type="number" id="acCxP" class="form-control" placeholder="C/P"></div><button class="btn btn-warning w-100" onclick="guardarAcuerdo()">VINCULAR</button></div><div id="listaAcuerdos" class="mt-2 small"></div></div></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyCjYp0idCxs32QAofYLVEGcwvmd3HXy-3Y", authDomain: "prados-del-sol.firebaseapp.com", projectId: "prados-del-sol", storageBucket: "prados-del-sol.firebasestorage.app", messagingSenderId: "30316921952", appId: "1:30316921952:web:b0f88b9c35f270d548ef05" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();
    let articulos = [], proveedores = [], acuerdos = [], clientes = [];

    function login() { auth.signInWithEmailAndPassword(document.getElementById('loginEmail').value, document.getElementById('loginPass').value); }
    function logout() { auth.signOut(); }
    auth.onAuthStateChanged(user => { if (user) { document.getElementById('loginScreen').classList.add('hidden'); document.getElementById('appSystem').classList.remove('hidden'); iniciarApp(); } else { document.getElementById('loginScreen').classList.remove('hidden'); document.getElementById('appSystem').classList.add('hidden'); } });

    async function iniciarApp() {
        const hoy = new Date(); document.getElementById('filtroMes').value = hoy.getFullYear() + "-" + String(hoy.getMonth()+1).padStart(2, '0');
        db.collection("articulos").orderBy("nombre").onSnapshot(s => {
            articulos = s.docs.map(d => ({id:d.id, ...d.data()}));
            const html = articulos.map(a => `<option value="${a.nombre}">${a.nombre}</option>`).join('');
            document.getElementById('acArt').innerHTML = html; document.getElementById('vtaArticulo').innerHTML = '<option value="">-- Seleccionar --</option>' + html; document.getElementById('consumoArticulo').innerHTML = html; renderMaestro();
        });
        db.collection("proveedores").orderBy("nombre").onSnapshot(s => {
            proveedores = s.docs.map(d => ({id:d.id, ...d.data()}));
            document.getElementById('selProveedor').innerHTML = '<option value="">-- Proveedor --</option>' + proveedores.map(p => `<option value="${p.nombre}">${p.nombre}</option>`).join('');
            document.getElementById('acProv').innerHTML = proveedores.map(p => `<option value="${p.nombre}">${p.nombre}</option>`).join('');
        });
        db.collection("acuerdos").onSnapshot(s => { acuerdos = s.docs.map(d => ({id:d.id, ...d.data()})); renderAcuerdos(); });
        db.collection("clientes").orderBy("nombre").onSnapshot(s => {
            clientes = s.docs.map(d => ({id:d.id, ...d.data()}));
            document.getElementById('vtaCliente').innerHTML = '<option value="">-- Cliente --</option>' + clientes.map(c => `<option value="${c.nombre}">${c.nombre}</option>`).join('');
            renderClientes();
        });
        db.collection("stock").onSnapshot(s => {
            const res = {}; s.docs.forEach(d => { res[d.data().articulo] = (res[d.data().articulo] || 0) + d.data().cantidad; });
            document.getElementById('tablaStock').innerHTML = Object.keys(res).map(k => {
                const art = articulos.find(a => a.nombre === k);
                const min = art ? art.minimo : 0;
                return `<tr class="${res[k] <= min ? 'stock-peligro' : ''}"><td>${k}</td><td class="text-center fw-bold">${res[k].toLocaleString()}</td><td class="text-center">${min}</td><td class="text-end"><i class="fas fa-trash text-muted" onclick="limpiarArt('${k}')"></i></td></tr>`;
            }).join('');
        });
    }

    function filtrarArticulosAcuerdo() { const prov = document.getElementById('selProveedor').value; const filtrados = acuerdos.filter(a => a.proveedor === prov); document.getElementById('selArticulo').innerHTML = '<option value="">-- Seleccionar --</option>' + filtrados.map(a => `<option value="${a.articulo}">${a.articulo}</option>`).join(''); }
    function calcularCarga() { const prov = document.getElementById('selProveedor').value; const art = document.getElementById('selArticulo').value; const cant = parseInt(document.getElementById('inpCantidad').value) || 0; const tipo = document.getElementById('selTipoCarga').value; const ac = acuerdos.find(x => x.proveedor === prov && x.articulo === art); let total = (ac && tipo === 'p') ? cant * ac.cxp * ac.uxc : (ac && tipo === 'c') ? cant * ac.uxc : cant; document.getElementById('txtTotalFinal').innerText = total.toLocaleString(); }
    async function guardarIngreso() { const art = document.getElementById('selArticulo').value; const totalU = parseInt(document.getElementById('txtTotalFinal').innerText.replace(/\./g,'')); if(art && totalU > 0) { await db.collection("stock").add({ articulo: art, cantidad: totalU, tipo: "Ingreso", fecha: firebase.firestore.FieldValue.serverTimestamp() }); alert("Stock actualizado"); document.getElementById('inpCantidad').value = ""; } }

    function actualizarPrevisualizacion() {
        const p = parseInt(document.getElementById('vtaPallets').value) || 0;
        const c = parseInt(document.getElementById('vtaCxP').value) || 0;
        const u = parseInt(document.getElementById('vtaUxC').value) || 0;
        document.getElementById('resTotalCajas').innerText = (p * c).toLocaleString();
        document.getElementById('resTotalAceite').innerText = (p * c * u).toLocaleString();
    }

    async function procesarDespacho() {
        const cli = document.getElementById('vtaCliente').value;
        const prod = document.getElementById('vtaArticulo').value;
        const totalU = parseInt(document.getElementById('resTotalAceite').innerText.replace(/\./g,''));
        const totalC = parseInt(document.getElementById('resTotalCajas').innerText.replace(/\./g,''));
        if(!cli || !prod || totalU <= 0) return alert("Faltan datos");

        const batch = db.batch();
        batch.set(db.collection("stock").doc(), { articulo: prod, cantidad: -totalU, tipo: "Venta", fecha: firebase.firestore.FieldValue.serverTimestamp() });
        
        let pN = prod.toLowerCase();
        let cja = "", eti = "";
        if (pN.includes("850cc") || pN.includes("900cc")) { cja = "caja de 900cc"; eti = "etiqueta de 900cc"; }
        else if (pN.includes("1.5lts")) { cja = "caja de 1.5lts"; eti = "etiqueta de 1.5lts"; }
        else if (pN.includes("5lts")) { cja = "caja de 5lts"; eti = "etiqueta de 5lts"; }

        if(cja) batch.set(db.collection("stock").doc(), { articulo: cja, cantidad: -totalC, tipo: "Insumo (Caja)", fecha: firebase.firestore.FieldValue.serverTimestamp() });
        if(eti) batch.set(db.collection("stock").doc(), { articulo: eti, cantidad: -totalU, tipo: "Insumo (Etiqueta)", fecha: firebase.firestore.FieldValue.serverTimestamp() });

        await batch.commit();
        generarPDFOficial({ cliente: cli, producto: prod, pallets: document.getElementById('vtaPallets').value, cajas: totalC, chofer: document.getElementById('vtaChofer').value, dni: document.getElementById('vtaDni').value, camion: document.getElementById('vtaCamion').value, semi: document.getElementById('vtaSemi').value });
        alert("Despacho Procesado.");
    }

    // --- FUNCIÓN DE PDF REDISEÑADA ESTÉTICAMENTE ---
    function generarPDFOficial(v) {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        const cliData = clientes.find(c => c.nombre === v.cliente) || {};
        const f = new Date();
        const fechaStr = `${String(f.getDate()).padStart(2,'0')}/${String(f.getMonth()+1).padStart(2,'0')}/${f.getFullYear()}`;

        // Estilos de línea
        doc.setDrawColor(0);
        doc.setLineWidth(0.3);

        // 1. CABECERA IZQUIERDA
        doc.setFontSize(22);
        doc.setFont("helvetica", "bold");
        doc.text("MAXIMILIANO MEZA", 12, 18);
        
        doc.setFontSize(9);
        doc.text("VENTA AL POR MAYOR DE GRASA Y ACEITE", 12, 24);
        
        doc.setFontSize(8);
        doc.setFont("helvetica", "normal");
        doc.text("RUTA 24 Nº 1233", 12, 31);
        doc.text("1746 FRANCISCO ALVAREZ - PROV. DE BUENOS AIRES", 12, 35);
        doc.text("IVA RESPONSABLE INSCRIPTO", 12, 42);

        // 2. LOGO CENTRAL "R" (Cuadrado con letra)
        doc.setLineWidth(0.5);
        doc.rect(94, 10, 16, 16); 
        doc.setFontSize(26);
        doc.setFont("helvetica", "bold");
        doc.text("R", 98, 21);
        doc.setFontSize(7);
        doc.text("COD. 91", 97, 24);

        // 3. CABECERA DERECHA (Remito y Fecha)
        doc.setFontSize(14);
        doc.text("REMITO", 155, 16);
        doc.setFontSize(11);
        doc.text(`Nº 0001-00000${Math.floor(Math.random() * 900 + 100)}`, 148, 23);
        
        // Recuadro de Fecha
        doc.rect(145, 27, 48, 8); 
        doc.setFontSize(10);
        doc.text(`FECHA:  ${fechaStr}`, 148, 32.5);

        doc.setFontSize(7);
        doc.text("C.U.I.T.: 20-32546093-9", 145, 42);
        doc.text("Ing. Brutos (C.M.): 20-32546093-9", 145, 46);
        doc.text("Inicio de Actividades: 12/2023", 145, 50);

        // 4. DATOS DEL CLIENTE
        doc.setLineWidth(0.3);
        doc.line(10, 55, 200, 55); 
        
        doc.setFontSize(10);
        doc.setFont("helvetica", "bold");
        doc.text(`Sr.(es):`, 12, 63);
        doc.setFont("helvetica", "normal");
        doc.text(v.cliente.toUpperCase(), 30, 63);
        
        doc.text(`Domicilio:`, 12, 71);
        doc.text("..............................................................................................................................................", 30, 71);
        
        doc.text(`Localidad:`, 12, 79);
        doc.text(cliData.dir ? cliData.dir.toUpperCase() : "..............................................................................................................................................", 30, 79);
        
        doc.text(`I.V.A.:`, 12, 87);
        doc.text(cliData.iva || "RESPONSABLE INSCRIPTO", 30, 87);
        doc.text(`C.U.I.T.:`, 110, 87);
        doc.text(cliData.cuit || "..................................................", 130, 87);
        
        doc.line(10, 93, 200, 93); 

        // 5. TABLA DE CONTENIDO (Estética limpia)
        doc.autoTable({
            startY: 96,
            head: [['CANT.', 'DESCRIPCIÓN']],
            body: [
                [
                    { content: `${v.pallets}`, styles: { halign: 'center', fontStyle: 'bold', fontSize: 12 } },
                    { content: `PALLETS ACEITE x ${v.producto.toUpperCase()}\nTOTAL CAJAS: ${v.cajas}\n\nTRANSPORTE:\nCHOFER: ${v.chofer.toUpperCase()}\nDNI: ${v.dni}\nPATENTE: ${v.camion.toUpperCase()} / ${v.semi.toUpperCase()}`, styles: { cellPadding: 8 } }
                ]
            ],
            theme: 'grid',
            headStyles: { fillColor: [240, 240, 240], textColor: 0, fontStyle: 'bold', halign: 'center', lineWidth: 0.3 },
            styles: { fontSize: 10, lineColor: 0, lineWidth: 0.3, minCellHeight: 90 },
            columnStyles: { 0: { cellWidth: 25 } }
        });

        // 6. PIE DE PÁGINA (Firmas)
        const finalY = doc.lastAutoTable.finalY + 20;
        doc.line(20, finalY + 15, 80, finalY + 15);
        doc.setFontSize(9);
        doc.text("Recibí Conforme", 35, finalY + 20);
        
        doc.line(120, finalY + 15, 180, finalY + 15);
        doc.text("Aclaración", 142, finalY + 20);

        // 7. PIE LEGAL (Recuadro inferior)
        doc.setFontSize(7);
        doc.rect(10, 275, 190, 15);
        doc.text("CAI: 51299213898174  -  Vto: 16/07/2026", 135, 281);
        doc.text("ORIGINAL: Blanco  -  DUPLICADO: Color", 15, 281);
        doc.setFont("helvetica", "italic");
        doc.text("Prados del Sol - Sistema de Gestión Logística v2.0", 15, 286);

        doc.save(`Remito_${v.cliente}_${fechaStr.replace(/\//g,'-')}.pdf`);
    }

    // Funciones de soporte (Sin cambios)
    async function cargarHistorial() {
        const mesSel = document.getElementById('filtroMes').value;
        const start = new Date(mesSel + "-01T00:00:00"); const end = new Date(start.getFullYear(), start.getMonth() + 1, 0, 23, 59, 59);
        const snp = await db.collection("stock").where("fecha", ">=", start).where("fecha", "<=", end).orderBy("fecha", "desc").get();
        document.getElementById('listaHistorial').innerHTML = snp.docs.map(doc => {
            const d = doc.data(); return `<tr><td>${d.fecha ? d.fecha.toDate().toLocaleDateString() : 'S/F'}</td><td class="fw-bold">${d.articulo}</td><td>${d.tipo}</td><td class="${d.cantidad<0?'text-danger':'text-success'}">${d.cantidad}</td></tr>`;
        }).join('');
    }

    async function resetTotalMovimientos() { if(confirm("¿BORRAR HISTORIAL?")) { const snp = await db.collection("stock").get(); const b = db.batch(); snp.forEach(d => b.delete(d.ref)); await b.commit(); cargarHistorial(); } }
    function showTab(id) { document.querySelectorAll('.content-section').forEach(s => s.classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); document.querySelectorAll('.nav-link').forEach(n => n.classList.remove('active')); if(id === 'historial') cargarHistorial(); }
    function guardarArt() { const n = document.getElementById('confNuevoArt').value.toLowerCase(); const m = parseInt(document.getElementById('confMinArt').value) || 0; if(n) db.collection("articulos").add({nombre: n, minimo: m}); }
    function renderMaestro() { document.getElementById('listaArts').innerHTML = articulos.map(a => `<div class="list-group-item d-flex justify-content-between p-1 small">${a.nombre} <i class="fas fa-trash text-danger" onclick="db.collection('articulos').doc('${a.id}').delete()"></i></div>`).join(''); }
    function guardarAcuerdo() { db.collection("acuerdos").add({proveedor: document.getElementById('acProv').value, articulo: document.getElementById('acArt').value, uxc: parseInt(document.getElementById('acUxC').value), cxp: parseInt(document.getElementById('acCxP').value)}); }
    function renderAcuerdos() { document.getElementById('listaAcuerdos').innerHTML = acuerdos.map(ac => `<div class="border-bottom py-1 small">${ac.proveedor} ➔ ${ac.articulo} <i class="fas fa-times text-danger" onclick="db.collection('acuerdos').doc('${ac.id}').delete()"></i></div>`).join(''); }
    function guardarCliente() { db.collection("clientes").add({ nombre: document.getElementById('cliNombre').value, cuit: document.getElementById('cliCuit').value, iva: document.getElementById('cliIva').value, dir: document.getElementById('cliDir').value }); alert("Cliente Guardado"); }
    function renderClientes() { document.getElementById('tablaClientes').innerHTML = clientes.map(c => `<tr><td class="small"><b>${c.nombre}</b></td><td class="text-end"><i class="fas fa-trash text-danger" onclick="db.collection('clientes').doc('${c.id}').delete()"></i></td></tr>`).join(''); }
    async function registrarConsumo() { const art = document.getElementById('consumoArticulo').value; const cant = parseInt(document.getElementById('consumoCantidad').value) || 0; if(art && cant > 0) await db.collection("stock").add({ articulo: art, cantidad: -cant, tipo: "Consumo", fecha: firebase.firestore.FieldValue.serverTimestamp() }); }
    async function limpiarArt(n) { if(confirm("¿Vaciar stock?")) { const snp = await db.collection("stock").where("articulo","==",n).get(); const b = db.batch(); snp.forEach(d => b.delete(d.ref)); await b.commit(); } }
</script>
</body>
</html>
