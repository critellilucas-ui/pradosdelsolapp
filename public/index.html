<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Prados del Sol - Gestión v13</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body { background-color: #f0f2f5; font-family: 'Segoe UI', sans-serif; overflow-x: hidden; }
        
        /* --- ESTILO PORTADA --- */
        #loginScreen {
            background: url('https://r.jina.ai/i/05e24f469399436181b51e44f8f9467d') no-repeat center center fixed;
            background-size: cover; height: 100vh; display: flex; align-items: center; justify-content: center;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.95); border-radius: 25px; padding: 40px 30px;
            width: 100%; max-width: 380px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); text-align: center;
        }
        .login-card .logo-container i { color: #f9bc15; font-size: 3rem; }
        .login-card h2 { color: #0b4a8d; font-weight: 800; margin-top: 10px; }
        .btn-ingresar { background-color: #2b78d2; color: white; border-radius: 12px; height: 50px; font-weight: bold; width: 100%; border: none; margin-top: 10px; }

        /* --- SISTEMA --- */
        .sidebar { background-color: #212529; color: white; padding: 15px; z-index: 1000; }
        @media (min-width: 768px) { .sidebar { min-height: 100vh; position: sticky; top: 0; } }
        @media (max-width: 767px) {
            .sidebar { position: relative; min-height: auto; padding: 10px; }
            .nav-custom { display: flex; overflow-x: auto; white-space: nowrap; gap: 5px; }
            .nav-link { font-size: 0.85rem; padding: 8px 12px !important; flex: 0 0 auto; border: 1px solid #444; }
        }
        .nav-link { color: #adb5bd; cursor: pointer; padding: 12px; border-radius: 8px; transition: 0.3s; text-decoration: none; }
        .nav-link:hover, .nav-link.active { color: white; background-color: #0d6efd; }
        .hidden { display: none !important; }
        .card { border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border-radius: 12px; margin-bottom: 15px; }
        .stock-peligro { background-color: #fff5f5 !important; color: #dc3545 !important; border-left: 5px solid #dc3545 !important; }
        input, select { height: 45px !important; border-radius: 8px !important; }
    </style>
</head>
<body>

<div id="loginScreen">
    <div class="login-card mx-3">
        <div class="logo-container mb-4"><i class="fas fa-sun"></i><h2>PRADOS DEL SOL</h2></div>
        <input type="email" id="loginEmail" class="form-control mb-3" placeholder="Correo">
        <input type="password" id="loginPass" class="form-control mb-3" placeholder="Contraseña">
        <button onclick="login()" class="btn-ingresar shadow-sm">INGRESAR</button>
    </div>
</div>

<div id="appSystem" class="container-fluid hidden">
    <div class="row">
        <div class="col-md-2 sidebar">
            <h5 class="text-center mb-4 border-bottom pb-2 text-info">SISTEMA PRADOS</h5>
            <nav class="nav-custom">
                <a class="nav-link active" onclick="showTab('stock')"><i class="fas fa-boxes me-1"></i> Stock</a>
                <a class="nav-link" onclick="showTab('ventas')"><i class="fas fa-file-invoice me-1"></i> Ventas</a>
                <a class="nav-link" onclick="showTab('historial')"><i class="fas fa-history me-1"></i> Historial</a>
                <a class="nav-link" onclick="showTab('clientes')"><i class="fas fa-users me-1"></i> Clientes</a>
                <a class="nav-link" onclick="showTab('config')"><i class="fas fa-cog me-1"></i> Config</a>
                <a class="nav-link text-danger" onclick="logout()"><i class="fas fa-power-off"></i></a>
            </nav>
        </div>

        <div class="col-md-10 p-2 p-md-4">
            <div id="stock" class="content-section">
                <div class="row">
                    <div class="col-lg-8">
                        <div class="card p-3 border-top border-success border-4 shadow-sm">
                            <h5 class="mb-3 text-success fw-bold">Carga Stock</h5>
                            <div class="row g-2">
                                <div class="col-6 col-md-4"><label class="small fw-bold">Proveedor</label><select id="selProveedor" class="form-select" onchange="filtrarArticulosAcuerdo()"></select></div>
                                <div class="col-6 col-md-4"><label class="small fw-bold">Artículo</label><select id="selArticulo" class="form-select" onchange="calcularCarga()"></select></div>
                                <div class="col-6 col-md-2"><label class="small fw-bold">Tipo</label>
                                    <select id="selTipoCarga" class="form-select" onchange="calcularCarga()"><option value="p">Pallets</option><option value="c">Cajas</option><option value="u">Unidades</option></select>
                                </div>
                                <div class="col-6 col-md-2"><label class="small fw-bold">Cant.</label><input type="number" id="inpCantidad" class="form-control" oninput="calcularCarga()"></div>
                            </div>
                            <div class="mt-3 d-flex justify-content-between align-items-center bg-light p-2 rounded">
                                <span class="small fw-bold">Total: <span id="txtTotalFinal" class="text-success fs-5">0</span> u.</span>
                                <button class="btn btn-success btn-sm" onclick="guardarIngreso()">SUMAR</button>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-4">
                        <div class="card p-3 border-top border-warning border-4 shadow-sm">
                            <h5 class="text-warning fw-bold">Uso Fábrica</h5>
                            <select id="consumoArticulo" class="form-select mb-2"></select>
                            <div class="input-group">
                                <input type="number" id="consumoCantidad" class="form-control" placeholder="Cant.">
                                <button class="btn btn-warning text-white" onclick="registrarConsumo()">RESTAR</button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="card p-2 shadow-sm">
                    <div class="table-responsive">
                        <table class="table table-sm align-middle mb-0">
                            <thead class="table-dark"><tr><th>Artículo</th><th class="text-center">Stock</th><th class="text-center">Mín.</th><th class="text-end"></th></tr></thead>
                            <tbody id="tablaStock" style="font-size: 0.9rem;"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div id="ventas" class="content-section hidden">
                <div class="card p-3 border-top border-primary border-4 shadow-sm">
                    <h5 class="text-primary fw-bold mb-3">Nuevo Despacho & Remito</h5>
                    <div class="row g-2">
                        <div class="col-12 col-md-6"><label class="small fw-bold">Cliente</label><select id="vtaCliente" class="form-select"></select></div>
                        <div class="col-12 col-md-6"><label class="small fw-bold">Producto</label><select id="vtaArticulo" class="form-select" onchange="actualizarPrevisualizacion()"></select></div>
                        <div class="col-4"><label class="small">Pallets</label><input type="number" id="vtaPallets" class="form-control" value="28" oninput="actualizarPrevisualizacion()"></div>
                        <div class="col-4"><label class="small">CxP</label><input type="number" id="vtaCxP" class="form-control" value="75" oninput="actualizarPrevisualizacion()"></div>
                        <div class="col-4"><label class="small">UxC</label><input type="number" id="vtaUxC" class="form-control" value="12" oninput="actualizarPrevisualizacion()"></div>
                    </div>
                    <div class="mt-3 p-3 bg-light rounded d-flex justify-content-around text-center border">
                        <div><small class="d-block text-muted">UNIDADES</small><span class="fw-bold text-danger fs-5" id="resTotalAceite">0</span></div>
                        <div><small class="d-block text-muted">CAJAS</small><span class="fw-bold text-primary fs-5" id="resTotalCajas">0</span></div>
                    </div>
                    <button class="btn btn-primary w-100 mt-3 py-3 fw-bold" onclick="procesarDespacho()">CONFIRMAR Y DESCARGAR REMITO</button>
                </div>
            </div>

            <div id="historial" class="content-section hidden"><div class="card p-3"><h5>Historial</h5><input type="month" id="filtroMes" class="form-control w-50 mb-3" onchange="cargarHistorial()"><table class="table table-sm"><tbody id="listaHistorial"></tbody></table></div></div>
            <div id="config" class="content-section hidden">...</div> <div id="clientes" class="content-section hidden"><div class="card p-3"><h6>Gestión Clientes</h6><input type="text" id="cliNombre" class="form-control mb-2" placeholder="Nombre"><input type="text" id="cliDir" class="form-control mb-2" placeholder="Dirección"><button class="btn btn-dark w-100" onclick="guardarCliente()">AÑADIR CLIENTE</button><table class="table mt-3"><tbody id="tablaClientes"></tbody></table></div></div>
        </div>
    </div>
</div>

<script>
    const { jsPDF } = window.jspdf;

    // CONFIG FIREBASE (Tus datos originales)
    const firebaseConfig = {
      apiKey: "AIzaSyCjYp0idCxs32QAofYLVEGcwvmd3HXy-3Y",
      authDomain: "prados-del-sol.firebaseapp.com",
      projectId: "prados-del-sol",
      storageBucket: "prados-del-sol.firebasestorage.app",
      messagingSenderId: "30316921952",
      appId: "1:30316921952:web:b0f88b9c35f270d548ef05"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    let articulos = [], proveedores = [], acuerdos = [], clientes = [], stockActualGlobal = {};

    function login() { auth.signInWithEmailAndPassword(document.getElementById('loginEmail').value, document.getElementById('loginPass').value); }
    function logout() { auth.signOut(); }
    
    auth.onAuthStateChanged(user => {
        if (user) { 
            document.getElementById('loginScreen').classList.add('hidden'); 
            document.getElementById('appSystem').classList.remove('hidden'); 
            iniciarApp(); 
        } else {
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('appSystem').classList.add('hidden');
        }
    });

    async function iniciarApp() {
        db.collection("articulos").orderBy("nombre").onSnapshot(s => {
            articulos = s.docs.map(d => ({id:d.id, ...d.data()}));
            document.getElementById('vtaArticulo').innerHTML = '<option value="">-- Prod --</option>' + articulos.map(a => `<option value="${a.nombre}">${a.nombre}</option>`).join('');
            document.getElementById('consumoArticulo').innerHTML = articulos.map(a => `<option value="${a.nombre}">${a.nombre}</option>`).join('');
        });
        db.collection("proveedores").orderBy("nombre").onSnapshot(s => {
            proveedores = s.docs.map(d => ({id:d.id, ...d.data()}));
            document.getElementById('selProveedor').innerHTML = '<option value="">-- Prov --</option>' + proveedores.map(p => `<option value="${p.nombre}">${p.nombre}</option>`).join('');
        });
        db.collection("clientes").orderBy("nombre").onSnapshot(s => {
            clientes = s.docs.map(d => ({id:d.id, ...d.data()}));
            document.getElementById('vtaCliente').innerHTML = '<option value="">-- Cliente --</option>' + clientes.map(c => `<option value="${c.nombre}">${c.nombre}</option>`).join('');
            renderClientes();
        });
        db.collection("acuerdos").onSnapshot(s => { acuerdos = s.docs.map(d => ({id:d.id, ...d.data()})); });
        db.collection("stock").onSnapshot(s => {
            const res = {}; s.docs.forEach(d => { res[d.data().articulo] = (res[d.data().articulo] || 0) + d.data().cantidad; });
            stockActualGlobal = res;
            document.getElementById('tablaStock').innerHTML = Object.keys(res).map(artNombre => {
                const artData = articulos.find(a => a.nombre === artNombre);
                const actual = res[artNombre];
                return `<tr><td>${artNombre}</td><td class="text-center fw-bold">${actual.toLocaleString()}</td><td class="text-end"><i class="fas fa-trash text-muted" onclick="limpiarArt('${artNombre}')"></i></td></tr>`;
            }).join('');
        });
    }

    // --- LÓGICA DE VENTAS Y PDF ---

    function actualizarPrevisualizacion() {
        const p = parseInt(document.getElementById('vtaPallets').value) || 0;
        const c = parseInt(document.getElementById('vtaCxP').value) || 0;
        const u = parseInt(document.getElementById('vtaUxC').value) || 0;
        document.getElementById('resTotalAceite').innerText = (p * c * u).toLocaleString();
        document.getElementById('resTotalCajas').innerText = (p * c).toLocaleString();
    }

    async function procesarDespacho() {
        const clienteNom = document.getElementById('vtaCliente').value;
        const prod = document.getElementById('vtaArticulo').value;
        const totalU = parseInt(document.getElementById('resTotalAceite').innerText.replace(/\./g,''));
        const totalC = parseInt(document.getElementById('resTotalCajas').innerText.replace(/\./g,''));
        const p = document.getElementById('vtaPallets').value;
        const cxp = document.getElementById('vtaCxP').value;

        if(!clienteNom || !prod || totalU <= 0) return alert("Faltan datos");

        const batch = db.batch();
        batch.set(db.collection("stock").doc(), { articulo: prod, cantidad: -totalU, tipo: "venta", cliente: clienteNom, fecha: firebase.firestore.FieldValue.serverTimestamp() });
        
        // Descontar cajas y etiquetas (Lógica automática)
        let pN = prod.toLowerCase();
        let caja = pN.includes("900") ? "caja de 900cc" : pN.includes("1.5") ? "caja 1.5lts" : pN.includes("5") ? "caja de 5lts" : "";
        if (caja) batch.set(db.collection("stock").doc(), { articulo: caja, cantidad: -totalC, tipo: "venta", fecha: firebase.firestore.FieldValue.serverTimestamp() });

        await batch.commit();

        // Generar Remito PDF
        const cliData = clientes.find(c => c.nombre === clienteNom);
        generarPDF({
            cliente: clienteNom,
            direccion: cliData ? cliData.dir : "S/D",
            producto: prod,
            pallets: p,
            cajas: totalC,
            unidades: totalU,
            cxp: cxp
        });

        alert("Despacho registrado y PDF generado");
    }

    function generarPDF(d) {
        const doc = new jsPDF();
        const fecha = new Date().toLocaleDateString();

        // Cabecera
        doc.setFillColor(26, 92, 55); // Verde Prados
        doc.rect(0, 0, 210, 40, 'F');
        doc.setTextColor(255, 255, 255);
        doc.setFontSize(22);
        doc.text("PRADOS DEL SOL", 15, 20);
        doc.setFontSize(10);
        doc.text("REMITO DE DESPACHO INTERNO", 15, 30);
        doc.text(`FECHA: ${fecha}`, 160, 20);

        // Datos Cliente
        doc.setTextColor(0, 0, 0);
        doc.setFontSize(12);
        doc.text("DATOS DEL DESTINO:", 15, 55);
        doc.setFont("helvetica", "bold");
        doc.text(`CLIENTE: ${d.cliente}`, 15, 62);
        doc.setFont("helvetica", "normal");
        doc.text(`DIRECCIÓN: ${d.direccion}`, 15, 68);

        // Tabla de Contenido
        doc.autoTable({
            startY: 80,
            head: [['PRODUCTO', 'PALLETS', 'CAJAS TOTALES', 'UNIDADES TOTALES']],
            body: [
                [d.producto, d.pallets, d.cajas, d.unidades.toLocaleString()]
            ],
            headStyles: { fillStyle: [43, 120, 210] },
            theme: 'grid'
        });

        doc.setFontSize(10);
        doc.text("OBSERVACIONES: Carga sujeta a control de recepción.", 15, doc.lastAutoTable.finalY + 20);

        // Firmas
        doc.line(20, 250, 80, 250);
        doc.text("Firma Despacho", 35, 255);
        doc.line(130, 250, 190, 250);
        doc.text("Firma Recepción", 145, 255);

        doc.save(`Remito_${d.cliente}_${fecha}.pdf`);
    }

    // Funciones base de v10 (simplificadas para el ejemplo)
    function showTab(id) { document.querySelectorAll('.content-section').forEach(s => s.classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); }
    function guardarCliente() { db.collection("clientes").add({nombre: document.getElementById('cliNombre').value, dir: document.getElementById('cliDir').value}); }
    function renderClientes() { document.getElementById('tablaClientes').innerHTML = clientes.map(c => `<tr><td>${c.nombre}</td><td>${c.dir}</td></tr>`).join(''); }
</script>
</body>
</html>
