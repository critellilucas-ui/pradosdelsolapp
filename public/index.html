<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prados del Sol - Sistema Integral</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', sans-serif; }
        .sidebar { min-height: 100vh; background-color: #212529; color: white; padding: 20px; position: sticky; top: 0; }
        .nav-link { color: #adb5bd; cursor: pointer; padding: 12px; border-radius: 8px; margin-bottom: 5px; display: block; text-decoration: none; }
        .nav-link:hover, .nav-link.active { color: white; background-color: #0d6efd; }
        .hidden { display: none !important; }
        .card { border: none; box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075); border-radius: 10px; }
        .list-group-item { font-size: 0.9rem; padding: 8px 12px; }
    </style>
</head>
<body>

<div id="loginScreen" class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card p-4 shadow-lg" style="width: 380px;">
        <h4 class="text-center mb-4">Prados del Sol</h4>
        <input type="email" id="loginEmail" class="form-control mb-3" placeholder="Correo">
        <input type="password" id="loginPass" class="form-control mb-3" placeholder="Contraseña">
        <button onclick="login()" class="btn btn-primary w-100">Ingresar</button>
    </div>
</div>

<div id="appSystem" class="container-fluid hidden">
    <div class="row">
        <div class="col-md-2 sidebar">
            <h5 class="text-center mb-4 border-bottom pb-3 text-info">GESTIÓN PRADOS</h5>
            <nav>
                <a class="nav-link active" onclick="showTab('stock')"><i class="fas fa-boxes me-2"></i> Inventario</a>
                <a class="nav-link" onclick="showTab('config')"><i class="fas fa-cog me-2"></i> Configuración</a>
                <a class="nav-link mt-5 text-danger" onclick="logout()"><i class="fas fa-power-off me-2"></i> Salir</a>
            </nav>
        </div>

        <div class="col-md-10 p-4">
            
            <div id="stock" class="content-section">
                <div class="card p-4 border-top border-primary border-4 mb-4">
                    <h4>Carga de Mercadería</h4>
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="fw-bold">1. Seleccionar Proveedor</label>
                            <select id="selProveedor" class="form-select" onchange="filtrarArticulosPorProveedor()"></select>
                        </div>
                        <div class="col-md-4">
                            <label class="fw-bold">2. Artículo (según acuerdo)</label>
                            <select id="selArticulo" class="form-select"></select>
                        </div>
                        <div class="col-md-4">
                            <label class="fw-bold">3. Cantidad</label>
                            <div class="input-group">
                                <input type="number" id="inpCantidad" class="form-control" oninput="calcularIngreso()">
                                <select id="selTipoCarga" class="form-select" onchange="calcularIngreso()">
                                    <option value="u">Unid</option>
                                    <option value="c">Cajas</option>
                                    <option value="p">Pallets</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="mt-3 p-2 bg-light text-center fw-bold">Total a ingresar: <span id="txtTotalFinal" class="text-primary">0</span> unidades.</div>
                    <button class="btn btn-success w-100 mt-3 fw-bold" onclick="guardarIngresoCloud()">CONFIRMAR INGRESO A STOCK</button>
                </div>

                <div class="card p-3">
                    <h5>Estado de Stock Real</h5>
                    <table class="table align-middle">
                        <thead class="table-dark"><tr><th>Artículo</th><th class="text-center">Unidades</th><th class="text-end">Acción</th></tr></thead>
                        <tbody id="tablaStockConsolidado"></tbody>
                    </table>
                </div>
            </div>

            <div id="config" class="content-section hidden">
                <div class="row g-4">
                    <div class="col-md-4">
                        <div class="card p-3">
                            <h6><i class="fas fa-truck me-2"></i>Proveedores</h6>
                            <div class="input-group mb-2">
                                <input type="text" id="confNuevoProv" class="form-control" placeholder="Nombre...">
                                <button class="btn btn-dark" onclick="guardarProveedor()">+</button>
                            </div>
                            <div id="listaProveedores" class="list-group overflow-auto" style="max-height: 200px;"></div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card p-3">
                            <h6><i class="fas fa-tag me-2"></i>Maestro de Artículos</h6>
                            <div class="input-group mb-2">
                                <input type="text" id="confNuevoArt" class="form-control" placeholder="Nombre...">
                                <button class="btn btn-info text-white" onclick="guardarArticuloCloud()">+</button>
                            </div>
                            <div id="listaArticulosMaster" class="list-group overflow-auto" style="max-height: 200px;"></div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card p-3 border-top border-warning border-4">
                            <h6><i class="fas fa-handshake me-2"></i>Vincular Prov. con Art.</h6>
                            <select id="acuerdoProv" class="form-select mb-2"></select>
                            <select id="acuerdoArt" class="form-select mb-2"></select>
                            <button class="btn btn-warning w-100 mb-2" onclick="guardarAcuerdo()">Crear Vínculo</button>
                            <div id="listaAcuerdos" class="small text-muted"></div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<script>
    // Tu configuración de Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyCjYp0idCxs32QAofYLVEGcwvmd3HXy-3Y",
      authDomain: "prados-del-sol.firebaseapp.com",
      projectId: "prados-del-sol",
      storageBucket: "prados-del-sol.firebasestorage.app",
      messagingSenderId: "30316921952",
      appId: "1:30316921952:web:b0f88b9c35f270d548ef05"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    let articulosLocal = [], provsLocal = [], acuerdosLocal = [];

    function login() { auth.signInWithEmailAndPassword(document.getElementById('loginEmail').value, document.getElementById('loginPass').value); }
    function logout() { auth.signOut(); }

    auth.onAuthStateChanged(user => {
        if (user) {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('appSystem').classList.remove('hidden');
            iniciarApp();
        } else {
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('appSystem').classList.add('hidden');
        }
    });

    function iniciarApp() {
        // Escuchar Artículos
        db.collection("articulos").orderBy("nombre").onSnapshot(s => {
            articulosLocal = s.docs.map(d => ({id:d.id, ...d.data()}));
            document.getElementById('acuerdoArt').innerHTML = articulosLocal.map(a => `<option value="${a.nombre}">${a.nombre}</option>`).join('');
            renderArticulosMaster();
        });

        // Escuchar Proveedores
        db.collection("proveedores").orderBy("nombre").onSnapshot(s => {
            provsLocal = s.docs.map(d => ({id:d.id, ...d.data()}));
            const html = '<option value="">-- Seleccionar Proveedor --</option>' + provsLocal.map(p => `<option value="${p.nombre}">${p.nombre}</option>`).join('');
            document.getElementById('selProveedor').innerHTML = html;
            document.getElementById('acuerdoProv').innerHTML = html;
            renderProveedores();
        });

        // Escuchar Acuerdos (Vínculos)
        db.collection("acuerdos").onSnapshot(s => {
            acuerdosLocal = s.docs.map(d => ({id:d.id, ...d.data()}));
            renderAcuerdos();
        });

        // Escuchar Stock
        db.collection("stock").onSnapshot(s => {
            const res = {}; s.docs.forEach(d => res[d.data().articulo] = (res[d.data().articulo] || 0) + d.data().cantidad);
            document.getElementById('tablaStockConsolidado').innerHTML = Object.keys(res).map(art => `<tr><td>${art}</td><td class="text-center fw-bold">${res[art].toLocaleString()}</td><td class="text-end"><button class="btn btn-sm btn-outline-danger" onclick="limpiarArt('${art}')">×</button></td></tr>`).join('');
        });
    }

    // LÓGICA DE FILTRADO (Lo que pediste)
    function filtrarArticulosPorProveedor() {
        const provSelected = document.getElementById('selProveedor').value;
        const articulosHabilitados = acuerdosLocal.filter(a => a.proveedor === provSelected).map(a => a.articulo);
        
        if (articulosHabilitados.length > 0) {
            document.getElementById('selArticulo').innerHTML = articulosHabilitados.map(art => `<option value="${art}">${art}</option>`).join('');
        } else {
            document.getElementById('selArticulo').innerHTML = '<option value="">Sin artículos vinculados</option>';
        }
    }

    function calcularIngreso() {
        const cant = parseInt(document.getElementById('inpCantidad').value) || 0;
        const tipo = document.getElementById('selTipoCarga').value;
        let total = cant;
        if(tipo === 'c') total = cant * 12; // Suponiendo 12 botellas por caja
        if(tipo === 'p') total = cant * 75 * 12; // Suponiendo 75 cajas por pallet
        document.getElementById('txtTotalFinal').innerText = total.toLocaleString();
    }

    async function guardarIngresoCloud() {
        const art = document.getElementById('selArticulo').value;
        const prov = document.getElementById('selProveedor').value;
        const cant = parseInt(document.getElementById('txtTotalFinal').innerText.replace(/\./g,''));
        if(!art || !prov || cant <= 0) return alert("Faltan datos");
        
        await db.collection("stock").add({ articulo: art, proveedor: prov, cantidad: cant, fecha: firebase.firestore.FieldValue.serverTimestamp() });
        alert("¡Stock actualizado!");
        document.getElementById('inpCantidad').value = "";
    }

    // Funciones de Configuración
    function guardarProveedor() { const n = document.getElementById('confNuevoProv').value; if(n) db.collection("proveedores").add({nombre: n}); document.getElementById('confNuevoProv').value=""; }
    function guardarArticuloCloud() { const n = document.getElementById('confNuevoArt').value; if(n) db.collection("articulos").add({nombre: n}); document.getElementById('confNuevoArt').value=""; }
    function guardarAcuerdo() {
        const p = document.getElementById('acuerdoProv').value;
        const a = document.getElementById('acuerdoArt').value;
        if(p && a) db.collection("acuerdos").add({proveedor: p, articulo: a});
    }

    function renderProveedores() { document.getElementById('listaProveedores').innerHTML = provsLocal.map(p => `<div class="list-group-item d-flex justify-content-between">${p.nombre} <i class="fas fa-times text-danger" onclick="db.collection('proveedores').doc('${p.id}').delete()"></i></div>`).join(''); }
    function renderArticulosMaster() { document.getElementById('listaArticulosMaster').innerHTML = articulosLocal.map(a => `<div class="list-group-item d-flex justify-content-between">${a.nombre} <i class="fas fa-times text-danger" onclick="db.collection('articulos').doc('${a.id}').delete()"></i></div>`).join(''); }
    function renderAcuerdos() { document.getElementById('listaAcuerdos').innerHTML = acuerdosLocal.map(ac => `<div class="border-bottom py-1">${ac.proveedor} ➔ ${ac.articulo} <span class="text-danger float-end" onclick="db.collection('acuerdos').doc('${ac.id}').delete()">×</span></div>`).join(''); }

    function showTab(id) { document.querySelectorAll('.content-section').forEach(s => s.classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); }
    async function limpiarArt(n) { if(confirm("Vaciar stock?")) { const snp = await db.collection("stock").where("articulo","==",n).get(); const b = db.batch(); snp.forEach(d => b.delete(d.ref)); await b.commit(); } }
</script>
</body>
</html>
