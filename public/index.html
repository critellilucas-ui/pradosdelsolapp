<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prados del Sol - Gestión por Proveedor</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', sans-serif; }
        .sidebar { min-height: 100vh; background-color: #212529; color: white; padding: 20px; position: sticky; top: 0; }
        .nav-link { color: #adb5bd; cursor: pointer; padding: 12px; border-radius: 8px; margin-bottom: 5px; display: block; text-decoration: none; }
        .nav-link:hover, .nav-link.active { color: white; background-color: #0d6efd; }
        .hidden { display: none !important; }
        .card { border: none; box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075); border-radius: 10px; }
        .resumen-carga { background-color: #e7f1ff; border-radius: 8px; padding: 15px; }
    </style>
</head>
<body>

<div id="loginScreen" class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card p-4 shadow-lg" style="width: 380px;">
        <h4 class="text-center mb-4">Prados del Sol</h4>
        <input type="email" id="loginEmail" class="form-control mb-3" placeholder="Correo">
        <input type="password" id="loginPass" class="form-control mb-3" placeholder="Contraseña">
        <button onclick="login()" class="btn btn-primary w-100">Ingresar</button>
    </div>
</div>

<div id="appSystem" class="container-fluid hidden">
    <div class="row">
        <div class="col-md-2 sidebar">
            <h5 class="text-center mb-4 border-bottom pb-3 text-info">SISTEMA PRADOS</h5>
            <nav>
                <a class="nav-link active" onclick="showTab('stock')"><i class="fas fa-boxes me-2"></i> Inventario</a>
                <a class="nav-link" onclick="showTab('config')"><i class="fas fa-cog me-2"></i> Configuración</a>
                <a class="nav-link mt-5 text-danger" onclick="logout()"><i class="fas fa-power-off me-2"></i> Salir</a>
            </nav>
        </div>

        <div class="col-md-10 p-4">
            
            <div id="stock" class="content-section">
                <div class="card p-4 mb-4 border-top border-primary border-4">
                    <h4>Carga de Mercadería</h4>
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="fw-bold">1. Proveedor</label>
                            <select id="selProveedor" class="form-select" onchange="filtrarArticulosAcuerdo()"></select>
                        </div>
                        <div class="col-md-4">
                            <label class="fw-bold">2. Artículo Acordado</label>
                            <select id="selArticulo" class="form-select" onchange="actualizarEquivalenciasCarga()"></select>
                        </div>
                        <div class="col-md-4">
                            <label class="fw-bold">3. Tipo de Carga</label>
                            <select id="selTipoCarga" class="form-select" onchange="calcularCarga()">
                                <option value="p">Pallets</option>
                                <option value="c">Cajas</option>
                                <option value="u">Unidades Sueltas</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="fw-bold">4. Cantidad</label>
                            <input type="number" id="inpCantidad" class="form-control" oninput="calcularCarga()">
                        </div>
                        <div class="col-md-8">
                            <div class="resumen-carga">
                                <span class="small text-muted">DETALLE DE CONVERSIÓN:</span>
                                <div class="d-flex justify-content-between">
                                    <span id="infoConversion">--</span>
                                    <span class="fw-bold fs-4 text-primary">Total: <span id="txtTotalFinal">0</span> u.</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <button class="btn btn-primary w-100 mt-3 py-2 fw-bold" onclick="guardarIngreso()">CONFIRMAR INGRESO</button>
                </div>

                <div class="card p-3">
                    <h5>Existencias en Stock</h5>
                    <table class="table table-striped align-middle">
                        <thead class="table-dark"><tr><th>Artículo</th><th class="text-center">Unidades</th><th class="text-end">Limpiar</th></tr></thead>
                        <tbody id="tablaStock"></tbody>
                    </table>
                </div>
            </div>

            <div id="config" class="content-section hidden">
                <div class="row g-4">
                    <div class="col-md-3">
                        <div class="card p-3">
                            <h6><i class="fas fa-truck me-2"></i>Proveedores</h6>
                            <div class="input-group mb-2">
                                <input type="text" id="confNuevoProv" class="form-control">
                                <button class="btn btn-dark" onclick="guardarProv()">+</button>
                            </div>
                            <div id="listaProvs" class="list-group"></div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card p-3">
                            <h6><i class="fas fa-tag me-2"></i>Artículos</h6>
                            <div class="input-group mb-2">
                                <input type="text" id="confNuevoArt" class="form-control">
                                <button class="btn btn-info text-white" onclick="guardarArt()">+</button>
                            </div>
                            <div id="listaArts" class="list-group"></div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="card p-3 border-top border-warning border-4">
                            <h6><i class="fas fa-handshake me-2"></i>Acuerdos de Proveedor (Unidades y Cajas)</h6>
                            <div class="row g-2">
                                <div class="col-6"><label class="small">Proveedor</label><select id="acProv" class="form-select"></select></div>
                                <div class="col-6"><label class="small">Artículo</label><select id="acArt" class="form-select"></select></div>
                                <div class="col-6"><label class="small">u. x Caja</label><input type="number" id="acUxC" class="form-control" value="12"></div>
                                <div class="col-6"><label class="small">Cajas x Pallet</label><input type="number" id="acCxP" class="form-control" value="75"></div>
                                <div class="col-12"><button class="btn btn-warning w-100 mt-2" onclick="guardarAcuerdo()">Vincular Articulo a Proveedor</button></div>
                            </div>
                            <hr>
                            <div id="listaAcuerdos" class="small"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyCjYp0idCxs32QAofYLVEGcwvmd3HXy-3Y",
      authDomain: "prados-del-sol.firebaseapp.com",
      projectId: "prados-del-sol",
      storageBucket: "prados-del-sol.firebasestorage.app",
      messagingSenderId: "30316921952",
      appId: "1:30316921952:web:b0f88b9c35f270d548ef05"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    let articulos = [], proveedores = [], acuerdos = [];

    function login() { auth.signInWithEmailAndPassword(document.getElementById('loginEmail').value, document.getElementById('loginPass').value); }
    function logout() { auth.signOut(); }

    auth.onAuthStateChanged(user => {
        if (user) { document.getElementById('loginScreen').classList.add('hidden'); document.getElementById('appSystem').classList.remove('hidden'); iniciarApp(); }
        else { document.getElementById('loginScreen').classList.remove('hidden'); document.getElementById('appSystem').classList.add('hidden'); }
    });

    function iniciarApp() {
        db.collection("articulos").orderBy("nombre").onSnapshot(s => {
            articulos = s.docs.map(d => ({id:d.id, ...d.data()}));
            document.getElementById('acArt').innerHTML = articulos.map(a => `<option value="${a.nombre}">${a.nombre}</option>`).join('');
            renderLista('listaArts', articulos, 'articulos');
        });
        db.collection("proveedores").orderBy("nombre").onSnapshot(s => {
            proveedores = s.docs.map(d => ({id:d.id, ...d.data()}));
            const html = '<option value="">-- Proveedor --</option>' + proveedores.map(p => `<option value="${p.nombre}">${p.nombre}</option>`).join('');
            document.getElementById('selProveedor').innerHTML = html;
            document.getElementById('acProv').innerHTML = html;
            renderLista('listaProvs', proveedores, 'proveedores');
        });
        db.collection("acuerdos").onSnapshot(s => {
            acuerdos = s.docs.map(d => ({id:d.id, ...d.data()}));
            renderAcuerdos();
        });
        db.collection("stock").onSnapshot(s => {
            const res = {}; s.docs.forEach(d => res[d.data().articulo] = (res[d.data().articulo] || 0) + d.data().cantidad);
            document.getElementById('tablaStock').innerHTML = Object.keys(res).map(art => `<tr><td>${art}</td><td class="text-center fw-bold">${res[art].toLocaleString()}</td><td class="text-end"><button class="btn btn-sm btn-outline-danger" onclick="limpiarArt('${art}')">×</button></td></tr>`).join('');
        });
    }

    function filtrarArticulosAcuerdo() {
        const p = document.getElementById('selProveedor').value;
        const filtrados = acuerdos.filter(a => a.proveedor === p);
        document.getElementById('selArticulo').innerHTML = '<option value="">-- Elegir Artículo --</option>' + filtrados.map(a => `<option value="${a.articulo}">${a.articulo}</option>`).join('');
    }

    function actualizarEquivalenciasCarga() {
        const p = document.getElementById('selProveedor').value;
        const art = document.getElementById('selArticulo').value;
        const ac = acuerdos.find(x => x.proveedor === p && x.articulo === art);
        if(ac) {
            document.getElementById('infoConversion').innerText = `Equivalencia: 1 Caja = ${ac.uxc} u. | 1 Pallet = ${ac.cxp} cajas.`;
            calcularCarga();
        }
    }

    function calcularCarga() {
        const cant = parseInt(document.getElementById('inpCantidad').value) || 0;
        const tipo = document.getElementById('selTipoCarga').value;
        const p = document.getElementById('selProveedor').value;
        const art = document.getElementById('selArticulo').value;
        const ac = acuerdos.find(x => x.proveedor === p && x.articulo === art);

        let total = 0;
        if(ac) {
            if(tipo === 'u') total = cant;
            if(tipo === 'c') total = cant * ac.uxc;
            if(tipo === 'p') total = cant * ac.cxp * ac.uxc;
        }
        document.getElementById('txtTotalFinal').innerText = total.toLocaleString();
    }

    async function guardarIngreso() {
        const art = document.getElementById('selArticulo').value;
        const cant = parseInt(document.getElementById('txtTotalFinal').innerText.replace(/\./g,''));
        if(!art || cant <= 0) return alert("Faltan datos");
        await db.collection("stock").add({ articulo: art, cantidad: cant, fecha: firebase.firestore.FieldValue.serverTimestamp() });
        alert("Stock Ingresado");
        document.getElementById('inpCantidad').value = "";
    }

    function guardarAcuerdo() {
        const p = document.getElementById('acProv').value, a = document.getElementById('acArt').value;
        const u = parseInt(document.getElementById('acUxC').value), c = parseInt(document.getElementById('acCxP').value);
        if(p && a) db.collection("acuerdos").add({proveedor: p, articulo: a, uxc: u, cxp: c});
    }

    function renderAcuerdos() {
        document.getElementById('listaAcuerdos').innerHTML = acuerdos.map(ac => `<div class="border-bottom py-1 d-flex justify-content-between"><span>${ac.proveedor} ➔ ${ac.articulo} (${ac.uxc} u/c, ${ac.cxp} c/p)</span><i class="fas fa-trash text-danger" onclick="db.collection('acuerdos').doc('${ac.id}').delete()"></i></div>`).join('');
    }

    function guardarProv() { const n = document.getElementById('confNuevoProv').value; if(n) db.collection("proveedores").add({nombre:n}); }
    function guardarArt() { const n = document.getElementById('confNuevoArt').value; if(n) db.collection("articulos").add({nombre:n}); }
    function renderLista(id, data, coll) { document.getElementById(id).innerHTML = data.map(item => `<div class="list-group-item d-flex justify-content-between p-1 small">${item.nombre} <i class="fas fa-times text-danger" onclick="db.collection('${coll}').doc('${item.id}').delete()"></i></div>`).join(''); }
    function showTab(id) { document.querySelectorAll('.content-section').forEach(s => s.classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); }
    async function limpiarArt(n) { if(confirm("¿Vaciar stock?")) { const snp = await db.collection("stock").where("articulo","==",n).get(); const b = db.batch(); snp.forEach(d => b.delete(d.ref)); await b.commit(); } }
</script>
</body>
</html>
