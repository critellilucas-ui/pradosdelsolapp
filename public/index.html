<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistema Prados - Remito Oficial v14</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', sans-serif; }
        .sidebar { background-color: #1a1d20; color: white; min-height: 100vh; padding: 15px; }
        .nav-link { color: #9ea7af; cursor: pointer; padding: 10px; border-radius: 5px; margin-bottom: 5px; display: block; text-decoration: none; }
        .nav-link.active, .nav-link:hover { background: #0d6efd; color: white; }
        .card { border-radius: 10px; border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .hidden { display: none !important; }
        label { font-size: 0.75rem; font-weight: bold; color: #666; text-transform: uppercase; }
    </style>
</head>
<body>

<div id="loginScreen" class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card p-4 w-100" style="max-width: 350px;">
        <h4 class="text-center text-primary mb-4 fw-bold">PRADOS DEL SOL</h4>
        <input type="email" id="loginEmail" class="form-control mb-2" placeholder="Usuario">
        <input type="password" id="loginPass" class="form-control mb-3" placeholder="Contraseña">
        <button onclick="login()" class="btn btn-primary w-100">INGRESAR</button>
    </div>
</div>

<div id="appSystem" class="container-fluid hidden">
    <div class="row">
        <div class="col-md-2 sidebar">
            <h5 class="mb-4 text-info">LOGÍSTICA</h5>
            <nav>
                <a class="nav-link active" onclick="showTab('stock')"><i class="fas fa-boxes me-2"></i> Stock</a>
                <a class="nav-link" onclick="showTab('ventas')"><i class="fas fa-truck-moving me-2"></i> Ventas</a>
                <a class="nav-link" onclick="showTab('clientes')"><i class="fas fa-address-book me-2"></i> Clientes</a>
                <a class="nav-link" onclick="showTab('historial')"><i class="fas fa-history me-2"></i> Historial</a>
                <a class="nav-link" onclick="showTab('config')"><i class="fas fa-tools me-2"></i> Config</a>
                <a class="nav-link text-danger mt-5" onclick="logout()"><i class="fas fa-power-off me-2"></i> Salir</a>
            </nav>
        </div>

        <div class="col-md-10 p-4">
            
            <div id="ventas" class="content-section hidden">
                <div class="card p-4 border-top border-primary border-4">
                    <h5 class="fw-bold mb-4">Emisión de Remito</h5>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label>Cliente</label>
                            <select id="vtaCliente" class="form-select"></select>
                        </div>
                        <div class="col-md-6">
                            <label>Producto</label>
                            <select id="vtaArticulo" class="form-select" onchange="actualizarPrevisualizacion()"></select>
                        </div>
                        <div class="col-md-4">
                            <label>Cantidad Pallets</label>
                            <input type="number" id="vtaPallets" class="form-control" value="1" oninput="actualizarPrevisualizacion()">
                        </div>
                        <div class="col-md-4">
                            <label>Cajas por Pallet</label>
                            <input type="number" id="vtaCxP" class="form-control" value="105" oninput="actualizarPrevisualizacion()">
                        </div>
                        <div class="col-md-4">
                            <label>Unidades por Caja</label>
                            <input type="number" id="vtaUxC" class="form-control" value="12" oninput="actualizarPrevisualizacion()">
                        </div>
                    </div>

                    <h6 class="mt-4 border-bottom pb-2 text-primary small">DATOS DEL TRANSPORTE</h6>
                    <div class="row g-2">
                        <div class="col-md-6"><label>Nombre del Chofer</label><input type="text" id="vtaChofer" class="form-control" placeholder="Nombre y Apellido"></div>
                        <div class="col-md-6"><label>DNI</label><input type="text" id="vtaDni" class="form-control" placeholder="Documento"></div>
                        <div class="col-md-6"><label>Patente Camión</label><input type="text" id="vtaCamion" class="form-control" placeholder="Patente"></div>
                        <div class="col-md-6"><label>Patente Semi</label><input type="text" id="vtaSemi" class="form-control" placeholder="Patente Acoplado"></div>
                    </div>

                    <div class="mt-4 p-3 bg-light border rounded">
                        <div class="row text-center">
                            <div class="col">Cajas Totales: <b id="resTotalCajas">0</b></div>
                            <div class="col">Unidades Totales: <b id="resTotalAceite" class="text-primary">0</b></div>
                        </div>
                    </div>

                    <button class="btn btn-primary w-100 mt-4 py-3 fw-bold" onclick="procesarDespacho()">CONFIRMAR Y GENERAR PDF</button>
                </div>
            </div>

            <div id="stock" class="content-section">
                <div class="card p-3 shadow-sm border-top border-success border-4">
                    <h5>Stock Disponible</h5>
                    <div class="table-responsive"><table class="table"><tbody id="tablaStock"></tbody></table></div>
                </div>
            </div>

            <div id="clientes" class="content-section hidden">
                <div class="card p-4">
                    <h5>Gestión de Clientes</h5>
                    <div class="row g-2 mb-3">
                        <div class="col-md-6"><input type="text" id="cliNombre" class="form-control" placeholder="Nombre"></div>
                        <div class="col-md-3"><input type="text" id="cliCuit" class="form-control" placeholder="CUIT"></div>
                        <div class="col-md-3"><select id="cliIva" class="form-select"><option>Responsable Inscripto</option><option>Monotributo</option></select></div>
                        <div class="col-12"><input type="text" id="cliDir" class="form-control" placeholder="Dirección"></div>
                        <button class="btn btn-dark" onclick="guardarCliente()">GUARDAR CLIENTE</button>
                    </div>
                    <div class="table-responsive"><table class="table table-sm"><tbody id="tablaClientes"></tbody></table></div>
                </div>
            </div>

            <div id="historial" class="content-section hidden">
                <div class="card p-3"><h5>Últimos Movimientos</h5><div class="table-responsive"><table class="table table-sm"><tbody id="listaHistorial"></tbody></table></div></div>
            </div>

            <div id="config" class="content-section hidden">
                <div class="card p-3"><h5>Configuración Artículos</h5><div id="listaArts"></div></div>
            </div>

        </div>
    </div>
</div>

<script>
    // --- FIREBASE ---
    const firebaseConfig = {
      apiKey: "AIzaSyCjYp0idCxs32QAofYLVEGcwvmd3HXy-3Y",
      authDomain: "prados-del-sol.firebaseapp.com",
      projectId: "prados-del-sol",
      storageBucket: "prados-del-sol.firebasestorage.app",
      messagingSenderId: "30316921952",
      appId: "1:30316921952:web:b0f88b9c35f270d548ef05"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    let articulos = [], clientes = [];

    function login() { auth.signInWithEmailAndPassword(document.getElementById('loginEmail').value, document.getElementById('loginPass').value); }
    function logout() { auth.signOut(); }
    auth.onAuthStateChanged(user => { if (user) { document.getElementById('loginScreen').classList.add('hidden'); document.getElementById('appSystem').classList.remove('hidden'); iniciarApp(); } else { document.getElementById('loginScreen').classList.remove('hidden'); document.getElementById('appSystem').classList.add('hidden'); } });

    async function iniciarApp() {
        db.collection("articulos").orderBy("nombre").onSnapshot(s => {
            articulos = s.docs.map(d => ({id:d.id, ...d.data()}));
            document.getElementById('vtaArticulo').innerHTML = '<option value="">-- Seleccionar --</option>' + articulos.map(a => `<option value="${a.nombre}">${a.nombre}</option>`).join('');
        });
        db.collection("clientes").orderBy("nombre").onSnapshot(s => {
            clientes = s.docs.map(d => ({id:d.id, ...d.data()}));
            document.getElementById('vtaCliente').innerHTML = '<option value="">-- Seleccionar --</option>' + clientes.map(c => `<option value="${c.nombre}">${c.nombre}</option>`).join('');
            renderClientes();
        });
        db.collection("stock").onSnapshot(s => {
            const res = {}; s.docs.forEach(d => { res[d.data().articulo] = (res[d.data().articulo] || 0) + d.data().cantidad; });
            document.getElementById('tablaStock').innerHTML = Object.keys(res).map(k => `<tr><td>${k}</td><td class="fw-bold">${res[k].toLocaleString()}</td></tr>`).join('');
        });
    }

    // --- VENTAS ---
    function actualizarPrevisualizacion() {
        const p = parseInt(document.getElementById('vtaPallets').value) || 0;
        const c = parseInt(document.getElementById('vtaCxP').value) || 0;
        const u = parseInt(document.getElementById('vtaUxC').value) || 0;
        document.getElementById('resTotalCajas').innerText = (p * c).toLocaleString();
        document.getElementById('resTotalAceite').innerText = (p * c * u).toLocaleString();
    }

    async function procesarDespacho() {
        const clienteNom = document.getElementById('vtaCliente').value;
        const prod = document.getElementById('vtaArticulo').value;
        const totalU = parseInt(document.getElementById('resTotalAceite').innerText.replace(/\./g,''));
        
        if(!clienteNom || !prod || totalU <= 0) return alert("Complete los datos");

        const batch = db.batch();
        batch.set(db.collection("stock").doc(), { articulo: prod, cantidad: -totalU, tipo: "venta", fecha: firebase.firestore.FieldValue.serverTimestamp() });
        await batch.commit();

        const info = {
            cliente: clienteNom,
            producto: prod,
            pallets: document.getElementById('vtaPallets').value,
            cajas: document.getElementById('resTotalCajas').innerText,
            unidades: totalU,
            chofer: document.getElementById('vtaChofer').value,
            dni: document.getElementById('vtaDni').value,
            camion: document.getElementById('vtaCamion').value,
            semi: document.getElementById('vtaSemi').value
        };

        generarRemitoFinal(info);
    }

    // --- PDF RÉPLICA EXACTA DEL FÍSICO ---
    function generarRemitoFinal(v) {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        const cli = clientes.find(c => c.nombre === v.cliente) || {};

        // CABECERA IZQUIERDA (DATOS EMISOR EXACTOS)
        doc.setFontSize(16); doc.setFont(undefined, 'bold');
        doc.text("MAXIMILIANO MEZA", 10, 15);
        doc.setFontSize(10);
        doc.text("VENTA AL POR MAYOR DE GRASA Y ACEITE", 10, 22);
        doc.setFontSize(8); doc.setFont(undefined, 'normal');
        doc.text("RUTA 24 Nº 1233", 10, 28);
        doc.text("1746 FRANCISCO ALVAREZ - PROV. DE BUENOS AIRES", 10, 32);
        doc.line(10, 35, 90, 35);
        doc.text("IVA RESPONSABLE INSCRIPTO", 10, 38);

        // CENTRO (RECUADRO R)
        doc.setLineWidth(0.5); doc.rect(95, 8, 12, 12);
        doc.setFontSize(18); doc.text("R", 98, 17);
        doc.setFontSize(7); doc.text("COD.\n 91", 108, 13);

        // CABECERA DERECHA (NÚMERO Y FECHA)
        doc.setFontSize(12); doc.setFont(undefined, 'bold');
        doc.text("REMITO", 170, 15);
        doc.setFontSize(10);
        doc.text(`Nº 0001-00000${Math.floor(Math.random() * 900) + 100}`, 130, 22);
        doc.rect(145, 25, 45, 10);
        doc.text(`Fecha:  ${new Date().toLocaleDateString()}`, 148, 31);
        doc.setFontSize(7);
        doc.text("C.U.I.T.: 20-32546093-9", 130, 40);
        doc.text("Ing.Btos.(C.M.): 20-32546093-9", 130, 44);
        doc.text("Inicio de Activ.: 12/2023", 130, 48);

        // CUERPO DESTINATARIO
        doc.line(10, 52, 200, 52);
        doc.setFontSize(10);
        doc.text(`Sr.(es):  ${v.cliente.toUpperCase()}`, 12, 58);
        doc.text(`Domicilio: __________________________________________________________________________`, 12, 65);
        doc.text(`Localidad: ${cli.dir || ''}`, 12, 72);
        doc.text(`I.V.A.: ${cli.iva || ''}`, 12, 79);
        doc.text(`C.U.I.T.: ${cli.cuit || ''}`, 130, 79);
        doc.line(10, 83, 200, 83);

        // TABLA CONTENIDO
        const contenido = [
            [`${v.pallets}`, `PALLET ACEITE x 900ML x ${v.cajas} CAJAS\n\nCHOFER: ${v.chofer}\nDNI: ${v.dni}\nCAMION: ${v.camion}\nSEMI: ${v.semi}`, ``]
        ];
        doc.autoTable({
            startY: 85,
            head: [['Cant.', 'Descripción', '']],
            body: contenido,
            theme: 'grid',
            headStyles: { fillColor: [240, 240, 240], textColor: 0, halign: 'center' },
            columnStyles: { 0: { cellWidth: 20, halign: 'center' }, 1: { cellWidth: 140 } },
            styles: { fontSize: 10, cellPadding: 5 }
        });

        // PIE DE FIRMA
        const fY = doc.lastAutoTable.finalY + 15;
        doc.text("Firma: ________________________", 15, fY);
        doc.text("Recibí Conforme", 20, fY + 5);
        doc.text("Aclaración: ________________________", 120, fY);

        // PIE LEGAL
        doc.rect(10, 275, 190, 15);
        doc.setFontSize(7);
        doc.text("C.A.I.: 51299213898174", 140, 281);
        doc.text("Vencimiento: 16/07/2026", 140, 286);
        doc.text("Impreso por Sistema Interno Prados del Sol", 15, 284);

        doc.save(`Remito_${v.cliente}.pdf`);
    }

    // --- OTRAS FUNCIONES ---
    function showTab(id) { document.querySelectorAll('.content-section').forEach(s => s.classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); document.querySelectorAll('.nav-link').forEach(n => n.classList.remove('active')); event.currentTarget.classList.add('active'); }
    function guardarCliente() { db.collection("clientes").add({ nombre: document.getElementById('cliNombre').value, cuit: document.getElementById('cliCuit').value, iva: document.getElementById('cliIva').value, dir: document.getElementById('cliDir').value }); alert("Guardado"); }
    function renderClientes() { document.getElementById('tablaClientes').innerHTML = clientes.map(c => `<tr><td>${c.nombre}</td><td><button class="btn btn-sm btn-danger" onclick="db.collection('clientes').doc('${c.id}').delete()">x</button></td></tr>`).join(''); }
</script>
</body>
</html>
