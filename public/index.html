<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistema Prados del Sol - Oficial</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body { background-color: #f0f2f5; font-family: 'Segoe UI', sans-serif; }
        .sidebar { background-color: #212529; color: white; padding: 15px; min-height: 100vh; }
        @media (max-width: 767px) { .sidebar { min-height: auto; } .nav-custom { display: flex; overflow-x: auto; gap: 5px; } }
        .nav-link { color: #adb5bd; cursor: pointer; padding: 12px; border-radius: 8px; text-decoration: none; display: block; }
        .nav-link.active, .nav-link:hover { color: white; background-color: #0d6efd; }
        .hidden { display: none !important; }
        .card { border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border-radius: 12px; margin-bottom: 15px; }
        .stock-peligro { background-color: #fff5f5 !important; color: #dc3545 !important; border-left: 5px solid #dc3545 !important; }
        label { font-size: 0.8rem; font-weight: bold; }
    </style>
</head>
<body>

<div id="loginScreen" class="container d-flex justify-content-center align-items-center vh-100 p-3">
    <div class="card p-4 shadow-lg w-100" style="max-width: 400px;">
        <h4 class="text-center mb-4 text-primary fw-bold">PRADOS DEL SOL</h4>
        <input type="email" id="loginEmail" class="form-control mb-3" placeholder="Correo">
        <input type="password" id="loginPass" class="form-control mb-3" placeholder="Contraseña">
        <button onclick="login()" class="btn btn-primary w-100">INGRESAR</button>
    </div>
</div>

<div id="appSystem" class="container-fluid hidden">
    <div class="row">
        <div class="col-md-2 sidebar">
            <h5 class="text-center mb-4 border-bottom pb-2 text-info">LOGÍSTICA</h5>
            <nav class="nav-custom">
                <a class="nav-link active" onclick="showTab('stock')"><i class="fas fa-boxes me-1"></i> Stock</a>
                <a class="nav-link" onclick="showTab('ventas')"><i class="fas fa-truck me-1"></i> Ventas</a>
                <a class="nav-link" onclick="showTab('historial')"><i class="fas fa-history me-1"></i> Historial</a>
                <a class="nav-link" onclick="showTab('clientes')"><i class="fas fa-users me-1"></i> Clientes</a>
                <a class="nav-link" onclick="showTab('config')"><i class="fas fa-cog me-1"></i> Config</a>
                <a class="nav-link text-danger" onclick="logout()"><i class="fas fa-power-off"></i></a>
            </nav>
        </div>

        <div class="col-md-10 p-4">
            <div id="stock" class="content-section">
                <div class="row">
                    <div class="col-lg-8">
                        <div class="card p-3 border-top border-success border-4 shadow-sm">
                            <h5 class="mb-3 text-success fw-bold">Carga por Proveedor</h5>
                            <div class="row g-2">
                                <div class="col-6 col-md-4"><label>Proveedor</label><select id="selProveedor" class="form-select" onchange="filtrarArticulosAcuerdo()"></select></div>
                                <div class="col-6 col-md-4"><label>Artículo</label><select id="selArticulo" class="form-select" onchange="calcularCarga()"></select></div>
                                <div class="col-6 col-md-2"><label>Tipo</label><select id="selTipoCarga" class="form-select" onchange="calcularCarga()"><option value="p">Pallets</option><option value="c">Cajas</option><option value="u">Unidades</option></select></div>
                                <div class="col-6 col-md-2"><label>Cantidad</label><input type="number" id="inpCantidad" class="form-control" oninput="calcularCarga()"></div>
                            </div>
                            <div class="mt-3 d-flex justify-content-between align-items-center bg-light p-2 rounded">
                                <span class="small fw-bold">Total: <span id="txtTotalFinal" class="text-success fs-5">0</span> u.</span>
                                <button class="btn btn-success btn-sm" onclick="guardarIngreso()">CONFIRMAR CARGA</button>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-4">
                        <div class="card p-3 border-top border-warning border-4 shadow-sm">
                            <h5 class="text-warning fw-bold">Consumo Directo</h5>
                            <select id="consumoArticulo" class="form-select mb-2"></select>
                            <div class="input-group">
                                <input type="number" id="consumoCantidad" class="form-control" placeholder="Cant.">
                                <button class="btn btn-warning text-white" onclick="registrarConsumo()">RESTAR</button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="card p-2 shadow-sm">
                    <h6 class="p-2 fw-bold">Inventario Actual</h6>
                    <div class="table-responsive"><table class="table table-sm align-middle mb-0"><thead class="table-dark"><tr><th>Artículo</th><th class="text-center">Stock</th><th class="text-center">Mín.</th><th class="text-end"></th></tr></thead><tbody id="tablaStock"></tbody></table></div>
                </div>
            </div>

            <div id="ventas" class="content-section hidden">
                <div class="card p-3 border-top border-primary border-4 shadow-sm">
                    <h5 class="text-primary fw-bold mb-3">Nuevo Despacho</h5>
                    <div class="row g-2 mb-3">
                        <div class="col-12"><label>Cliente</label><select id="vtaCliente" class="form-select"></select></div>
                    </div>
                    <div class="bg-light p-3 rounded border mb-3">
                        <div class="row g-2">
                            <div class="col-md-5"><label>Producto</label><select id="vtaArticulo" class="form-select"></select></div>
                            <div class="col-4 col-md-2"><label>Pallets</label><input type="number" id="vtaPallets" class="form-control" value="1"></div>
                            <div class="col-4 col-md-2"><label>CxP</label><input type="number" id="vtaCxP" class="form-control" value="75"></div>
                            <div class="col-4 col-md-2"><label>UxC</label><input type="number" id="vtaUxC" class="form-control" value="12"></div>
                            <div class="col-12 col-md-1 d-flex align-items-end">
                                <button class="btn btn-success w-100" onclick="agregarItemALista()"><i class="fas fa-plus"></i></button>
                            </div>
                        </div>
                    </div>
                    <div class="table-responsive mb-3">
                        <table class="table table-sm table-bordered">
                            <thead class="table-dark">
                                <tr><th>Producto</th><th class="text-center">Pallets</th><th class="text-center">Cajas</th><th class="text-center">Unidades</th><th class="text-end"></th></tr>
                            </thead>
                            <tbody id="listaVentaTemporal"></tbody>
                        </table>
                    </div>
                    <h6 class="mt-4 border-bottom pb-1 small text-muted">LOGÍSTICA</h6>
                    <div class="row g-2">
                        <div class="col-md-3"><label>Chofer</label><input type="text" id="vtaChofer" class="form-control"></div>
                        <div class="col-md-3"><label>DNI</label><input type="text" id="vtaDni" class="form-control"></div>
                        <div class="col-md-3"><label>Camión</label><input type="text" id="vtaCamion" class="form-control"></div>
                        <div class="col-md-3"><label>Semi</label><input type="text" id="vtaSemi" class="form-control"></div>
                    </div>
                    <button class="btn btn-primary w-100 mt-4 fw-bold" onclick="procesarDespachoMasivo()">GENERAR DESPACHO Y PDF</button>
                </div>
            </div>

            <div id="clientes" class="content-section hidden">
                <div class="card p-3">
                    <h5 class="fw-bold">Clientes</h5>
                    <div class="row g-2 mb-3">
                        <div class="col-md-6"><label>Nombre</label><input type="text" id="cliNombre" class="form-control"></div>
                        <div class="col-md-3"><label>CUIT</label><input type="text" id="cliCuit" class="form-control"></div>
                        <div class="col-md-3"><label>IVA</label><select id="cliIva" class="form-select"><option>Responsable Inscripto</option><option>Monotributo</option></select></div>
                        <div class="col-md-4"><label>Calle</label><input type="text" id="cliCalle" class="form-control"></div>
                        <div class="col-md-4"><label>Localidad</label><input type="text" id="cliLocalidad" class="form-control"></div>
                        <div class="col-md-4"><label>Provincia</label><input type="text" id="cliProvincia" class="form-control"></div>
                        <button class="btn btn-dark w-100 mt-2" onclick="guardarCliente()">GUARDAR CLIENTE</button>
                    </div>
                    <div id="tablaClientes"></div>
                </div>
            </div>

            <div id="historial" class="content-section hidden">
                <div class="card p-3 border-top border-info border-4">
                    <div class="d-flex justify-content-between mb-3">
                        <h5 class="fw-bold">Historial</h5>
                        <input type="month" id="filtroMes" class="form-control w-auto" onchange="cargarHistorial()">
                    </div>
                    <div class="table-responsive"><table class="table table-sm"><tbody id="listaHistorial"></tbody></table></div>
                </div>
            </div>

            <div id="config" class="content-section hidden">
                <div class="row">
                    <div class="col-md-6"><div class="card p-3"><h6>Artículos</h6><div class="input-group mb-2"><input type="text" id="confNuevoArt" class="form-control"><input type="number" id="confMinArt" class="form-control" placeholder="Mín"><button class="btn btn-primary" onclick="guardarArt()">+</button></div><div id="listaArts"></div></div></div>
                    <div class="col-md-6"><div class="card p-3"><h6>Vínculos</h6><div class="row g-1"><div class="col-6"><select id="acProv" class="form-select"></select></div><div class="col-6"><select id="acArt" class="form-select"></select></div><div class="col-6"><input type="number" id="acUxC" class="form-control" placeholder="U/C"></div><div class="col-6"><input type="number" id="acCxP" class="form-control" placeholder="C/P"></div><button class="btn btn-warning w-100" onclick="guardarAcuerdo()">VINCULAR</button></div><div id="listaAcuerdos" class="mt-2"></div></div></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // FIREBASE
    const firebaseConfig = { apiKey: "AIzaSyCjYp0idCxs32QAofYLVEGcwvmd3HXy-3Y", authDomain: "prados-del-sol.firebaseapp.com", projectId: "prados-del-sol", storageBucket: "prados-del-sol.firebasestorage.app", messagingSenderId: "30316921952", appId: "1:30316921952:web:b0f88b9c35f270d548ef05" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();
    let articulos = [], proveedores = [], acuerdos = [], clientes = [], itemsVentaActual = [];

    // AUTH
    function login() { auth.signInWithEmailAndPassword(document.getElementById('loginEmail').value, document.getElementById('loginPass').value); }
    function logout() { auth.signOut(); }
    auth.onAuthStateChanged(user => { if (user) { document.getElementById('loginScreen').classList.add('hidden'); document.getElementById('appSystem').classList.remove('hidden'); iniciarApp(); } else { document.getElementById('loginScreen').classList.remove('hidden'); document.getElementById('appSystem').classList.add('hidden'); } });

    // APP
    async function iniciarApp() {
        const hoy = new Date(); document.getElementById('filtroMes').value = hoy.getFullYear() + "-" + String(hoy.getMonth()+1).padStart(2, '0');
        db.collection("articulos").orderBy("nombre").onSnapshot(s => {
            articulos = s.docs.map(d => ({id:d.id, ...d.data()}));
            const h = articulos.map(a => `<option value="${a.nombre}">${a.nombre}</option>`).join('');
            document.getElementById('acArt').innerHTML = h; document.getElementById('vtaArticulo').innerHTML = h; document.getElementById('consumoArticulo').innerHTML = h;
            renderMaestro();
        });
        db.collection("proveedores").orderBy("nombre").onSnapshot(s => {
            proveedores = s.docs.map(d => ({id:d.id, ...d.data()}));
            const h = proveedores.map(p => `<option value="${p.nombre}">${p.nombre}</option>`).join('');
            document.getElementById('selProveedor').innerHTML = '<option value="">-- Proveedor --</option>' + h;
            document.getElementById('acProv').innerHTML = h;
        });
        db.collection("acuerdos").onSnapshot(s => { acuerdos = s.docs.map(d => ({id:d.id, ...d.data()})); renderAcuerdos(); });
        db.collection("clientes").orderBy("nombre").onSnapshot(s => {
            clientes = s.docs.map(d => ({id:d.id, ...d.data()}));
            document.getElementById('vtaCliente').innerHTML = '<option value="">-- Cliente --</option>' + clientes.map(c => `<option value="${c.nombre}">${c.nombre}</option>`).join('');
            renderClientes();
        });
        db.collection("stock").onSnapshot(s => {
            const res = {}; s.docs.forEach(d => { res[d.data().articulo] = (res[d.data().articulo] || 0) + d.data().cantidad; });
            document.getElementById('tablaStock').innerHTML = Object.keys(res).map(k => {
                const a = articulos.find(x => x.nombre === k); return `<tr><td>${k}</td><td class="text-center fw-bold">${res[k].toLocaleString()}</td><td class="text-center">${a?a.minimo:0}</td><td class="text-end"><i class="fas fa-trash text-muted" onclick="limpiarArt('${k}')"></i></td></tr>`;
            }).join('');
        });
    }

    // LOGICA VENTA
    function agregarItemALista() {
        const prod = document.getElementById('vtaArticulo').value;
        const pal = parseInt(document.getElementById('vtaPallets').value) || 0;
        const cxp = parseInt(document.getElementById('vtaCxP').value) || 0;
        const uxc = parseInt(document.getElementById('vtaUxC').value) || 0;
        if (!prod || pal <= 0) return alert("Error en datos");
        itemsVentaActual.push({ producto: prod, pallets: pal, cajas: pal * cxp, unidades: pal * cxp * uxc });
        renderTablaTemporal();
    }

    function renderTablaTemporal() {
        document.getElementById('listaVentaTemporal').innerHTML = itemsVentaActual.map((it, idx) => `<tr><td>${it.producto}</td><td class="text-center">${it.pallets}</td><td class="text-center">${it.cajas}</td><td class="text-center">${it.unidades}</td><td class="text-end"><button class="btn btn-sm btn-danger" onclick="itemsVentaActual.splice(${idx},1);renderTablaTemporal();">X</button></td></tr>`).join('');
    }

    async function procesarDespachoMasivo() {
        const cli = document.getElementById('vtaCliente').value;
        if (!cli || itemsVentaActual.length === 0) return alert("Faltan datos");
        const batch = db.batch();
        itemsVentaActual.forEach(it => {
            batch.set(db.collection("stock").doc(), { articulo: it.producto, cantidad: -it.unidades, tipo: "Venta", fecha: firebase.firestore.FieldValue.serverTimestamp() });
            let pN = it.producto.toLowerCase(), cja = "", eti = "";
            if (pN.includes("850cc") || pN.includes("900cc")) { cja = "caja de 900cc"; eti = "etiqueta de 900cc"; }
            else if (pN.includes("1.5lts")) { cja = "caja de 1.5lts"; eti = "etiqueta de 1.5lts"; }
            else if (pN.includes("5lts")) { cja = "caja de 5lts"; eti = "etiqueta de 5lts"; }
            if(cja) batch.set(db.collection("stock").doc(), { articulo: cja, cantidad: -it.cajas, tipo: "Insumo", fecha: firebase.firestore.FieldValue.serverTimestamp() });
            if(eti) batch.set(db.collection("stock").doc(), { articulo: eti, cantidad: -it.unidades, tipo: "Insumo", fecha: firebase.firestore.FieldValue.serverTimestamp() });
        });
        await batch.commit();
        generarPDFOficial({ 
            cliente: cli, items: itemsVentaActual, 
            chofer: document.getElementById('vtaChofer').value, dni: document.getElementById('vtaDni').value,
            camion: document.getElementById('vtaCamion').value, semi: document.getElementById('vtaSemi').value 
        });
        itemsVentaActual = []; renderTablaTemporal(); alert("Procesado");
    }

    function generarPDFOficial(v) {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        const cliData = clientes.find(c => c.nombre === v.cliente) || {};
        const f = new Date();
        const nroRemito = "0001-00000" + Math.floor(Math.random() * 900 + 100);

        // CABECERA FIJA
        doc.setFontSize(22); doc.setFont(undefined, 'bold');
        doc.text("MAXIMILIANO MEZA", 10, 15);
        
        doc.setFontSize(10); doc.setFont(undefined, 'normal');
        doc.text("C.U.I.T.: 20-31692195-2", 10, 21); // CUIT AGREGADO AQUÍ
        doc.text("VENTA AL POR MAYOR DE GRASA Y ACEITE", 10, 26);
        
        doc.setFontSize(8);
        doc.text("RUTA 24 Nº 1233", 10, 32);
        doc.text("1746 FRANCISCO ALVAREZ - PROV. DE BUENOS AIRES", 10, 36);
        doc.text("I.V.A. RESPONSABLE INSCRIPTO", 10, 41);

        // LOGO "R"
        doc.setLineWidth(0.4);
        doc.rect(92, 8, 16, 16);
        doc.setFontSize(26); doc.setFont(undefined, 'bold');
        doc.text("R", 96, 20);
        doc.setFontSize(7); doc.text("COD. 91", 95, 23);

        // TITULO REMITO
        doc.setFontSize(16); doc.text("REMITO", 155, 14);
        doc.setFontSize(12); doc.text("Nº " + nroRemito, 145, 21);
        doc.rect(142, 26, 50, 8);
        doc.setFontSize(10); doc.text(`FECHA: ${f.getDate()}/${f.getMonth()+1}/${f.getFullYear()}`, 145, 32);

        // DATOS CLIENTE
        doc.line(10, 52, 200, 52);
        doc.setFontSize(11); doc.setFont(undefined, 'bold');
        doc.text(`Señor(es):  ${v.cliente.toUpperCase()}`, 12, 60);
        doc.setFont(undefined, 'normal');
        doc.setFontSize(10);
        doc.text(`Domicilio:  ${cliData.calle || ''} - ${cliData.localidad || ''}`, 12, 68);
        doc.text(`I.V.A.:   ${cliData.iva || 'Resp. Inscripto'}`, 12, 84);
        doc.text(`C.U.I.T.:  ${cliData.cuit || '-'}`, 110, 84);
        doc.line(10, 90, 200, 90);

        // TABLA DE PRODUCTOS
        const tableBody = v.items.map(it => [
            it.pallets, 
            `PALLETS ${it.producto.toUpperCase()}\nTOTAL CAJAS: ${it.cajas}`
        ]);
        
        tableBody.push([
            "", 
            `DATOS DEL TRANSPORTE:\nCHOFER: ${v.chofer.toUpperCase()} - DNI: ${v.dni}\nCAMIÓN: ${v.camion.toUpperCase()} / SEMI: ${v.semi.toUpperCase()}`
        ]);

        doc.autoTable({
            startY: 92,
            head: [['CANT.', 'DESCRIPCIÓN']],
            body: tableBody,
            theme: 'grid',
            styles: { fontSize: 10, cellPadding: 4 },
            headStyles: { fillColor: [240, 240, 240], textColor: 0, fontStyle: 'bold' },
            columnStyles: { 0: { cellWidth: 25, halign: 'center' } }
        });

        const finalY = doc.lastAutoTable.finalY + 15;
        doc.text("Recibí Conforme: ________________________", 15, finalY);
        doc.save(`Remito_${v.cliente}.pdf`);
    }

    function filtrarArticulosAcuerdo() { const p = document.getElementById('selProveedor').value; const f = acuerdos.filter(a => a.proveedor === p); document.getElementById('selArticulo').innerHTML = f.map(a => `<option value="${a.articulo}">${a.articulo}</option>`).join(''); }
    function calcularCarga() { 
        const p = document.getElementById('selProveedor').value, a = document.getElementById('selArticulo').value, c = parseInt(document.getElementById('inpCantidad').value)||0, t = document.getElementById('selTipoCarga').value;
        const ac = acuerdos.find(x => x.proveedor === p && x.articulo === a);
        let tot = (ac && t==='p') ? c*ac.cxp*ac.uxc : (ac && t==='c') ? c*ac.uxc : c;
        document.getElementById('txtTotalFinal').innerText = tot.toLocaleString();
    }
    async function guardarIngreso() { const a = document.getElementById('selArticulo').value, t = parseInt(document.getElementById('txtTotalFinal').innerText.replace(/\./g,'')); if(a && t > 0) await db.collection("stock").add({ articulo: a, cantidad: t, tipo: "Ingreso", fecha: firebase.firestore.FieldValue.serverTimestamp() }); }
    function showTab(id) { document.querySelectorAll('.content-section').forEach(s => s.classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); }
    function guardarArt() { db.collection("articulos").add({nombre: document.getElementById('confNuevoArt').value.toLowerCase(), minimo: parseInt(document.getElementById('confMinArt').value)||0}); }
    function renderMaestro() { document.getElementById('listaArts').innerHTML = articulos.map(a => `<div class="p-1 border-bottom small">${a.nombre}</div>`).join(''); }
    function guardarAcuerdo() { db.collection("acuerdos").add({proveedor: document.getElementById('acProv').value, articulo: document.getElementById('acArt').value, uxc: parseInt(document.getElementById('acUxC').value), cxp: parseInt(document.getElementById('acCxP').value)}); }
    function renderAcuerdos() { document.getElementById('listaAcuerdos').innerHTML = acuerdos.map(a => `<div class="small">${a.proveedor} -> ${a.articulo}</div>`).join(''); }
    function guardarCliente() { db.collection("clientes").add({ nombre: document.getElementById('cliNombre').value, cuit: document.getElementById('cliCuit').value, iva: document.getElementById('cliIva').value, calle: document.getElementById('cliCalle').value, localidad: document.getElementById('cliLocalidad').value, provincia: document.getElementById('cliProvincia').value }); }
    function renderClientes() { document.getElementById('tablaClientes').innerHTML = clientes.map(c => `<div class="p-1 border-bottom">${c.nombre}</div>`).join(''); }
    async function cargarHistorial() {
        const m = document.getElementById('filtroMes').value; const s = new Date(m + "-01T00:00:00"), e = new Date(s.getFullYear(), s.getMonth()+1, 0, 23, 59, 59);
        const snp = await db.collection("stock").where("fecha", ">=", s).where("fecha", "<=", e).orderBy("fecha", "desc").get();
        document.getElementById('listaHistorial').innerHTML = snp.docs.map(doc => `<tr><td>${doc.data().articulo}</td><td>${doc.data().cantidad}</td></tr>`).join('');
    }
</script>
</body>
</html>
